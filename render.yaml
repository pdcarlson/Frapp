services:
  # ─── Production API ───────────────────────────────────────────
  - type: web
    name: frapp-api-prod
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    branch: production
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ─── Staging API ──────────────────────────────────────────────
  - type: web
    name: frapp-api-staging
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        # Deployed staging runs NODE_ENV=staging (its Sentry events carry
        # environment=staging, checked 2026-08-27) and Infisical staging holds
        # the same value; this placeholder is aligned to match. Blueprint edits
        # do not reach the already-created service (DEPLOYMENT.md records the
        # blueprint as not applied to the live services).
        value: staging
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
