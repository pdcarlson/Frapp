services:
  # ─── Production API ───────────────────────────────────────────
  # `autoDeploy: false` and `branch: main` record INTENT, not live state. Blueprint
  # edits do not reach an already-created service (see the staging note below and
  # DEPLOYMENT.md), so both of these still have to be set by hand in the Render
  # dashboard. `scripts/ci/production-guardrails.mjs` asserts the live values, on
  # a schedule and again as a preflight inside `deploy-production.yml` — note it
  # compares against the Render API's string form (`"no"`), not this boolean.
  #
  # Both matter, and the ORDER in which they are changed matters more:
  # `autoDeploy: yes` (this service's live setting before #1340, with
  # `autoDeployTrigger: commit`) combined with `branch: main` means every merge
  # to main deploys production with no CI gate, no migration gate, and no
  # approval. Turn auto-deploy OFF first, then change the branch.
  - type: web
    name: frapp-api-prod
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: false
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ─── Staging API ──────────────────────────────────────────────
  - type: web
    name: frapp-api-staging
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        # Deployed staging runs NODE_ENV=staging (its Sentry events carry
        # environment=staging, checked 2026-08-27) and Infisical staging holds
        # the same value; this placeholder is aligned to match. Blueprint edits
        # do not reach the already-created service (DEPLOYMENT.md records the
        # blueprint as not applied to the live services).
        value: staging
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
