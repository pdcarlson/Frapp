<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>Frapp — Chapter OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="org-config.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="screens2.jsx"></script>
  <script type="text/babel" src="screens3.jsx"></script>
  <script type="text/babel" src="backwork.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>
  <script type="text/babel" src="settings-org.jsx"></script>
  <script type="text/babel" src="settings-modules.jsx"></script>
  <script type="text/babel" src="settings-roles.jsx"></script>
  <script type="text/babel" src="settings-fields.jsx"></script>
  <script type="text/babel" src="settings-workflows.jsx"></script>
  <script type="text/babel" src="settings-dues.jsx"></script>
  <script type="text/babel" src="settings-beta-audit.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [route, setRoute] = useState("home");
      const [roleKey, setRoleKey] = useState("president");
      const [offline, setOffline] = useState(false);
      const [tweaks, setTweaks] = useState(/*EDITMODE-BEGIN*/{
        "density": "comfortable",
        "darkMode": false,
        "showProposed": true,
        "archetype": "ifc",
        "betaStyle": "sidebar_pill",
        "betaEnabled": true
      }/*EDITMODE-END*/);
      const [org, setOrg] = useState(() => {
        const base = window.makeOrgConfig(tweaks.archetype || "ifc");
        return {
          ...base,
          beta: {
            enabled: tweaks.betaEnabled !== false,
            style:   tweaks.betaStyle || "sidebar_pill",
          },
        };
      });

      useEffect(() => {
        document.documentElement.classList.toggle("dark", tweaks.darkMode);
      }, [tweaks.darkMode]);

      const currentUser = window.CURRENT_USERS[roleKey];
      const ctx = { route, setRoute, roleKey, setRoleKey, currentUser, offline, setOffline, tweaks, setTweaks, org, setOrg };

      return (
        <window.Shell ctx={ctx}>
          <window.ScreenRouter ctx={ctx} />
        </window.Shell>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
