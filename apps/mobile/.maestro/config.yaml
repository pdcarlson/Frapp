# Maestro workspace for the device smoke flows. How to run them, and what they cover:
# docs/mobile/testing.md § Automated flows (Maestro) and docs/mobile/device-pass.md.
flows:
  - "flows/*"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "Sign in with a password"
    - "Every tab and You row opens and comes back"
    - "Send a message and open its menu"
    - "Quick actions open and close"
    - "Offline pill and a queued message"
