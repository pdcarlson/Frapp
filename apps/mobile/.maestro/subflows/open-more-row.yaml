# Opens one More row by its label (ROW), checks the screen it opens is titled
# the same, screenshots it, and comes back.
appId: live.frapp.mobile
---
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      text: ${ROW}
    direction: DOWN
    timeout: 10000
- tapOn: ${ROW}
- assertVisible: "Back to More"
- assertVisible: ${ROW}
- takeScreenshot: more-${ROW}
- runFlow: back-to-more.yaml
