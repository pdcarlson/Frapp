# Device pass: every tab opens, and each More row every member sees opens its
# screen and comes back (the smoke checklist's dead-end rule, §§ 2-3). Rows
# drawn only for some chapters or roles (Documents, Study hours, Dues, Minutes,
# Invite members, Host check-in, Chapter settings) are left to the hand pass.
appId: live.frapp.mobile
name: "Every tab and More row opens and comes back"
tags:
  - smoke
---
- launchApp
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-events"
- takeScreenshot: tab-events
- tapOn:
    id: "tab-tasks"
- takeScreenshot: tab-tasks
- tapOn:
    id: "tab-more"
- takeScreenshot: tab-more
- runFlow:
    file: ../subflows/open-more-row.yaml
    env:
      ROW: "Activity"
- runFlow:
    file: ../subflows/open-more-row.yaml
    env:
      ROW: "Service hours"
- runFlow:
    file: ../subflows/open-more-row.yaml
    env:
      ROW: "Directory"
- runFlow:
    file: ../subflows/open-more-row.yaml
    env:
      ROW: "Settings"
# The edge swipe back on iOS (#3588): it must land where the back row does.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Settings"
      - assertVisible: "Back to More"
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 600
      - assertNotVisible: "Back to More"
      - assertVisible:
          id: "tab-more"
# Android's back button does the same.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Settings"
      - assertVisible: "Back to More"
      - back
      - assertNotVisible: "Back to More"
      - assertVisible:
          id: "tab-more"
- tapOn:
    id: "tab-index"
