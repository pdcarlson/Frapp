# Device pass: the tab bar's + opens the quick-actions panel and closes it
# (#3603). Tapped by id: open, the + shares its label with the scrim.
appId: live.frapp.mobile
name: "Quick actions open and close"
tags:
  - smoke
---
- launchApp
- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-plus"
- assertVisible: "Close quick actions"
- takeScreenshot: quick-actions
- tapOn:
    id: "tab-plus"
- assertVisible: "Quick actions"
- assertNotVisible: "Close quick actions"
