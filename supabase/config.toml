[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Each entry is a glob, and a bare origin matches only itself — the web app's
# email links land on `http://localhost:3000/auth/callback?next=…`, which needs
# the `/**` entry. Hosted projects carry the same shape (docs/internal/ops/deployment/supabase.md § Auth).
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/**", "http://localhost:3001", "exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# Stamps the active chapter into every issued access token as the
# `active_chapter_id` claim, which ChapterGuard treats as authoritative per
# spec/behavior/multi-tenancy.md. Local only -- hosted projects enable this in
# the dashboard (Authentication -> Hooks) or via the Management API.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "104857600" # 100MB -- the chat-archive bucket ceiling (Discord boosted-server per-file max).
# This is a GLOBAL cap for the local stack and overrides a higher per-bucket
# `storage.buckets.file_size_limit`; member-upload buckets stay pinned at 25MB
# (MAX_UPLOAD_BYTES) by their own column and by `@repo/validation`.

[realtime]
enabled = true

# The Discord importer's attachment copy (#2848, ADR-26). The platform's JWT
# check is off because the handler checks the caller's service credential
# itself: that check also accepts the newer `sb_secret_…` keys, which are not
# JWTs and which the platform check refuses. The deploy (`_deploy.yml`, through
# `scripts/ci/deploy-edge-functions.mjs`) reads this setting from here.
[functions.discord-attachment-copy]
verify_jwt = false
