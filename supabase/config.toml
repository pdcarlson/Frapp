[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001", "exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

# Stamps the active chapter into every issued access token as the
# `active_chapter_id` claim, which ChapterGuard treats as authoritative per
# spec/behavior/multi-tenancy.md. Local only -- hosted projects enable this in
# the dashboard (Authentication -> Hooks) or via the Management API.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.external.google]
enabled = false

[storage]
enabled = true
file_size_limit = "26214400" # 25MB

[realtime]
enabled = true
