# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "assertive"
  review_status: false
  request_changes_workflow: false
  review_details: true

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    labels:
      - "!do-not-review"
    ignore_title_keywords:
      - "[skip review]"

  path_filters:
    - "!dist/**"
    - "!coverage/**"
    - "!**/*.generated.*"

  path_instructions:
    - path: "apps/api/**"
      instructions: |
        Prioritize security, input validation, SQL injection risks, auth guard
        coverage, permission checks, DTO validation, Swagger metadata, and
        OpenAPI/API SDK drift. Protected endpoints should use the expected
        SupabaseAuthGuard, ChapterGuard, and PermissionsGuard chain where
        applicable, with explicit RequirePermissions declarations for protected
        reads and writes.

    - path: "apps/web/**"
      instructions: |
        Review App Router server/client boundaries, browser exposure of
        sensitive data, accessibility, loading states, empty states, error
        states, and offline/degraded behavior.

    - path: "apps/mobile/**"
      instructions: |
        Watch for iOS/Android behavior differences, Expo integration issues,
        AsyncStorage and notification permission handling, effect cleanup,
        subscriptions, and degraded/offline UX.

    - path: "packages/**"
      instructions: |
        Shared packages affect API, web, and mobile consumers. Flag breaking
        exports, hidden coupling, or uncoordinated downstream changes.

    - path: ".github/workflows/**"
      instructions: |
        Treat workflow changes as release infrastructure. Check secret exposure,
        minimal permissions, production branch conditions, workflow_run
        conclusions, required-check names, and branch-protection documentation
        drift.

    - path: "supabase/migrations/**"
      instructions: |
        Treat every migration as production-impacting. Flag destructive SQL,
        missing RLS on new tables, lock-heavy operations, downtime risk, missing
        rollback notes, and API contract incompatibility.

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
