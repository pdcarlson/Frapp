# CodeRabbit posts on ready PRs (OSS tier on this public repo). It must not
# submit GitHub review events: a write-access CHANGES_REQUESTED blocks squash
# via the ruleset "1 review requesting changes by reviewers with write access"
# (#1875, #1880). Drafts stay skipped so they do not consume the 1/hour slot.
#
# DO NOT DELETE THIS FILE WHILE THE CODERABBIT GITHUB APP IS INSTALLED.
# CodeRabbit's retirement was decided 2026-09-18 (ADR-14, 2026-09-18 amendment)
# but not executed: the App is still installed and still reviewing. Removing
# this config does not disable CodeRabbit — it drops it to unconfigured
# defaults, where request_changes_workflow is ON, which reproduces the #1875
# squash block that no agent can clear (GITHUB_PAT 401, no MCP dismiss tool,
# author cannot self-approve). Correct order: uninstall the App, then delete.
language: "en-US"
reviews:
  request_changes_workflow: false
  auto_review:
    drafts: false
