name: Deploy API

# Triggered ONLY after CI workflow completes successfully.
# This ensures broken code never deploys.
#
# STAGING ONLY. Production is deployed by `deploy-production.yml`, a manual
# `workflow_dispatch` that names an exact commit — see that file's header for
# why the `production` branch was retired (#1340).
#
# Staging deploys the commit CI verified, after `migrate-staging`, through the
# Render API (#2505), when anything the API image is built from changed since
# the commit staging serves. No deploy hook, which built whatever `main`'s tip
# was rather than this commit; Render auto-deploy must be off too (#2679), since
# it builds every push before CI and migrations.
#
# Secrets use UNIFIED names (no _STAGING / _PRODUCTION suffixes).
# `RENDER_API_KEY` is a `staging` environment secret. `API_HEALTHCHECK_URL` is
# not a GitHub secret: `.github/actions/infisical-secrets` injects it from the
# Infisical `staging` environment at job time. See
# docs/internal/environment/SECRETS_MANAGEMENT.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Eligibility: CI passed on a push to this repo ──────────────────────
  # The name is historical: this job used to filter changed paths. That filter
  # first stopped gating `migrate-staging` (a filter that answers "false" for
  # any reason silently skips a migration), then the API deploy (#2505:
  # `deploy-staging` plans from the commit staging serves, because a per-push
  # filter skipped API commits whose own run never deployed). What is left is
  # the eligibility condition below, which `migrate-staging`, `deploy-staging`
  # and `deploy-outcome` all key on. Kept under this name because
  # `deploy-alert.mjs` reads it as the gate job.
  check-changes:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: CI passed on a push
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "CI passed for $HEAD_SHA; migrate-staging applies what is pending and deploy-staging plans the deploy."

  # ── Run database migrations (staging) ──────────────────────────────────
  # Staging auto-applies on every merge to `main`. This job is the ONLY
  # sanctioned way migrations reach staging; DB_PROMOTION_RUNBOOK.md documents
  # it as automatic and no longer asks a human to run `supabase db push`.
  #
  # It deliberately runs on EVERY successful CI run on main, NOT only when the
  # push touched `supabase/migrations/`. Two reasons, both incident-driven:
  #
  #   1. The old `migrations-changed == 'true'` gate was computed from
  #      `git diff HEAD~1` with a fail-open `|| echo ""`. Any git failure read
  #      as "no migrations changed" and the job skipped, green and silent. Two
  #      migrations reached main and were never applied to staging exactly this
  #      way.
  #   2. Even a correct filter only ever describes ONE push. If an apply is
  #      skipped or fails, nothing retries it — the next migration-bearing push
  #      is the next chance, which may be weeks out. Running unconditionally
  #      makes every merge to main a retry: `supabase db push` applies whatever
  #      is pending and is a no-op when nothing is, so the steady-state cost is
  #      one `link` + one `migration list` per merge and the failure mode is
  #      self-healing instead of permanent.
  #
  # The dry-run step is not decoration: it runs `migration list` first, so the
  # log records what WAS pending before anything is applied. When the apply step
  # then fails, the run itself says what it was trying to do.
  migrate-staging:
    needs: check-changes
    if: |
      needs.check-changes.result == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    # Serialize staging applies. Two merges landing close together would
    # otherwise run two `db push` calls against one database at once.
    #
    # `cancel-in-progress: false` is the important half: cancelling a run
    # mid-`db push` is how a database ends up half-migrated. Queued runs cost
    # a few minutes; a partially applied migration costs a manual recovery.
    #
    # Honest limit: this lock covers GitHub Actions runs ONLY. It cannot stop a
    # human running `supabase db push` against staging from a laptop — nothing
    # in GitHub can. That is why DB_PROMOTION_RUNBOOK.md now tells humans not to
    # push to staging by hand at all, and the drift gate (ci.yml) is what
    # catches it when someone does anyway.
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    steps:
      # Pinned to the commit that triggered the run, as deploy-staging's is.
      # Without a `ref:` a `workflow_run` checkout takes the default branch's
      # TIP, and this job sits behind the `db-migrate-staging` lock — so two
      # merges landing minutes apart let run A, queued for commit1, check out
      # commit2 and apply ITS migration set while reporting success for
      # commit1. The job's whole premise is that a named commit's migrations
      # reach staging.
      #
      # It also decides which `.github/actions/…` the steps below resolve, since
      # a local `uses: ./…` is read from this workspace.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Inject staging deploy secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Supabase CLI
        uses: ./.github/actions/supabase-cli

      - name: Run migrations (dry-run)
        run: node scripts/run-migration.mjs --env staging --dry-run

      - name: Run migrations (apply)
        run: node scripts/run-migration.mjs --env staging

  # ── Deploy API to staging ──────────────────────────────────────────────
  deploy-staging:
    needs: [check-changes, migrate-staging]
    # No path gate: every green run on `main` gets here, and the first step
    # decides whether anything needs deploying (see "Plan the deploy").
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (needs.migrate-staging.result == 'success' || needs.migrate-staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    # `deploy-outcome` reads the plan: a `stale` run neither raises nor closes
    # the alert, a successful `forward` one doesn't close it (a failed one
    # raises it), and a `current` one reports that nothing needed deploying.
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    # The deploy poll's own ceiling is 20 minutes and the served-commit check's
    # is 5; this bounds the job just past both.
    timeout-minutes: 30
    # One staging deploy at a time. Two merges landing close together would
    # otherwise create two Render deploys at once, and Render cancels the older,
    # which this job rightly reports as "did not ship". Queued, the older run
    # deploys first; the newer one then plans against what that left serving.
    #
    # `cancel-in-progress: false`, as on migrate-staging. GitHub still replaces
    # a PENDING run when a third arrives; that job ends `cancelled`, which
    # `deploy-outcome` reports as a failure, as it does for migrate-staging.
    # It is rare (CI on main is serialized, so it takes three runs inside one
    # deploy) and closes on the next run, which plans from the served commit
    # and so deploys the replaced run's changes too.
    concurrency:
      group: deploy-api-staging
      cancel-in-progress: false
    steps:
      # The checkout supplies the local composite action below (`uses: ./…`
      # resolves against the runner's workspace), the deploy scripts, and the
      # history the plan step diffs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit that triggered the run, as migrate-staging pins it: on a
          # `workflow_run` event GitHub defaults the checkout to the default
          # branch's tip, not the commit that triggered the run. This job runs
          # last, behind migrate-staging's serialized `db push`, so the window
          # in which `main` can move is the widest in the workflow — and if it
          # moved over the local action below, this deploy would fail for a
          # commit whose own tree is fine.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history: the plan diffs from the commit staging serves, which
          # can be any number of commits back.
          fetch-depth: 0
          # Nothing here talks to the remote after checkout; the plan's git
          # calls are local. A third-party action runs next (via the
          # composite), and this job holds staging secrets — same reasoning as
          # deploy-outcome below and staging-conformance.yml.
          persist-credentials: false

      - name: Inject staging deploy secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Compare this commit with the one staging serves (`/health`'s
      # `commit`) and with `main`'s tip. `deploy` when anything the API image
      # is built from changed since the served commit, which carries forward
      # an API commit whose own run never deployed and retries after a failed
      # build. `current` when nothing did. Both only for `main`'s tip. A run
      # `main` moved past while it queued still moves staging `forward` when it
      # is newer than the served commit (the tip's own run may never deploy),
      # but only the tip's run may close the alert. Anything else it would do
      # is `stale`: no deploy, no verify, no alert change. When it can't tell,
      # the tip deploys. The reasoning is in the script header.
      - name: Plan the deploy
        id: plan
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/plan-staging-deploy.mjs

      # Deploy-by-commit through the Render API (#2505), the same script
      # `deploy-production.yml` uses. The deploy hook this replaces could not
      # name a commit: it built the tip of `main` at the moment it fired, which
      # can be a newer commit than the one CI verified and migrate-staging
      # migrated for. Render auto-deploy must be off (staging-conformance
      # asserts it; #2679), so that this is the only thing that deploys
      # staging: an auto-deploy starting mid-run can cancel this deploy.
      #
      # The script polls the deploy id it created to a terminal state, so a
      # failed build fails THIS job and `deploy-outcome` raises the P1 alert.
      # That is the outcome `verify-deployments.yml` used to watch from the
      # side; it was retired with this change.
      - name: Deploy the commit to Render
        if: steps.plan.outputs.deploy == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d6lqsq75r7bs73c2fdc0
          SERVICE_LABEL: frapp-api-staging
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/deploy-render-production.mjs

      # Render's `live` means the new instance passed Render's own probe,
      # `GET /health`, which always 2xxs. This step asks the API itself: poll
      # `/health/ready` until it answers 2xx AND reports the planned commit
      # (this run's when it deployed, else the one staging already served).
      # The old smoke loop took any 2xx, which the previous instance also
      # gives while the new one switches in, so it could pass a deploy that
      # never took traffic. It runs on a `current` plan too, so a green
      # non-stale run always means staging was seen serving and ready. A missing
      # API_HEALTHCHECK_URL fails (it used to warn and exit 0), in the plan
      # step before this one.
      - name: Verify staging serves the commit
        if: steps.plan.outputs.plan != 'stale'
        env:
          SERVICE_LABEL: frapp-api-staging
          DEPLOY_SHA: ${{ steps.plan.outputs.verify_sha }}
        run: node scripts/ci/verify-served-commit.mjs

  # ── Deploy outcome: alert on failure, state plainly when nothing deployed ──
  # Terminal reporting job. Exists because a `workflow_run` failure lands on no
  # commit and no PR, and a run that skips every deploy job still reports GREEN.
  # Together those hid a 100% deploy failure rate for 71 days (#763): 44 of 44
  # executing runs failed while the Actions list read "mostly healthy", because
  # the other 46 runs were green-because-empty.
  #
  # Writes a step summary + annotation saying whether this run DEPLOYED, FAILED,
  # found staging UP TO DATE (deploy-staging's plan was `current`), or was
  # SUPERSEDED (plan `stale`, or a successful `forward` deploy of a commit that
  # isn't main's tip), and upserts/closes a single tracking issue so that
  # "alert issue open" means "the deploy path is broken right now". A
  # superseded run touches no issue; a run where neither job ran is a failure
  # (#2505).
  deploy-outcome:
    needs: [check-changes, migrate-staging, deploy-staging]
    # always(): reporting on failed and skipped jobs is the entire point.
    # Gated on check-changes having actually run, so a CI-failed run stays with
    # skip-on-failure below and this never fires on a run that was never eligible.
    if: always() && needs.check-changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The ONLY job here with any write scope. Kept job-scoped deliberately so
      # the workflow-level `contents: read` stays exactly as narrow as it was
      # for every other job.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # deploy-alert.mjs is dependency-free (global fetch + node:fs on the
      # runner's preinstalled Node) — no setup-node, no npm ci, matching
      # ci-wake.yml's deliberately minimal action surface.
      - name: Report deploy outcome and alert on failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required. deploy-alert.mjs serves several workflows (its
          # ALERT_CONFIGS table) and refuses to guess: an absent or unknown
          # value is a hard error, because resolving to the wrong config would
          # report one workflow's job results into another's alert issue.
          ALERT_CONFIG: deploy-api
          DEPLOY_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/deploy-alert.mjs

  # ── Skip notification (CI failed) ──────────────────────────────────────
  skip-on-failure:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: CI did not pass
        run: |
          echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Skipping deploy — CI must pass before deployments are triggered."
