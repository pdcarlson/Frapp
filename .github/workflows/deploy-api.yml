name: Deploy API

# Triggered ONLY after CI workflow completes successfully.
# This ensures broken code never deploys.
#
# STAGING ONLY. Production is deployed by `deploy-production.yml`, a manual
# `workflow_dispatch` that names an exact commit — see that file's header for
# why the `production` branch was retired (#1340).
#
# Secrets use UNIFIED names (no _STAGING / _PRODUCTION suffixes).
# GitHub's `environment:` field scopes each job to the correct environment,
# so `RENDER_DEPLOY_HOOK_URL` resolves to the staging value here. See
# docs/internal/environment/ENV_REFERENCE.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Check if deploy-relevant files changed ─────────────────────────────
  check-changes:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.filter.outputs.api-changed }}
      migrations-changed: ${{ steps.filter.outputs.migrations-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history. The previous `fetch-depth: 2` could not resolve HEAD~1
          # on a merge commit, and the diff below swallowed that failure — see
          # the fail-open note in the next step.
          fetch-depth: 0

      # This filter now gates ONLY the API deploy. It deliberately no longer
      # gates `migrate-staging`: a path filter that answers "false" for any
      # reason silently skips a migration, which is exactly the incident this
      # workflow is being hardened against. See `migrate-staging` below.
      #
      # It also no longer fails open to "nothing changed". The old form was
      # `git diff --name-only HEAD~1 2>/dev/null || echo ""`, so ANY git failure
      # (unresolvable HEAD~1 on a shallow merge commit being the live one)
      # produced an empty file list, which every grep below read as "no changes"
      # and reported as a clean skip. A deploy that silently does nothing is the
      # worst available outcome, so an unreadable diff now assumes EVERYTHING
      # changed and warns loudly. The cost of being wrong is a redundant deploy;
      # the cost of the old behaviour was a change that never shipped.
      - name: Detect changed paths
        id: filter
        run: |
          set -euo pipefail

          # The changed-file list goes to a FILE, and every filter greps that
          # file directly. It must never go back to being `echo "$CHANGED" |
          # grep -q`, which is how the production promotion (#1330) silently
          # skipped its API deploy:
          #
          #   `grep -q` exits the moment it matches. That closes the pipe while
          #   `echo` is still writing the remaining paths, `echo` dies with
          #   EPIPE, and `pipefail` promotes that EPIPE to the pipeline's exit
          #   status — so a SUCCESSFUL match reported failure and the filter
          #   answered "nothing changed".
          #
          #   It is a race, which is why it stayed hidden: it needs a list
          #   bigger than the 64KiB pipe buffer AND `grep` to exit before
          #   `echo` drains. #1330's diff was 1674 paths / 82KiB, matching
          #   `apps/api/` at line 202 and `supabase/migrations/` at line 1621
          #   — so the early API match left ~20KiB unwritten and reproduced in
          #   roughly one run in five, while the late migrations match had
          #   almost nothing left to write and effectively never did. That run
          #   lost the coin flip: migrations were detected, the API was not.
          #
          # Grepping a file has no writer process to kill, so an early `-q`
          # exit is harmless and match order cannot change the answer.
          CHANGED_FILE="${RUNNER_TEMP:-/tmp}/deploy-api-changed-paths.txt"

          if git diff --name-only HEAD~1 > "$CHANGED_FILE"; then
            DIFF_OK=1
          else
            DIFF_OK=0
            : > "$CHANGED_FILE"
            echo "::warning::Could not diff HEAD~1 for ${{ github.event.workflow_run.head_sha }}. Assuming all deploy-relevant paths changed rather than skipping the deploy."
          fi

          echo "Changed paths in this push: $(wc -l < "$CHANGED_FILE")"

          if [ "$DIFF_OK" -eq 0 ] || grep -qE '^(apps/api/|packages/validation/|packages/typescript-config/)' "$CHANGED_FILE"; then
            echo "api-changed=true" >> "$GITHUB_OUTPUT"
            echo "API-related files changed (or the diff was unreadable)."
          else
            echo "api-changed=false" >> "$GITHUB_OUTPUT"
            echo "No API-related files changed."
          fi

          if [ "$DIFF_OK" -eq 0 ] || grep -qE '^supabase/migrations/' "$CHANGED_FILE"; then
            echo "migrations-changed=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed (or the diff was unreadable)."
          else
            echo "migrations-changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed in this push (migrate-staging runs regardless)."
          fi

  # ── Run database migrations (staging) ──────────────────────────────────
  # Staging auto-applies on every merge to `main`. This job is the ONLY
  # sanctioned way migrations reach staging; DB_PROMOTION_RUNBOOK.md documents
  # it as automatic and no longer asks a human to run `supabase db push`.
  #
  # It deliberately runs on EVERY successful CI run on main, NOT only when the
  # push touched `supabase/migrations/`. Two reasons, both incident-driven:
  #
  #   1. The old `migrations-changed == 'true'` gate was computed from
  #      `git diff HEAD~1` with a fail-open `|| echo ""`. Any git failure read
  #      as "no migrations changed" and the job skipped, green and silent. Two
  #      migrations reached main and were never applied to staging exactly this
  #      way.
  #   2. Even a correct filter only ever describes ONE push. If an apply is
  #      skipped or fails, nothing retries it — the next migration-bearing push
  #      is the next chance, which may be weeks out. Running unconditionally
  #      makes every merge to main a retry: `supabase db push` applies whatever
  #      is pending and is a no-op when nothing is, so the steady-state cost is
  #      one `link` + one `migration list` per merge and the failure mode is
  #      self-healing instead of permanent.
  #
  # The dry-run step is not decoration: it runs `migration list` first, so the
  # log records what WAS pending before anything is applied. When the apply step
  # then fails, the run itself says what it was trying to do.
  migrate-staging:
    needs: check-changes
    if: |
      needs.check-changes.result == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    # Serialize staging applies. Two merges landing close together would
    # otherwise run two `db push` calls against one database at once.
    #
    # `cancel-in-progress: false` is the important half: cancelling a run
    # mid-`db push` is how a database ends up half-migrated. Queued runs cost
    # a few minutes; a partially applied migration costs a manual recovery.
    #
    # Honest limit: this lock covers GitHub Actions runs ONLY. It cannot stop a
    # human running `supabase db push` against staging from a laptop — nothing
    # in GitHub can. That is why DB_PROMOTION_RUNBOOK.md now tells humans not to
    # push to staging by hand at all, and the drift gate (ci.yml) is what
    # catches it when someone does anyway.
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject staging deploy secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Supabase CLI
        uses: ./.github/actions/supabase-cli

      - name: Run migrations (dry-run)
        run: node scripts/run-migration.mjs --env staging --dry-run

      - name: Run migrations (apply)
        run: node scripts/run-migration.mjs --env staging

  # ── Deploy API to staging ──────────────────────────────────────────────
  deploy-staging:
    needs: [check-changes, migrate-staging]
    if: |
      always() &&
      needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.api-changed == 'true' &&
      github.event.workflow_run.head_branch == 'main' &&
      (needs.migrate-staging.result == 'success' || needs.migrate-staging.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # This job needs no source of its own — it fires a Render deploy hook and
      # health-checks the result. The checkout is here because the next step
      # calls a LOCAL composite action, and `uses: ./…` resolves against the
      # runner's workspace: without a checkout the action file is not on disk
      # and the step fails with "Can't find 'action.yml'". Every other job that
      # calls one already had a checkout for its own reasons; this one did not.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The SAME ref check-changes uses, and for the same reason: on a
          # `workflow_run` event GitHub defaults the checkout to the default
          # branch's tip, not the commit that triggered the run. This job runs
          # last, behind migrate-staging's serialized `db push`, so the window
          # in which `main` can move is the widest in the workflow — and if it
          # moved over the local action below, this deploy would fail for a
          # commit whose own tree is fine.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Nothing here talks to git after checkout; it only needs the action
          # file on disk. A third-party action runs next (via the composite),
          # and this job holds staging secrets — same reasoning as
          # deploy-outcome below and staging-conformance.yml.
          persist-credentials: false

      - name: Inject staging deploy secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured for staging environment."
            exit 1
          fi
          echo "Triggering Render staging deploy..."
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for deploy to propagate
        run: sleep 15

      - name: Health smoke check
        run: |
          if [ -z "$API_HEALTHCHECK_URL" ]; then
            echo "::warning::API_HEALTHCHECK_URL not configured — skipping"
            exit 0
          fi
          # API_HEALTHCHECK_URL points at /health, which is Render's own
          # healthCheckPath (render.yaml) and must stay a plain liveness probe
          # that always 2xxs. /health/ready is the strict readiness sibling
          # that 503s on a degraded dependency (see #302) — hit that here so
          # this gate actually fails on a DB/Storage outage instead of reading
          # a 200 with a discarded "degraded" body.
          READY_URL="${API_HEALTHCHECK_URL%/}/ready"
          echo "Waiting for staging API to become healthy..."
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 2 --max-time 5 "$READY_URL" >/dev/null 2>&1; then
              echo "✅ Staging API is healthy."
              exit 0
            fi
            echo "Attempt $i/6 — retrying in 20s..."
            sleep 20
          done
          echo "::error::Staging health check failed after 6 attempts (2 min)."
          exit 1

  # ── Deploy outcome: alert on failure, state plainly when nothing deployed ──
  # Terminal reporting job. Exists because a `workflow_run` failure lands on no
  # commit and no PR, and a run that skips every deploy job still reports GREEN.
  # Together those hid a 100% deploy failure rate for 71 days (#763): 44 of 44
  # executing runs failed while the Actions list read "mostly healthy", because
  # the other 46 runs were green-because-empty.
  #
  # Writes a step summary + annotation saying whether this run DEPLOYED or
  # DECLINED to deploy, and upserts/closes a single tracking issue so that
  # "alert issue open" means "the deploy path is broken right now".
  deploy-outcome:
    needs: [check-changes, migrate-staging, deploy-staging]
    # always(): reporting on failed and skipped jobs is the entire point.
    # Gated on check-changes having actually run, so a CI-failed run stays with
    # skip-on-failure below and this never fires on a run that was never eligible.
    if: always() && needs.check-changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The ONLY job here with any write scope. Kept job-scoped deliberately so
      # the workflow-level `contents: read` stays exactly as narrow as it was
      # for every other job.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # deploy-alert.mjs is dependency-free (global fetch + node:fs on the
      # runner's preinstalled Node) — no setup-node, no npm ci, matching
      # ci-wake.yml's deliberately minimal action surface.
      - name: Report deploy outcome and alert on failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required. deploy-alert.mjs serves this workflow and
          # deploy-vercel-staging.yml, and refuses to guess: an absent or
          # unknown value is a hard error, because resolving to the wrong
          # config would report one workflow's job results into the other's
          # alert issue.
          ALERT_CONFIG: deploy-api
          DEPLOY_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/deploy-alert.mjs

  # ── Skip notification (CI failed) ──────────────────────────────────────
  skip-on-failure:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: CI did not pass
        run: |
          echo "CI workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Skipping deploy — CI must pass before deployments are triggered."
