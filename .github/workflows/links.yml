name: Links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: links-${{ github.ref }}
  # Cancellable on a PR ref, NEVER on main. `github.ref` is `refs/heads/main`
  # for every push to main, so an unguarded `cancel-in-progress: true` puts
  # every merge's push run in one group and the first commit's run is cancelled
  # by the second's — leaving required checks concluded `cancelled`, which
  # `validate-deploy-sha.mjs` refuses to deploy. Cancelling a PR run costs a
  # re-push; cancelling a main push run costs a commit's deployability.
  # Full account: scripts/ci/validate-deploy-sha.mjs § CANCELLED_CONCLUSIONS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Internal links + heading anchors only. `--offline` never hits external
      # URLs; options are passed as CLI args (no lychee.toml) to stay
      # version-stable across lychee releases.
      #
      # design-system/reference holds committed design-tool HTML exports. They
      # are consumed as source text, not rendered — their runtime scaffolding
      # (support.js, ios-frame.jsx) is deliberately not committed, so they carry
      # references that resolve nowhere. Excluding them as link *sources* keeps
      # that out of the gate; markdown links pointing *into* the directory are
      # still checked. Today the exclusion is belt-and-braces (lychee's walk
      # does not extract `<script src>`, and it only reaches these files when
      # the directory is passed explicitly) — it guards against that changing.
      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --include-fragments --no-progress --exclude-path spec/ui/design-system/reference docs spec AGENTS.md README.md CONTRIBUTING.md"
          fail: true
