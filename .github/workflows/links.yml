name: Links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: links-${{ github.ref }}
  # Cancellable on a PR ref, NEVER on main. `github.ref` is `refs/heads/main`
  # for every push to main, so an unguarded `cancel-in-progress: true` puts
  # every merge's push run in one group and the first commit's run is cancelled
  # by the second's — leaving required checks concluded `cancelled`, which
  # `validate-deploy-sha.mjs` refuses to deploy. Cancelling a PR run costs a
  # re-push; cancelling a main push run costs a commit's deployability.
  # Full account: scripts/ci/validate-deploy-sha.mjs § CANCELLED_CONCLUSIONS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Internal links + heading anchors only. `--offline` never hits external
      # URLs; options are passed as CLI args (no lychee.toml) to stay
      # version-stable across lychee releases.
      #
      # design-system/reference holds committed design-tool HTML exports. They
      # are consumed as source text, not rendered — their runtime scaffolding
      # (support.js, ios-frame.jsx) is deliberately not committed, so they carry
      # references that resolve nowhere. Excluding them as link *sources* keeps
      # that out of the gate; markdown links pointing *into* the directory are
      # still checked.
      #
      # That exclusion was described here as belt-and-braces, on the grounds
      # that lychee's walk does not extract `<script src>` and only reaches
      # these files when the directory is passed explicitly. **Half of that is
      # wrong, and it was measured when web-greenfield/reference/web-framework.dc.html
      # landed.** `spec` IS passed explicitly, lychee walks into it, and it
      # extracts `<img src>` even though it does skip `<script src>`: that one
      # board produced 10 errors from its image references and none from its
      # `./support.js`. So the exclusion is load-bearing for any export carrying
      # an image, and it is the extraction rule, not the walk, that spares the
      # script tags.
      #
      # The second exclusion below is scoped to the ONE file rather than its
      # directory, because that directory also holds a README.md whose relative
      # links and heading anchors this job is the only coverage for. Excluding
      # the directory would silently drop 13 checked links.
      #
      # `.claude` is in the input list because agent-authored markdown carries
      # relative links and heading anchors that nothing else in the repo
      # validates — this job is their only coverage. Added in #1597, where it
      # found zero broken links on the day it landed, so this is coverage, not a
      # fix. Measured 2026-09-04: 18 files (17 SKILL.md plus commands/next.md),
      # ~5.0k lines, 214 markdown link targets —
      # `git ls-files '.claude/**/*.md' | xargs wc -l` and the same list piped
      # through `xargs grep -oE '\]\([^)]*\)' | wc -l`. NOT --exclude-path:
      # that flag excludes, and `.claude` is meant to be checked. (It was
      # asserted here that --exclude-path "takes exactly one value" — it takes
      # one value per occurrence and the flag repeats, verified on lychee
      # 0.24.2. That was never the reason `.claude` is an input.)
      #
      # apps/web/AGENTS.md and .github/pull_request_template.md are named
      # explicitly because the walked roots below (docs, spec, .claude) do not
      # reach them and the repo-root file list covers only the root AGENTS.md.
      # Both were read by the four docs gates deleted in this change. Listing
      # them here does not restore that: neither carries a markdown link today,
      # so lychee finds nothing to check. It is scope for the links they may
      # grow. What those files actually lost is the backticked-path check, and
      # nothing replaces it (see docs/internal/ci-cd/DOCS_CI.md).
      - name: Check internal markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --include-fragments --no-progress --exclude-path spec/ui/design-system/reference --exclude-path spec/ui/web-greenfield/reference/web-framework.dc.html docs spec .claude AGENTS.md README.md CONTRIBUTING.md apps/web/AGENTS.md .github/pull_request_template.md"
          fail: true
