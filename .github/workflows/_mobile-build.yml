          TYPE="${REF%% *}"
          OBJECT="${REF#* }"
          if [ "$TYPE" = "tag" ]; then
            OBJECT="$(gh_api "repos/$REPO/git/tags/$OBJECT" --jq '.object.sha')"
          fi
          if [ "$OBJECT" != "$DEPLOY_SHA" ]; then
            # Said apart from a failed read, which also fails this step: the
            # record job forbids a hand upload only for this.
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::error::The latest tag, $LATEST, is on $OBJECT, not $DEPLOY_SHA: production has shipped another commit since this run. Store builds are made only from the latest v* tag; dispatch Deploy production for it instead."
            exit 1
          fi
          echo "$DEPLOY_SHA is the latest tag ($LATEST)."

      # A Release build uploads its debug symbols and source maps to Sentry,
      # and fails without SENTRY_AUTH_TOKEN (ENV_REFERENCE.md § apps/mobile).
      # EAS's variable of that name is Secret and never reaches this runner;
      # the `automation` environment's does, when it holds one. Without it
      # the build skips the upload rather than failing, as the OTA publish
      # does (`_mobile-update.yml`), and the summary says the binary's native
      # crashes will stay unsymbolicated. Names only: no value enters this
      # step.
      - name: Turn the Sentry upload off when no token reached this job
        env:
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_SENTRY_AUTH_TOKEN" = "true" ]; then
            echo "The build uploads its debug symbols and source maps to Sentry."
            exit 0
          fi
          echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          echo "::warning::The automation environment has no SENTRY_AUTH_TOKEN, so this build uploads nothing to Sentry, and its native crash reports there stay unsymbolicated."
          echo "> The \`automation\` environment has no \`SENTRY_AUTH_TOKEN\`, so this build uploaded no debug symbols or source maps to Sentry, and its crash reports there stay unsymbolicated." >> "$GITHUB_STEP_SUMMARY"

      # One script in both jobs. eas-cli takes the next build number from
      # EAS (`appVersionSource: remote`, `autoIncrement`) and prints it as
      # "Incremented buildNumber/versionCode from N to M"; that line is the
      # only place a local build reports it, so the step reads it from the
      # log, colour codes removed, and refuses unless exactly one is there.
      # The version is `expo.version` in `app.json`, which no profile
      # overrides. The step hands on what the record job writes, in the shape
      # `record-shipped-builds.mjs` reads.
      - name: Build (Release, signed with EAS's credentials)
        id: build
        timeout-minutes: 60
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PLATFORM: android
          EAS_PLATFORM: ANDROID
          ARCHIVE: ${{ runner.temp }}/frapp.aab
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/eas-build.log"
          STATUS=0
          (cd apps/mobile && eas build --local --platform "$PLATFORM" --profile production --non-interactive \
            --output "$ARCHIVE") 2>&1 | tee "$LOG" || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::eas build --local --platform $PLATFORM exited $STATUS. Production is live and tagged. The log above says why."
            exit "$STATUS"
          fi
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::eas build --local exited 0 but wrote no $ARCHIVE."
            exit 1
          fi
          set -e
          NUMBERS="$(perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$LOG" \
            | grep -oE '(Incremented (buildNumber|versionCode) from [0-9]+ to|Initialized (buildNumber|versionCode) with) [0-9]+' \
            | grep -oE '[0-9]+$' || true)"
          if [ "$(printf '%s' "$NUMBERS" | grep -c .)" -ne 1 ]; then
            echo "::error::Couldn't read the one build number eas-cli set from its log (found: ${NUMBERS:-none}). The binary is at $ARCHIVE but is not uploaded unrecorded."
            exit 1
          fi
          VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::HEAD moved to $HEAD_SHA during the build, off the shipped $DEPLOY_SHA. Not uploading."
            exit 1
          fi
          BUILD="$(jq -cn --arg p "$EAS_PLATFORM" --arg v "$VERSION" --arg b "$NUMBERS" --arg sha "$HEAD_SHA" \
            '{platform: $p, status: "FINISHED", appVersion: $v, appBuildVersion: $b, gitCommitHash: $sha}')"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Built $PLATFORM $VERSION ($NUMBERS) from $HEAD_SHA."

      # The same check as before the build, a build's length later: a ship
      # made meanwhile (a rollback, say) has moved production, and nothing
      # built from this SHA may upload after that.
      - name: Check the SHA is still the latest tag, before uploading
        id: tag-before-upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # `scripts/ci/lib/release-tag.mjs`'s rule, the one `release.yml` bumps
          # from: the top `v*` tag by version, which must be a plain `vX.Y.Z`.
          # Written again here because this job runs the deployed tree, not
          # the lib's; `deploy-production-mobile.test.mjs` runs both on the
          # same tags.
          #
          # Each read: three attempts, 1s then 5s apart, and no retry of a 4xx
          # other than 429 (`download-migration-snapshot`'s `gh_api`, whose
          # header says why). A read that still fails fails the step, which
          # the record job keeps apart from a moved tag.
          GH_ERR="$RUNNER_TEMP/tag-check-gh-stderr.txt"
          gh_api() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api "$@" 2>"$GH_ERR")"; then
                printf '%s\n' "$out"
                return 0
              fi
              cat "$GH_ERR" >&2
              if grep -Eq '\(HTTP 4[0-9][0-9]\)' "$GH_ERR" && ! grep -q '(HTTP 429)' "$GH_ERR"; then
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt == 1 ? 1 : 5 ))
              fi
            done
            return 1
          }
          TAGS="$(gh_api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')"
          # Ordered by git itself, the order release.yml reads: GNU `sort -V`
          # disagrees with it on tags like `v-next` and `v1.02.0`. A scratch
          # repository holds each name as a ref on the empty tree, so nothing
          # is fetched and the deployed checkout is untouched.
          ORDER="$RUNNER_TEMP/tag-order"
          rm -rf "$ORDER"
          git -c init.defaultBranch=main init -q "$ORDER"
          EMPTY_TREE="$(git -C "$ORDER" mktree < /dev/null)"
          printf '%s\n' "$TAGS" | awk -v oid="$EMPTY_TREE" 'NF { print "create refs/tags/" $0 " " oid }' \
            | git -C "$ORDER" update-ref --stdin
          LATEST="$(git -C "$ORDER" tag --list 'v*' --sort=-version:refname | sed -n 1p)"
          if [ -z "$LATEST" ]; then
            echo "::error::No v* tag exists, so nothing says what production serves. Refusing to go on."
            exit 1
          fi
          if ! [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest v* tag, $LATEST, is not a vX.Y.Z release, so nothing says what production serves (release-tag.mjs refuses it too). Refusing to go on."
            exit 1
          fi
          REF="$(gh_api "repos/$REPO/git/ref/tags/$LATEST" --jq '.object.type + " " + .object.sha')"
          TYPE="${REF%% *}"
          OBJECT="${REF#* }"
          if [ "$TYPE" = "tag" ]; then
            OBJECT="$(gh_api "repos/$REPO/git/tags/$OBJECT" --jq '.object.sha')"
          fi
          if [ "$OBJECT" != "$DEPLOY_SHA" ]; then
            # Said apart from a failed read, which also fails this step: the
            # record job forbids a hand upload only for this.
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::error::The latest tag, $LATEST, is on $OBJECT, not $DEPLOY_SHA: production has shipped another commit since this run. Store builds are made only from the latest v* tag; dispatch Deploy production for it instead."
            exit 1
          fi
          echo "$DEPLOY_SHA is the latest tag ($LATEST)."

      # The same as the iOS job's upload.
      - name: Upload Android to the Play internal track (not promoted)
        id: upload
        timeout-minutes: 15
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ARCHIVE: ${{ runner.temp }}/frapp.aab
        run: |
          set -euo pipefail
          eas submit --platform android --profile production --path "$ARCHIVE" --non-interactive --no-wait | tee "$RUNNER_TEMP/submit.log"
          ID="$(grep -oE 'submissions/[0-9a-f-]{36}' "$RUNNER_TEMP/submit.log" | head -n 1 | cut -d/ -f2 || true)"
          [ -n "$ID" ] || echo "::warning::eas submit printed no submission link, so the confirm job can't check this upload. Check it on expo.dev."
          echo "submission=$ID" >> "$GITHUB_OUTPUT"

  record:
    name: Record the uploads in shipped-builds.json (opens a PR)
    needs: [ios, android]
    # After a failed build too: the other platform may have uploaded, and the
    # summary is how the run says what happened. After two skipped builds as
    # well, which only a platform this file doesn't know causes: the script
    # refuses it by name.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The record PR's number, empty when none opened, for `merge-record`.
    outputs:
      pr: ${{ steps.record.outputs.pr }}
    environment:
      name: automation
      deployment: false
    # The writes go through the App token, never this job's GITHUB_TOKEN.
    permissions:
      contents: read
    steps:
      # The dispatched `main` (`github.sha`), not the shipped commit: the
      # script judges the build jobs' outputs, so it can't come from the tree
      # that was built.
      - name: Checkout (trusted ref)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The trusted ref, so the local action is the one `main` carries. Node
      # only: the script imports Node built-ins and nothing installed.
      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      # The PR base sync App (`pr-base-sync.yml`): a PR opened with
      # GITHUB_TOKEN starts no workflow, so its required checks would never
      # report. Only when something was uploaded, so a run that built nothing
      # can't fail here for a reason unrelated to it.
      - name: Mint the base-sync App token
        id: app-token
        if: ${{ needs.ios.outputs.upload == 'success' || needs.android.outputs.upload == 'success' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Runs on a failed mint too, so the summary lists the entries to add by
      # hand.
      - name: Record the uploaded builds and summarise the run
        id: record
        if: ${{ !cancelled() }}
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_BUILD: ${{ needs.ios.outputs.build }}
          IOS_UPLOAD: ${{ needs.ios.outputs.upload }}
          IOS_TAG_MOVED: ${{ needs.ios.outputs.tag-moved }}
          IOS_TAG_BEFORE_BUILD: ${{ needs.ios.outputs.tag-before-build }}
          IOS_TAG_BEFORE_UPLOAD: ${{ needs.ios.outputs.tag-before-upload }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_BUILD: ${{ needs.android.outputs.build }}
          ANDROID_UPLOAD: ${{ needs.android.outputs.upload }}
          ANDROID_TAG_MOVED: ${{ needs.android.outputs.tag-moved }}
          ANDROID_TAG_BEFORE_BUILD: ${{ needs.android.outputs.tag-before-build }}
          ANDROID_TAG_BEFORE_UPLOAD: ${{ needs.android.outputs.tag-before-upload }}
          DEPLOY_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/ci/record-shipped-builds.mjs

  confirm:
    name: Confirm the store uploads finished (waits out Expo's queue)
    needs: [ios, android]
    # Beside `record`, after a failed build too: the other platform may have
    # been submitted. Only when an upload step succeeded, so a run that
    # submitted nothing has nothing to wait for; the script fails an upload
    # that succeeded without a submission id.
    if: ${{ !cancelled() && (needs.ios.outputs.upload == 'success' || needs.android.outputs.upload == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: automation
      deployment: false
    permissions:
      contents: read
    steps:
      # The dispatched `main`, as in `record`: the script holds EXPO_TOKEN, so
      # it must not come from the tree that was built.
      - name: Checkout (trusted ref)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node only, no install: the script uses fetch and Node built-ins, so
      # no installed package runs with the token.
      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      # Its own deadline ends the poll at 280, so it reports before the step
      # is killed at 290. No `*_BUILD`: a build made on a runner has no EAS
      # build id, and a failed upload is sent again by its submission id.
      - name: Wait for each submission to finish on EAS
        timeout-minutes: 290
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_UPLOAD: ${{ needs.ios.outputs.upload }}
          IOS_SUBMISSION: ${{ needs.ios.outputs.submission }}
          ANDROID_UPLOAD: ${{ needs.android.outputs.upload }}
          ANDROID_SUBMISSION: ${{ needs.android.outputs.submission }}
          DEADLINE_MINUTES: "280"
          POLL_SECONDS: "60"
        run: node scripts/ci/confirm-store-submissions.mjs

  # The record PR merges itself only once every upload finished (Paul,
  # 2026-11-12): `confirm` can wait hours in Expo's queue, and a PR that
  # merged first would put an upload that then failed on `main` (a
  # `mobile-v*` tag for a build in no store, and an `auto` plan that sends
  # that version an update no binary can take). A failed or unfinished upload
  # leaves auto-merge off and says so on the PR. Its own job, so the App token
  # never shares a runner with `confirm`'s EXPO_TOKEN. The App token, as in
  # `record`: a merge the GITHUB_TOKEN enabled would start no push workflows,
  # `mobile-release-tags.yml` among them.
  merge-record:
    name: Let the record PR merge itself once every upload finished
    needs: [record, confirm]
    # AUTO_MERGE is read in the step: a job's `if` can't see `env`.
    if: ${{ !cancelled() && needs.record.outputs.pr != '' && needs.confirm.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: automation
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Mint the base-sync App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Turn on auto-merge, or say why not
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.record.outputs.pr }}
          CONFIRMED: ${{ needs.confirm.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$AUTO_MERGE" != "true" ]; then
            echo "AUTO_MERGE is off: merge #${PR} by hand." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CONFIRMED" = "success" ]; then
            # Expo's queue usually outlasts the PR's CI, so the PR may already
            # be green: GitHub refuses auto-merge on a PR it could merge now,
            # and the plain merge (branch protection still applies) takes over.
            if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash \
              || gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash; then
              echo "Every upload finished; #${PR} merges itself once its required checks pass." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Auto-merge could not be turned on for #${PR}. Merge it by hand."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Every upload finished, but auto-merge could not be turned on ([the run](${RUN_URL})). Merge this by hand once its checks pass."
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Not every upload finished ([the run](${RUN_URL})'s \`confirm\` job says which), so auto-merge stays off. Drop the entry of any build that failed, then merge this by hand."
          fi
