name: Mobile build

# Build the commit production serves for the stores, upload it without
# releasing it, and record what was uploaded (#3111). A reusable workflow:
# `on: workflow_call` only, and its one caller is `deploy-production.yml`'s
# `mobile` job, which runs only when its `mobile-plan` job names a platform:
# the one the operator chose in the `mobile_build` input, or, under `auto`,
# each platform no OTA update can reach. Only after a `full`, non-dry-run
# ship whose deploy and tag both succeeded. Paul chose this opt-in shape on 2026-10-01
# over building on every ship: most ships don't touch the app, and every iOS
# release is another App Review cycle.
#
# ── Built on GitHub's runners, not Expo's (Paul, 2026-11-16, #5162) ─────────
# Expo's Free plan meters cloud builds, and its credits ran out on
# 2026-11-14 until 2026-12-01: the 11-14 and 11-16 ships each went live and
# then failed here, at the build start ("You've reached your included build
# credits"). So each platform builds on its own GitHub runner with
# `eas build --local`, as `staging-app.yml` has since 2026-11-13: iOS on
# `macos-latest`, Android on `ubuntu-latest`, both free for a public
# repository and metered by nothing. A local build still takes its signing
# credentials, its `production` EAS environment variables and its next build
# number from EAS with `EXPO_TOKEN`, so no certificate or keystore is a GitHub
# secret and the build numbers stay EAS's one sequence. Three things a local
# build doesn't get, and how each job makes up for them:
#   * eas.json's `image`. The iOS job picks the runner's newest stable
#     Xcode 26 itself, with `staging-app.yml`'s step (#2477).
#   * File EAS variables. `GOOGLE_SERVICES_JSON`, which `app.config.js`
#     requires of a production Android build (#1826), is a File variable, and
#     `eas build --local` reads the variables without File contents. The
#     Android job fetches the file with `eas env:pull` and points the
#     variable at it.
#   * Secret EAS variables. The Sentry upload in a Release build needs
#     `SENTRY_AUTH_TOKEN`, so each job passes the `automation` environment's
#     secret of that name, the one `_mobile-update.yml` uses. Without one the
#     build skips the upload (`SENTRY_DISABLE_AUTO_UPLOAD`) and says so in the
#     summary: the binary still ships, and its native crashes stay
#     unsymbolicated.
#
# ── What it enforces that a maintainer's laptop did by memory ──────────────
#   1. A binary is never newer than production. It is built from `inputs.sha`,
#      the SHA the caller's `validate` job checked and its `deploy` job just
#      verified live, and from nothing else; and only while that SHA is still
#      the latest `v*` tag, checked before the build starts and again before
#      anything uploads. A ship made meanwhile (a rollback, say), or a re-run
#      after one, stops the store build instead of uploading a commit
#      production has moved off. A build from `main`'s tip could call routes
#      production doesn't serve (#2526).
#   2. Every uploaded build is listed in `apps/mobile/store/shipped-builds.json`,
#      which arms the required `api-contract-check` gate. The `record` job
#      opens that PR (`scripts/ci/record-shipped-builds.mjs`).
#
# ── One job per platform ────────────────────────────────────────────────────
# `ios` and `android` each build, check and upload their own platform, side
# by side, and one platform's failure doesn't touch the other's. A job hands
# on what it built (`build`: the version and build number the binary sends in
# `X-Client-Version`, and its commit), its upload's outcome and submission id,
# and its two tag checks. The steps that do the same thing in both jobs run
# the same script (`deploy-production-mobile.test.mjs` pins each pair), and
# the setup steps match `staging-app.yml`'s.
#
# ── Submit, record, then confirm (#3483) ────────────────────────────────────
# Expo's free plan queues each submission for about 47 minutes before it
# uploads anything (2026-11-05). `eas submit --wait` held the upload step for
# all of it, hit the step's ceiling, and turned an upload that worked into a
# red run with no record PR. So each upload step submits with `--no-wait`:
# it ends once EAS accepts the submission, and hands the submission id on.
# The `record` job records a build once its submission is accepted. The
# `confirm` job then waits out the queue beside it, polling each submission
# (`scripts/ci/confirm-store-submissions.mjs`), and goes red with what to do
# when one errors, is cancelled, is still queued at its deadline, can't be
# read, or succeeded with no submission id.
#
# ── Upload, never release ───────────────────────────────────────────────────
# iOS goes to TestFlight and Android to the Play `internal` track
# (`submit.production` in `apps/mobile/eas.json`). Submitting for App Review
# and promoting a Play track stay a human's clicks. `--no-auto-testflight-setup`
# keeps CI from creating a TestFlight group: who tests a build is a person's
# call too.
#
# ── Jobs, environments and approvals ────────────────────────────────────────
# Every job names `automation`, which has no reviewers
# (docs/ci-cd/agent-infra.md § GitHub environments and bootstrap secrets), so
# none costs an Approve click. Never name `production` here. `snapshot` reads
# no secret, but the caller's `secrets: inherit` reaches every job here, so it
# names the main-only environment too (`workflow-secrets-scope.test.mjs` B).
#   * `ios` and `android` hold `EXPO_TOKEN` and `SENTRY_AUTH_TOKEN`, and run
#     the deployed tree.
#   * `record` holds the base-sync App token and runs the trusted ref.
#   * `confirm` holds `EXPO_TOKEN` too, but runs the trusted ref with nothing
#     installed: it only reads each submission's status from EAS's API.
#   * `snapshot` publishes the migration snapshot as the store build starts.
#     This run stays in flight while the builds and Expo's submission queue
#     take their time, and `migration-snapshot.yml` otherwise publishes only
#     when a Deploy production run completes; the required PR migration gates
#     would judge production against the pre-ship snapshot all that time
#     (`download-migration-snapshot`'s header).
#
# ── The trust split (ci-cd.md § The deploy job's trust split, #2801, #2824) ─
# `ios` and `android` check out the deployed commit and run nothing local
# from it as a check: no `./.github/actions/…` action (it would load from the
# deployed tree), and the steps that judge the result are inline shell. `npm
# ci` and the eas-cli install run before any step that names a token, and only
# the steps that call `eas` name one, so no install script of the job's own
# runs with it; the eas-cli install runs no install scripts at all. Honest
# limits, the ones `staging-app.yml` states: `eas build --local` copies the
# project and installs its dependencies again, install scripts included,
# inside the step that holds `EXPO_TOKEN` and `SENTRY_AUTH_TOKEN`; the JS
# bundle and the native build run the tree's lockfile-pinned dependencies in
# that process too; an install script from the job's own `npm ci` can still
# leave something a later step runs, and, on a hosted runner with sudo, read a
# secret the job references from the runner's memory; and eas-cli and the
# local-build plugin it fetches (an exact version, eas-cli's own pin) resolve
# their dependencies at install time, not from a lockfile (#3118). Isolating
# the install from the token is #3125. The deployed commit is an ancestor of
# `main` with green CI, so its own tree is already-reviewed code.
#
# ── Failure ─────────────────────────────────────────────────────────────────
# Production is live and tagged before this starts, so nothing here rolls
# anything back or turns the deploy's summary red. A failed build, or a
# submission EAS refused, reds that platform's job, which reds the run with
# the caller's job name saying the ship stands, and the `record` job's
# summary says what was built, what was submitted and what to do next. A
# submission EAS accepted and then failed to upload reds `confirm`, whose
# summary says what to do with its record entry (ADR-24 I4: never a silent
# skip). **Re-run failed jobs** builds only the platform that failed, with a
# new build number, and refuses once production has shipped another commit
# (`docs/ops/deployment/mobile.md` § 6.6).

on:
  workflow_call:
    inputs:
      sha:
        description: "The validated commit Deploy production just shipped"
        required: true
        type: string
      platform:
        description: "ios, android or all"
        required: true
        type: string

permissions:
  contents: read

# The record PR merges itself (Paul, 2026-11-12), as the What's new bot PR
# does: the next `auto` ship can't see a build until its entry is on `main`.
# `merge-record` turns auto-merge on only once `confirm` saw every upload
# finish, so a failed upload never lands on `main`. "false" goes back to
# merging it by hand.
env:
  AUTO_MERGE: "true"

jobs:
  # Beside the builds, not before them: a publish takes under a minute, and a
  # failed one shouldn't hold up the store build. It reds its own row.
  # A `workflow_dispatch` is one of the few events a `GITHUB_TOKEN` may start
  # a run with, and the download action trusts a dispatched publish whose
  # commit is on `main`.
  snapshot:
    name: Publish the migration snapshot now (this run stays open for the store build)
    runs-on: ubuntu-latest
    environment:
      name: automation
      deployment: false
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Migration snapshot on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run migration-snapshot.yml --repo "$REPO" --ref main

  ios:
    name: Build iOS on GitHub's runner, then upload it to TestFlight
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: macos-latest
    # Main only, no reviewers: no Approve click (see the header).
    environment:
      name: automation
      deployment: false
    # The build's 70 and the upload's 15, plus the installs.
    timeout-minutes: 120
    permissions:
      contents: read
    # What was built, the upload's outcome and submission id, and the two tag
    # checks, nothing else: the record job needs no more, and a job output
    # carrying a masked value is dropped.
    outputs:
      build: ${{ steps.build.outputs.build }}
      upload: ${{ steps.upload.outcome }}
      submission: ${{ steps.upload.outputs.submission }}
      # `true` when either tag check found production on another commit;
      # each check's outcome says whether it ran and passed.
      tag-moved: ${{ steps.tag-before-build.outputs.moved || steps.tag-before-upload.outputs.moved }}
      tag-before-build: ${{ steps.tag-before-build.outcome }}
      tag-before-upload: ${{ steps.tag-before-upload.outcome }}
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      # Before any checkout: an input this job doesn't know, or a token that
      # never arrived, costs nothing. Names only: the check is
      # `secrets.EXPO_TOKEN != ''`, so no value enters this step.
      - name: Check the inputs, and that EXPO_TOKEN reached this job
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          PLATFORM: ${{ inputs.platform }}
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios|android|all) ;;
            *)
              echo "::error::platform must be ios, android or all; got '$PLATFORM'."
              exit 1
              ;;
          esac
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character lowercase commit SHA; got '$DEPLOY_SHA'."
            exit 1
          fi
          if [ "$HAS_EXPO_TOKEN" != "true" ]; then
            echo "::error::EXPO_TOKEN did not reach this job. It is a secret of the automation environment, and a called job gets it only when its caller passes secrets: inherit. Production is live and tagged; nothing was built. The owner steps are in docs/ops/deployment/mobile.md § 6.6."
            exit 1
          fi

      # The validated SHA and nothing else (rule 1 in the header). The caller
      # passes `needs.validate.outputs.sha`; `deploy-production-mobile.test.mjs`
      # pins both ends, and that no step here moves the tree.
      - name: Check out the shipped commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          # Nothing here talks to the remote after checkout, and this job
          # holds EXPO_TOKEN. The tag checks ask the API instead.
          persist-credentials: false

      # A local build ignores eas.json's `image`, so the runner's own Xcode is
      # what counts. A beta is skipped, and with no stable Xcode 26 the job
      # stops: a build on an older Xcode would not be the app's build (#2477).
      # `staging-app.yml`'s step, word for word.
      - name: Pick the newest stable Xcode 26 on the runner
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -n 1 || true)"
          if [ -z "$newest" ]; then
            echo "::error::No stable Xcode 26 on this runner image (${ImageOS:-unknown}); the app pins Xcode 26 (#2477)."
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          echo "Building with $(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      # Hand-written, not ./.github/actions/node-setup: a local action loads
      # from the tree on disk, which is the deployed commit here. The ref,
      # version and `package-manager-cache: false` must match node-setup's
      # step (`node-setup-action.test.mjs`).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # `eas build` evaluates `apps/mobile/app.config.js` through the
      # project's own `expo` package, so the workspace's dependencies are
      # needed, as on a laptop. Before any token is in a step's environment.
      - name: Install dependencies
        run: npm ci

      # The version is exact, and `--before` keeps every dependency to a
      # version published before that date: eas-cli ships no shrinkwrap, and
      # several of its dependencies are caret ranges, so without it each run
      # would take whatever was published since and run it beside EXPO_TOKEN.
      # It is not a lockfile: npm can still pick a different pre-cutoff
      # version when one is deprecated or unpublished later, or when the
      # runner's Node or npm changes, and nothing checks integrity (#3118).
      # `--ignore-scripts`: those dependencies' install scripts would run
      # unreviewed, and none is needed (on 24.8.0's tree, checked 2026-10-01,
      # only dtrace-provider's, a no-op on Linux that bunyan loads optionally,
      # and protobufjs's, which only prints). eas-cli has none of its own, and
      # npm still links the `eas` bin.
      # 24.8.0 was published 2026-09-24; it is the version `mobile.md` § 6.6's
      # non-interactive table and this file's flags (`--local`, `--output`,
      # `--path`, `env:pull`, `--no-auto-testflight-setup`) were read from.
      # Move the two together, deliberately, re-reading `eas build --help` and
      # `eas submit --help`. The line is the same in both build jobs, and
      # `scripts/eas.mjs` (`npm run eas`) reads it to install the same thing on
      # a laptop and in the other workflows. Its `parseEasCliPin` is the one
      # parse of this line, and refuses two that differ (#3124).
      - name: Install EAS CLI
        run: npm install --global --ignore-scripts --before=2026-10-01 eas-cli@24.8.0

      # A local build packs the working tree, uncommitted changes included,
      # unless `requireCommit` is set (it isn't). So the tree must be exactly
      # the SHA: HEAD on it, and nothing changed or added that git doesn't
      # ignore.
      - name: Confirm the tree is exactly the shipped commit
        id: confirm
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::HEAD is $HEAD_SHA, not the shipped $DEPLOY_SHA. Refusing to build anything else."
            exit 1
          fi
          DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ -n "$DIRTY" ]; then
            echo "::error::The install changed the tree, and the build would carry the change:"
            printf '%s\n' "$DIRTY"
            exit 1
          fi

      # The SHA must still be what production serves: the latest `v*` tag,
      # which the `release` job mints on the live SHA. Asked of the API, not
      # the checkout, because the second run of this script comes after the
      # build, and a later ship (a rollback) may have tagged another commit
      # since. The same script runs again before the upload.
      - name: Check the SHA is still the latest tag, before building
        id: tag-before-build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # `scripts/ci/lib/release-tag.mjs`'s rule, the one `release.yml` bumps
          # from: the top `v*` tag by version, which must be a plain `vX.Y.Z`.
          # Written again here because this job runs the deployed tree, not
          # the lib's; `deploy-production-mobile.test.mjs` runs both on the
          # same tags.
          #
          # Each read: three attempts, 1s then 5s apart, and no retry of a 4xx
          # other than 429 (`download-migration-snapshot`'s `gh_api`, whose
          # header says why). A read that still fails fails the step, which
          # the record job keeps apart from a moved tag.
          GH_ERR="$RUNNER_TEMP/tag-check-gh-stderr.txt"
          gh_api() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api "$@" 2>"$GH_ERR")"; then
                printf '%s\n' "$out"
                return 0
              fi
              cat "$GH_ERR" >&2
              if grep -Eq '\(HTTP 4[0-9][0-9]\)' "$GH_ERR" && ! grep -q '(HTTP 429)' "$GH_ERR"; then
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt == 1 ? 1 : 5 ))
              fi
            done
            return 1
          }
          TAGS="$(gh_api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')"
          # Ordered by git itself, the order release.yml reads: GNU `sort -V`
          # disagrees with it on tags like `v-next` and `v1.02.0`. A scratch
          # repository holds each name as a ref on the empty tree, so nothing
          # is fetched and the deployed checkout is untouched.
          ORDER="$RUNNER_TEMP/tag-order"
          rm -rf "$ORDER"
          git -c init.defaultBranch=main init -q "$ORDER"
          EMPTY_TREE="$(git -C "$ORDER" mktree < /dev/null)"
          printf '%s\n' "$TAGS" | awk -v oid="$EMPTY_TREE" 'NF { print "create refs/tags/" $0 " " oid }' \
            | git -C "$ORDER" update-ref --stdin
          LATEST="$(git -C "$ORDER" tag --list 'v*' --sort=-version:refname | sed -n 1p)"
          if [ -z "$LATEST" ]; then
            echo "::error::No v* tag exists, so nothing says what production serves. Refusing to go on."
            exit 1
          fi
          if ! [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest v* tag, $LATEST, is not a vX.Y.Z release, so nothing says what production serves (release-tag.mjs refuses it too). Refusing to go on."
            exit 1
          fi
          REF="$(gh_api "repos/$REPO/git/ref/tags/$LATEST" --jq '.object.type + " " + .object.sha')"
          TYPE="${REF%% *}"
          OBJECT="${REF#* }"
          if [ "$TYPE" = "tag" ]; then
            OBJECT="$(gh_api "repos/$REPO/git/tags/$OBJECT" --jq '.object.sha')"
          fi
          if [ "$OBJECT" != "$DEPLOY_SHA" ]; then
            # Said apart from a failed read, which also fails this step: the
            # record job forbids a hand upload only for this.
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::error::The latest tag, $LATEST, is on $OBJECT, not $DEPLOY_SHA: production has shipped another commit since this run. Store builds are made only from the latest v* tag; dispatch Deploy production for it instead."
            exit 1
          fi
          echo "$DEPLOY_SHA is the latest tag ($LATEST)."

      # A Release build uploads its debug symbols and source maps to Sentry,
      # and fails without SENTRY_AUTH_TOKEN (ENV_REFERENCE.md § apps/mobile).
      # EAS's variable of that name is Secret and never reaches this runner;
      # the `automation` environment's does, when it holds one. Without it
      # the build skips the upload rather than failing, as the OTA publish
      # does (`_mobile-update.yml`), and the summary says the binary's native
      # crashes will stay unsymbolicated. Names only: no value enters this
      # step.
      - name: Turn the Sentry upload off when no token reached this job
        env:
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_SENTRY_AUTH_TOKEN" = "true" ]; then
            echo "The build uploads its debug symbols and source maps to Sentry."
            exit 0
          fi
          echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          echo "::warning::The automation environment has no SENTRY_AUTH_TOKEN, so this build uploads nothing to Sentry, and its native crash reports there stay unsymbolicated."
          echo "> The \`automation\` environment has no \`SENTRY_AUTH_TOKEN\`, so this build uploaded no debug symbols or source maps to Sentry, and its crash reports there stay unsymbolicated." >> "$GITHUB_STEP_SUMMARY"

      # One script in both jobs. eas-cli takes the next build number from
      # EAS (`appVersionSource: remote`, `autoIncrement`) and prints it as
      # "Incremented buildNumber/versionCode from N to M"; that line is the
      # only place a local build reports it, so the step reads it from the
      # log, colour codes removed, and refuses unless exactly one is there.
      # The version is `expo.version` in `app.json`, which no profile
      # overrides. The step hands on what the record job writes, in the shape
      # `record-shipped-builds.mjs` reads.
      - name: Build (Release, signed with EAS's credentials)
        id: build
        timeout-minutes: 70
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PLATFORM: ios
          EAS_PLATFORM: IOS
          ARCHIVE: ${{ runner.temp }}/frapp.ipa
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/eas-build.log"
          STATUS=0
          (cd apps/mobile && eas build --local --platform "$PLATFORM" --profile production --non-interactive \
            --output "$ARCHIVE") 2>&1 | tee "$LOG" || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::eas build --local --platform $PLATFORM exited $STATUS. Production is live and tagged. The log above says why."
            exit "$STATUS"
          fi
          if [ ! -s "$ARCHIVE" ]; then
            echo "::error::eas build --local exited 0 but wrote no $ARCHIVE."
            exit 1
          fi
          set -e
          NUMBERS="$(perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$LOG" \
            | grep -oE '(Incremented (buildNumber|versionCode) from [0-9]+ to|Initialized (buildNumber|versionCode) with) [0-9]+' \
            | grep -oE '[0-9]+$' || true)"
          if [ "$(printf '%s' "$NUMBERS" | grep -c .)" -ne 1 ]; then
            echo "::error::Couldn't read the one build number eas-cli set from its log (found: ${NUMBERS:-none}). The binary is at $ARCHIVE but is not uploaded unrecorded."
            exit 1
          fi
          VERSION="$(node -p 'require("./apps/mobile/app.json").expo.version')"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::HEAD moved to $HEAD_SHA during the build, off the shipped $DEPLOY_SHA. Not uploading."
            exit 1
          fi
          BUILD="$(jq -cn --arg p "$EAS_PLATFORM" --arg v "$VERSION" --arg b "$NUMBERS" --arg sha "$HEAD_SHA" \
            '{platform: $p, status: "FINISHED", appVersion: $v, appBuildVersion: $b, gitCommitHash: $sha}')"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Built $PLATFORM $VERSION ($NUMBERS) from $HEAD_SHA."

      # The binary's own Info.plist against what the build step read from
      # eas-cli's log, so the record can't name a build number the binary
      # doesn't carry. `-W`: `*` stops at a slash, so an extension's or a
      # watch app's Info.plist can't answer for the app's.
      - name: Check the binary carries the version it is recorded as
        env:
          ARCHIVE: ${{ runner.temp }}/frapp.ipa
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/Info.plist"
          unzip -W -p "$ARCHIVE" 'Payload/*.app/Info.plist' > "$PLIST"
          SHORT="$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")"
          NUMBER="$(plutil -extract CFBundleVersion raw -o - "$PLIST")"
          WANT_SHORT="$(jq -r '.appVersion' <<< "$BUILD")"
          WANT_NUMBER="$(jq -r '.appBuildVersion' <<< "$BUILD")"
          if [ "$SHORT" != "$WANT_SHORT" ] || [ "$NUMBER" != "$WANT_NUMBER" ]; then
            echo "::error::The binary is $SHORT ($NUMBER), but the build reported $WANT_SHORT ($WANT_NUMBER). Not uploading a build the record would misname."
            exit 1
          fi
          echo "The binary is $SHORT ($NUMBER)."

      # The same check as before the build, a build's length later: a ship
      # made meanwhile (a rollback, say) has moved production, and nothing
      # built from this SHA may upload after that.
      - name: Check the SHA is still the latest tag, before uploading
        id: tag-before-upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # `scripts/ci/lib/release-tag.mjs`'s rule, the one `release.yml` bumps
          # from: the top `v*` tag by version, which must be a plain `vX.Y.Z`.
          # Written again here because this job runs the deployed tree, not
          # the lib's; `deploy-production-mobile.test.mjs` runs both on the
          # same tags.
          #
          # Each read: three attempts, 1s then 5s apart, and no retry of a 4xx
          # other than 429 (`download-migration-snapshot`'s `gh_api`, whose
          # header says why). A read that still fails fails the step, which
          # the record job keeps apart from a moved tag.
          GH_ERR="$RUNNER_TEMP/tag-check-gh-stderr.txt"
          gh_api() {
            local attempt out
            for attempt in 1 2 3; do
              if out="$(gh api "$@" 2>"$GH_ERR")"; then
                printf '%s\n' "$out"
                return 0
              fi
              cat "$GH_ERR" >&2
              if grep -Eq '\(HTTP 4[0-9][0-9]\)' "$GH_ERR" && ! grep -q '(HTTP 429)' "$GH_ERR"; then
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $(( attempt == 1 ? 1 : 5 ))
              fi
            done
            return 1
          }
          TAGS="$(gh_api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')"
          # Ordered by git itself, the order release.yml reads: GNU `sort -V`
          # disagrees with it on tags like `v-next` and `v1.02.0`. A scratch
          # repository holds each name as a ref on the empty tree, so nothing
          # is fetched and the deployed checkout is untouched.
          ORDER="$RUNNER_TEMP/tag-order"
          rm -rf "$ORDER"
          git -c init.defaultBranch=main init -q "$ORDER"
          EMPTY_TREE="$(git -C "$ORDER" mktree < /dev/null)"
          printf '%s\n' "$TAGS" | awk -v oid="$EMPTY_TREE" 'NF { print "create refs/tags/" $0 " " oid }' \
            | git -C "$ORDER" update-ref --stdin
          LATEST="$(git -C "$ORDER" tag --list 'v*' --sort=-version:refname | sed -n 1p)"
          if [ -z "$LATEST" ]; then
            echo "::error::No v* tag exists, so nothing says what production serves. Refusing to go on."
            exit 1
          fi
