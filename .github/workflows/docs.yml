name: Docs checks

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` were here while a label could waive a required check:
    # the default trigger set does not fire on a label change, so the waiver had
    # to be able to re-run the check it waived. That gate is gone (#1597), and no
    # job left in this workflow reads a label, so re-running all four on every
    # label mutation bought nothing.
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  # Cancellable on a PR ref, NEVER on main. `github.ref` is `refs/heads/main`
  # for every push to main, so an unguarded `cancel-in-progress: true` puts
  # every merge's push run in one group and the first commit's run is cancelled
  # by the second's — leaving required checks concluded `cancelled`, which
  # `validate-deploy-sha.mjs` refuses to deploy. Cancelling a PR run costs a
  # re-push; cancelling a main push run costs a commit's deployability.
  # Full account: scripts/ci/validate-deploy-sha.mjs § CANCELLED_CONCLUSIONS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Structure — whole-tree, and its own job, for the reason required-checks.mjs
  # states next to doc-paths: a whole-tree check as a REQUIRED check can block a
  # PR over a citation in a doc that PR never touched. One stale LEGACY_NAMES
  # entry — or a directory whose last file was deleted — would turn every open
  # PR red with no admin override, which is the merge-freeze shape #1373
  # documents for migration-drift.
  #
  # Whole-tree is also why it needs no `pull_request` guard: a push to main
  # proves it green before any PR discovers a problem, which is the point of
  # running it.
  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Dependabot exemption needed: the check reads the tree, not the diff,
      # so a lockfile-only PR simply passes.
      - name: Enforce docs/spec structure
        run: node scripts/check-docs-structure.mjs

  # Citation lint — a SEPARATE job, on purpose, for two reasons.
  #
  # 1. Blast radius. `doc-paths` is a REQUIRED check under
  #    `enforce_admins: true`, and it is whole-tree rather than diff-scoped (a
  #    citation breaks when the file it names moves — a change on the *other*
  #    side of the reference — so diffing would miss the case it exists to
  #    catch). Whole-tree + required + no override means a PR renaming a source
  #    file can be blocked by a citation in a doc it never touched. It reported
  #    only until 2026-08-21, following the rollout every other gate here used
  #    (secret-scan, clean-checkout-typecheck, dependency-audit,
  #    chapter-directory-seed). Keeping it a separate job still matters: see
  #    reason 2.
  # 2. A failure should say *citations*, not *docs sync*. Two different fixes.
  doc-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Dependabot exemption needed: the check reads the tree, not the diff,
      # so a lockfile-only PR simply passes.
      - name: Enforce doc path citations
        run: node scripts/check-doc-paths.mjs

  # Doc references OUTSIDE the docs corpus — a SEPARATE job, same reasoning.
  #
  # doc-paths is whole-tree but scoped to the documentation itself, so the many
  # hundreds of references to docs/ and spec/ that live in source, tests,
  # workflows, migrations and shell scripts were never checked. The previous restructure
  # (epic #432) left dead pointers in `apps/api/README.md` and `supabase/seed.sql`
  # that nothing caught for months.
  #
  # A failure should say *references*, not *citations*: doc-paths is about how a
  # doc cites a path, this is about how CODE cites a doc, and the fix differs.
  #
  # Non-required to start, promoted the usual way once it has run green on the
  # target branch — the same rollout doc-paths and doc-tables each had.
  doc-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Dependabot exemption needed: the check reads the tree, not the diff.
      - name: Enforce doc references outside the docs corpus
        run: node scripts/check-doc-refs.mjs

  # Roster drift — also a SEPARATE job, for the same two reasons as doc-paths.
  #
  # It compares the required-check roster and per-job test-suite lists that the
  # branch-protection runbook restates by hand — the last remaining copy, since
  # CONTRIBUTING.md and spec/environments/README.md now point at it — against
  # their source: the CI_CHECKS / DOCS_CHECKS arrays and ci.yml. Whole-tree,
  # not diff-scoped — a table goes
  # stale when a *workflow* changes, which is the other side of the reference.
  #
  # A failure should say *tables*, not *docs sync* or *citations*: three
  # different fixes. Non-required to start, promoted the usual way once it has
  # run green on the target branch.
  doc-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce doc table rosters
        run: node scripts/check-doc-tables.mjs

      - name: Enforce Infisical env slugs
        run: node scripts/check-env-slugs.mjs
