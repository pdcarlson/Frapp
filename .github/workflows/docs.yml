name: Docs spec sync

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-spec-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependabot PRs are exempt: they change package.json / package-lock.json
      # and nothing else, so check-docs-impact.mjs would fail every one of them
      # (non-docs files touched, no docs touched) — and `docs-spec-sync` is a
      # REQUIRED check under `enforce_admins: true`, so those PRs would be
      # permanently unmergeable rather than merely red.
      #
      # This skips the STEP, never the job. A skipped job never reports its
      # check run, which would leave the PR blocked on a required check that
      # never arrives — strictly worse than the failure it replaces. Skipping
      # the step keeps the job, and therefore `docs-spec-sync`, green.
      #
      # Keyed on the PR author rather than `github.actor` so a human re-running
      # the workflow doesn't flip the exemption off mid-PR.
      - name: Enforce docs/spec sync (PR only)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-docs-impact.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Enforce docs/spec structure (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs-structure.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      # Unlike the two checks above, this one scans the whole tree rather than a
      # diff: a citation breaks when the file it names moves, which is a change
      # to the *other* side of the reference. Diffing would miss exactly the case
      # it exists to catch. It runs on push as well so a break that lands on main
      # is visible immediately.
      - name: Enforce doc path citations
        run: node scripts/check-doc-paths.mjs
