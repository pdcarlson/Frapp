name: Docs spec sync

on:
  pull_request:
    branches: [main, production]
    # `labeled`/`unlabeled` are load-bearing, not tidiness. `no-doc-change-needed`
    # waives the sync gate, and the default trigger set (opened/synchronize/
    # reopened) does not fire on a label change — so without these the label
    # would be applied, nothing would re-run, the stale red conclusion would
    # stand, and the PR would still be blocked on a REQUIRED check. The waiver
    # has to be able to re-run the check it waives.
    #
    # Affordable here precisely because this workflow is three small jobs. The
    # same trigger on ci.yml would re-run the whole suite (Docker build
    # included) on every label mutation, which is why the duplicate copy of
    # this gate was removed from ci.yml rather than given the same trigger.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, production]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-spec-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependabot PRs are exempt: they change package.json / package-lock.json
      # and nothing else, so check-docs-impact.mjs would fail every one of them
      # (non-docs files touched, no docs touched) — and `docs-spec-sync` is a
      # REQUIRED check under `enforce_admins: true`, so those PRs would be
      # permanently unmergeable rather than merely red.
      #
      # This skips the STEP, never the job. A skipped job never reports its
      # check run, which would leave the PR blocked on a required check that
      # never arrives — strictly worse than the failure it replaces. Skipping
      # the step keeps the job, and therefore `docs-spec-sync`, green.
      #
      # Keyed on the PR author rather than `github.actor` so a human re-running
      # the workflow doesn't flip the exemption off mid-PR.
      # Labels reach the script through `env:` rather than the `run:` string:
      # a label is free-form text set by anyone with write access, and
      # interpolating it directly into the shell command would make it
      # executable. JSON (not a comma-joined list) because label names may
      # legitimately contain commas.
      - name: Enforce docs/spec sync (PR only)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-docs-impact.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Enforce docs/spec structure (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs-structure.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

  # Citation lint — a SEPARATE job, on purpose, for two reasons.
  #
  # 1. Blast radius. `docs-spec-sync` is a REQUIRED check under
  #    `enforce_admins: true`. This check is whole-tree rather than diff-scoped
  #    (a citation breaks when the file it names moves — a change on the *other*
  #    side of the reference — so diffing would miss the case it exists to
  #    catch). Whole-tree + required + no override means a PR renaming a source
  #    file can be blocked by a citation in a doc it never touched. It reported
  #    only until 2026-08-21, following the rollout every other gate here used
  #    (secret-scan, clean-checkout-typecheck, dependency-audit,
  #    chapter-directory-seed), and is now listed in DOCS_CHECKS. Keeping it a
  #    separate job still matters: see reason 2.
  # 2. A failure should say *citations*, not *docs sync*. Two different fixes.
  doc-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Dependabot exemption needed: the check reads the tree, not the diff,
      # so a lockfile-only PR simply passes.
      - name: Enforce doc path citations
        run: node scripts/check-doc-paths.mjs

  # Roster drift — also a SEPARATE job, for the same two reasons as doc-paths.
  #
  # It compares the required-check rosters and per-job test-suite lists that
  # CONTRIBUTING.md, spec/environments/README.md and the branch-protection
  # runbook each restate by hand against their source: the CI_CHECKS /
  # DOCS_CHECKS arrays and ci.yml. Whole-tree, not diff-scoped — a table goes
  # stale when a *workflow* changes, which is the other side of the reference.
  #
  # A failure should say *tables*, not *docs sync* or *citations*: three
  # different fixes. Non-required to start, promoted the usual way once it has
  # run green on the target branch.
  doc-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce doc table rosters
        run: node scripts/check-doc-tables.mjs

      - name: Enforce Infisical env slugs
        run: node scripts/check-env-slugs.mjs
