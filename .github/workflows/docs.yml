name: Docs spec sync

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-spec-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependabot PRs are exempt: they change package.json / package-lock.json
      # and nothing else, so check-docs-impact.mjs would fail every one of them
      # (non-docs files touched, no docs touched) — and `docs-spec-sync` is a
      # REQUIRED check under `enforce_admins: true`, so those PRs would be
      # permanently unmergeable rather than merely red.
      #
      # This skips the STEP, never the job. A skipped job never reports its
      # check run, which would leave the PR blocked on a required check that
      # never arrives — strictly worse than the failure it replaces. Skipping
      # the step keeps the job, and therefore `docs-spec-sync`, green.
      #
      # Keyed on the PR author rather than `github.actor` so a human re-running
      # the workflow doesn't flip the exemption off mid-PR.
      - name: Enforce docs/spec sync (PR only)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-docs-impact.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Enforce docs/spec structure (PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-docs-structure.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

  # Citation lint — a SEPARATE job, on purpose, for two reasons.
  #
  # 1. Blast radius. `docs-spec-sync` is a REQUIRED check under
  #    `enforce_admins: true`. This check is whole-tree rather than diff-scoped
  #    (a citation breaks when the file it names moves — a change on the *other*
  #    side of the reference — so diffing would miss the case it exists to
  #    catch). Whole-tree + required + no override means a PR renaming a source
  #    file can be blocked by a citation in a doc it never touched. Landing it
  #    as its own non-required job follows the rollout every other gate here
  #    used (secret-scan, clean-checkout-typecheck, dependency-audit,
  #    chapter-directory-seed): report first, become required via
  #    `npm run configure:branch-protection` once it has run green on the
  #    target branch.
  # 2. A failure should say *citations*, not *docs sync*. Two different fixes.
  doc-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Dependabot exemption needed: the check reads the tree, not the diff,
      # so a lockfile-only PR simply passes.
      - name: Enforce doc path citations
        run: node scripts/check-doc-paths.mjs
