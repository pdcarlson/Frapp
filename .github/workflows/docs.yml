name: Docs checks
# The display name is PINNED, not descriptive. `ci-wake.yml` selects this
# workflow by display name (`on.workflow_run.workflows: [CI, "Docs checks",
# Links]`), and `pr-base-guard.yml` names it in the comment it posts. Renaming
# it here silently stops CI wake from ever firing for this workflow — a
# workflow_run filter that matches nothing is not an error, it is silence. Any
# rename has to change those files in the same commit.

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` were here while a label could waive a required
    # check: the default trigger set does not fire on a label change, so the
    # waiver had to be able to re-run the check it waived. That gate is gone
    # (#1597) and no job here reads a label, so re-running on every label
    # mutation bought nothing.
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  # Cancellable on a PR ref, NEVER on main. `github.ref` is `refs/heads/main`
  # for every push to main, so an unguarded `cancel-in-progress: true` puts
  # every merge's push run in one group and the first commit's run is cancelled
  # by the second's — leaving required checks concluded `cancelled`, which
  # `validate-deploy-sha.mjs` refuses to deploy. Cancelling a PR run costs a
  # re-push; cancelling a main push run costs a commit's deployability.
  # Full account: scripts/ci/validate-deploy-sha.mjs § CANCELLED_CONCLUSIONS.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The Infisical environment-slug gate. It is NOT a documentation gate — it
  # asserts that an Infisical environment slug it matches inside the roots it
  # scans is one that exists, in `package.json` scripts and workflows as much as
  # in prose. It matches fixed syntaxes, not any mention of a slug. It used to run as the second step of a docs job and would have died
  # with it; it has its own job so that a failure names what it is.
  #
  # Its reach is exactly `SCAN_ROOTS` in `scripts/check-env-slugs.mjs`:
  # `package.json`, `.infisical.json`, `ci/environments.json`,
  # `.github/workflows`, `.github/actions`, `docs`, `spec`, and
  # `docs/internal/environment/ENV_REFERENCE.md`. It is NOT a whole-repo scan —
  # a slug written in `.claude/`, in `scripts/`, in app code or in a root
  # README is not read by anything here.
  #
  # Within those roots it reads the tree, not the diff: the reference and the
  # slug list it is checked against sit in different files, so a diff-scoped
  # scan would miss every reference the change did not happen to touch. That is
  # also why it needs no Dependabot exemption — a lockfile-only PR simply
  # passes.
  env-slugs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Infisical env slugs
        run: node scripts/check-env-slugs.mjs
