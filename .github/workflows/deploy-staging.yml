name: Deploy staging

# STAGING: database, API, web and landing, after every merge. Triggered ONLY
# after the CI workflow completes successfully on `main`, so broken code never
# deploys. Staging deploys on merge, never on a pull request: it is one shared
# database and one API, so an unmerged PR's migrations would land in it and
# PRs would overwrite each other.
#
# This file only decides WHETHER to deploy, and reports the outcome. The
# deploying itself is `_deploy.yml`, the job staging and production share
# (epic #2802; since #2804), called with `environment: staging` and the commit
# CI verified. Its header has the order and the plan. Production is
# `deploy-production.yml`, a manual dispatch that names an exact commit.
#
# ── Why `workflow_run` and not `push` ───────────────────────────────────────
# A push-triggered workflow starts immediately, before CI has passed. This one
# starts when CI completes and deploys only a success, and it names the commit
# CI verified (`workflow_run.head_sha`), never `main`'s moving tip.
#
# ── The run title names that commit (`run-name`, #3114) ─────────────────────
# Nothing else a run returns does. A `workflow_run` run's own `head_sha` is
# `main`'s tip when it fired: run 36855311019 reports `93ae125` and deployed
# `9907e7e`, whose CI finished two seconds before it was created, and its jobs
# and its `staging` deployment record carry `93ae125` too. So the title is the
# one place the deployed commit can be read back, and
# `scripts/ci/resolve-deploy-sha.mjs` reads it there to find the newest commit
# staging took, for a production dispatch that leaves `sha` empty. Every run
# gets the title, including one whose CI failed or came from a fork's pull
# request: its jobs all skip, it concludes `skipped`, and the resolver ignores
# it.
#
# ── `secrets: inherit`, and why it is needed ───────────────────────────────
# `_deploy.yml`'s job names the `staging` environment itself and reads that
# environment's secrets. Without `secrets: inherit` here every one read empty
# in that called job, `environment:` key and all (run 36479856561, the first
# run through `_deploy.yml`, whose guard stopped it before anything shipped).
# GitHub releases an environment's secrets to a called job only when the
# caller passes `inherit` (actions/runner#4453); the first run with it proves
# that here, recorded on #2804. No repository secret exists (#2583), so
# inherit hands the called job nothing else.
#
# ── Names other things depend on ────────────────────────────────────────────
# `migration-snapshot.yml` triggers on this workflow's NAME, "Deploy staging",
# and the `download-migration-snapshot` action reads this FILE's runs. The
# `deploy-outcome` job selects `ALERT_CONFIG: deploy-staging` in
# `scripts/ci/deploy-alert.mjs`, which keys on the job names `deploy` and
# `deploy-outcome` and on the `plan` output. Renaming any of them breaks those
# silently. `resolve-deploy-sha.mjs` reads the commit out of the run title, as
# a 40-hex token standing on its own; a title without it fails every
# production dispatch that leaves `sha` empty.

run-name: "staging ${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # `head_repository` guards against a fork's CI run triggering a deploy with
    # this repo's secrets: `workflow_run` fires in the base repo's context.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/_deploy.yml
    # Required for the called job to see the `staging` environment's secrets;
    # see the header.
    secrets: inherit
    with:
      environment: staging
      # The commit CI verified. `github.sha` on a `workflow_run` event is the
      # default branch's TIP, which may be a commit whose CI hasn't finished.
      sha: ${{ github.event.workflow_run.head_sha }}

  # ── Deploy outcome: alert on failure, state plainly what happened ──────────
  # A `workflow_run` failure lands on no commit and no PR, so without this a
  # failed staging deploy produced no commit status, no PR check and no
  # notification. That hid a 100% deploy failure rate for 71 days (#763), and
  # ADR-21's Git unlink froze both staging hosts for days (#1674).
  #
  # Writes a step summary and an annotation saying whether this run DEPLOYED,
  # FAILED, found the API UP TO DATE (plan `current`; the frontends uploaded
  # only if they changed, #2865), or was SUPERSEDED (plan `stale`, or a successful `forward`
  # deploy of a commit that isn't main's tip), and upserts or closes one P1
  # tracking issue, so "alert issue open" means "the staging deploy path is
  # broken right now" (owner decision on #2803: P1, as Deploy API was).
  deploy-outcome:
    needs: [deploy]
    # `always()` alone is NOT enough: a skipped dependency does not stop a job
    # that uses always(), so on every CI-failed run this would report "deployed
    # NOTHING", true but noise. Repeating the deploy job's own conditions means
    # this job runs exactly when a deploy was eligible, and a deploy job that
    # then did not run is escalated as a failure (a configuration defect).
    #
    # Keep these conditions in sync with the `deploy` job above: GitHub Actions
    # has no way to share a job-level `if:`, and
    # `deploy-staging-workflow.test.mjs` fails if they drift.
    #
    # `always()` rather than `!cancelled()`, deliberately: a CANCELLED deploy
    # raises the alert, because `FAILED_RESULTS` in deploy-alert.mjs counts
    # `cancelled` as a failure ("a cancelled deploy is not a deploy"). The cost:
    # cancelling a superseded queued run by hand files an alert, which closes as
    # soon as the run behind it deploys.
    if: |
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The ONLY job here with any write scope, kept job-scoped so the
      # workflow-level `contents: read` stays as narrow as it is.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # deploy-alert.mjs is dependency-free (global fetch + node:fs on the
      # runner's preinstalled Node): no setup-node, no npm ci.
      - name: Report deploy outcome and alert on failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required. deploy-alert.mjs serves more than one workflow and refuses
          # to guess: an absent or unknown value is a hard error.
          ALERT_CONFIG: deploy-staging
          DEPLOY_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/deploy-alert.mjs

      # One alert per Sentry project whose build this run checked (#2489),
      # from the deploy job's `sourcemaps` report. Only after a successful
      # deploy: a failed one is the alert above, and its report is incomplete.
      # `!cancelled()` so a failed step above can't skip it. Exits 0 on every
      # handled outcome, so it never reds this job.
      - name: Alert on missing Sentry source maps
        if: ${{ !cancelled() && needs.deploy.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From this job's context, not the deploy job's output, which may
          # carry neither (see the verifier's header).
          TARGET_ENVIRONMENT: staging
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCEMAPS: ${{ needs.deploy.outputs.sourcemaps }}
          SOURCEMAPS_CHECKED: ${{ needs.deploy.outputs.sourcemaps-checked }}
        run: node scripts/ci/sentry-sourcemaps-alert.mjs

  # ── Keep a fixed number of staging deployments (#2865) ─────────────────────
  # Every upload is a new deployment of both Vercel projects, and Vercel keeps
  # each one against the Hobby team's Function Storage, which production
  # shares. This deletes all but the newest previews of web and landing: never
  # a production deployment, nor one a staging hostname serves (read fresh,
  # after the deploy job aliased them): `scripts/ci/prune-vercel-staging.mjs`.
  #
  # Its own job, not a step of the deploy job, so a failure here can't fail a
  # deploy that shipped: that would raise the P1 alert above, and its natural
  # fix (a re-run) uploads both apps again. A red job on this run is the signal
  # instead. It runs after every successful deploy job, uploaded or not, so a
  # backlog drains. The checkout is `main` (the default for `workflow_run`),
  # not the deployed commit, so the script exists for a run of an older one.
  prune-vercel-staging:
    needs: [deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # VERCEL_API_KEY is a `staging` environment secret (#2583).
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Node the deploy job runs these scripts on (the prune imports
      # deploy-vercel.mjs). Built-ins only, so no npm ci.
      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      - name: Read the provider ids
        id: ids
        env:
          TARGET_ENVIRONMENT: staging
        run: node scripts/ci/provider-ids.mjs

      - name: Prune old staging deployments (web + landing)
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_WEB_PROJECT_ID: ${{ steps.ids.outputs.vercel_web_project_id }}
          VERCEL_LANDING_PROJECT_ID: ${{ steps.ids.outputs.vercel_landing_project_id }}
          VERCEL_TEAM_ID: ${{ steps.ids.outputs.vercel_team_id }}
          VERCEL_STAGING_HOSTS: app.staging.frapp.live staging.frapp.live
        run: node scripts/ci/prune-vercel-staging.mjs
