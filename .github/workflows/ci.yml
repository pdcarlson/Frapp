name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled push run leaves required checks
  # `cancelled`, which validate-deploy-sha.mjs refuses (§ CANCELLED_CONCLUSIONS).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ---------------------------------------------------------------------------
# `packages-build` runs first. web-tests, web-responsive-floor, landing-fold and
# pglite-migrations are path-gated on PRs by `changes` and run in full on push.
# They are still required checks, because a job skipped by a job-level `if:` reports
# Success (ADR-15 amendment 2026-08-19). `clean-checkout-typecheck` and
# `web-production-build` deliberately prebuild nothing.
#
# Every job sets `timeout-minutes` (#3129, pinned by workflow-timeouts.test.mjs).
# Nothing cancels on main, so a job hung at the 360-minute default blocks every
# push behind it. Sized from runs on 2026-10-02, with headroom for a cold cache: 5
# for jobs taking seconds, 10 for about a minute, 20 for build, test and
# Playwright jobs that take 2 to 4.
# ---------------------------------------------------------------------------

jobs:
  # Path filter for the gated jobs, and required because they need it
  # (required-checks.mjs). It filters only on pull_request, so a shallow checkout
  # cannot fail the gate.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      pglite: ${{ steps.filter.outputs.pglite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package-lock.json'
              - 'turbo.json'
              # Gated jobs build through local actions, and a skipped required job reports Success.
              - '.github/actions/**'
            landing:
              - 'apps/landing/**'
              - 'packages/**'
              - 'package-lock.json'
              - 'turbo.json'
              # Same reason as `web`.
              - '.github/actions/**'
              # Not in `web:`: the landing webServer runs `npm run build`, which runs repo
              # scripts (sync-brand-assets, next-build, brand-pixels). apps/web runs `npm run dev`.
              - 'scripts/**'
            pglite:
              - 'supabase/migrations/**'
              - 'scripts/pglite/**'
              # The change-ping contract spec (the job's last step) applies every migration too.
              - 'apps/web/lib/realtime/**'
              - 'apps/web/vitest.config.ts'
              - 'apps/web/tests/setup.ts'
              - 'packages/validation/**'
              - 'package-lock.json'
              # The job also loads the chapter directory seed.
              - 'supabase/seed/**'
              - 'scripts/load-chapter-directory.mjs'
              - 'scripts/lib/chapter-directory-seed.mjs'
              # ...and the App Review demo seed (#2308) with the modules it imports.
              - 'scripts/demo/**'
              - 'scripts/ci/lib/env.mjs'
              - 'scripts/ci/lib/environments.mjs'
              - 'scripts/ci/lib/http.mjs'
              - 'scripts/ci/lib/invoked-directly.mjs'
              - 'scripts/storage-backup.mjs'
              - '.github/environments.json'
              # The search-column landmark reads the API's search source.
              - 'apps/api/src/application/services/search.service.ts'
              # The job's own definition and npm script. Required (#2538): every file the
              # check reads belongs in this list.
              - '.github/workflows/ci.yml'
              - 'package.json'
              # The job installs through node-setup.
              - '.github/actions/**'

  # ── Shared packages build (dependency for downstream jobs) ──────────────
  packages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      # The one job that writes the cache; every other job restores it.
      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build
        with:
          save: "true"

  # ── Lint + type check (full monorepo) ───────────────────────────────────
  lint-and-typecheck:
    needs: packages-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Type check
        run: npm run check-types

      - name: API production build (nest build / Render parity)
        run: npm run build -w apps/api

      - name: Lint
        run: npm run lint

      - name: Landing unit tests
        run: npm run test -w apps/landing

      # Consumed by API, web and mobile; had no suite until #687.
      - name: Shared validation package tests
        run: npm run test -w @repo/validation

      # Its contrast math feeds theme and chapter-theme, whose suites pin their callers, not this package.
      - name: Shared color package tests
        run: npm run test -w @repo/color

      # Includes the stopwatch, bare-date and minute-rounding clusters the generic formatter must not absorb.
      - name: Shared formatting package tests
        run: npm run test -w @repo/formatting

      # Sentry PII scrubbing, sample-rate parse, correlation types.
      - name: Shared observability package tests
        run: npm run test -w @repo/observability

      # The accent engine: catches a vendored-generator change on a dependency bump.
      - name: Chapter theme package tests
        run: npm run test -w @repo/chapter-theme

      # Compares every token value with spec/ui/design-system/foundations.md (#1144).
      # Its lint runs through `turbo run lint` in the Lint step.
      - name: Theme package tests
        run: npm run test -w @repo/theme

      # Hand-written `statusOf` / `serverMessageOf` / `codeOf`, used by API, web and
      # mobile. The package uses the hoisted workspace vitest; this step does not add
      # a lockfile entry.
      - name: Shared api-sdk package tests
        run: npm run test -w @repo/api-sdk

      - name: Brand assets (icon sync)
        run: npm run check:brand-assets

      # Deno, so nothing above reads them (#2848, ADR-26). `deno test` runs with no
      # permissions, so a test that reaches the network fails.
      - name: Edge Functions (Deno fmt, lint, check, test)
        run: npm run check:edge-functions

      # ── Clean-checkout guard (fresh-install path) ───────────────────────────
  # `npm ci && check-types && lint` with no prebuilt packages/*/dist, so reverting
  # turbo.json's `^build` dependency fails here while every prebuilding job stays
  # green. Keep it free of `needs:`, build and cache steps: adding one disarms it.
  clean-checkout-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `install: ci` restores only the npm download cache, never node_modules or dist.
      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Type check with no prebuilt packages
        run: npm run check-types

      - name: Lint with no prebuilt packages
        run: npm run lint

  # ── Production-shaped frontend build (Vercel parity) ────────────────────
  # Builds web and landing on a devDependency-pruned tree, as Vercel's production
  # install does. #1331 and #1372 broke production through this gap
  # (docs/ci-cd/agent-infra.md, docs/ci-cd/quality-gates.md). No `needs:`, no
  # prebuilt-package or cache step, and no path filter (`changes.web` misses
  # apps/landing): adding any of them disarms it.
  web-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `npm ci --omit=dev` is lockfile-exact and gives the tree Vercel's install does
      # (measured when added: 1128 packages / 1146 audited, against production's 1126 / 1144).
      - name: Setup Node and install production dependencies only
        uses: ./.github/actions/node-setup
        with:
          install: omit-dev

      # The prune is this job's premise, so assert it. On failure, find which mechanism
      # moved (the errors name them); don't delete the check to get green.
      - name: Assert the tree is actually pruned
        run: |
          set -euo pipefail
          if [ -d node_modules/vitest ]; then
            echo "::error::node_modules/vitest survived --omit=dev, so this is not a production-shaped tree and this job is silently covering nothing. Check whether vitest became a production dependency or gained an optional-peer path (lockfile 'devOptional')."
            exit 1
          fi
          if [ ! -d node_modules/typescript ]; then
            echo "::error::typescript did not survive --omit=dev. Vercel's production build would lose its type-checker too, so this is a real parity finding, not a CI-only problem: check what stopped keeping it reachable (today it is an optional peer of frimousse and @expo/require-utils -- NOT of next, which declares no typescript peer)."
            exit 1
          fi
          echo "::notice::Production-shaped tree confirmed (vitest pruned, typescript present)"

      # turbo is a pruned devDependency, so fetch it at the lockfile's version, not
      # package.json's range, keeping this job on the turbo every other job installs.
      - name: Build web and landing as production
        # `next build` prerenders a Supabase client, so NEXT_PUBLIC_* must be set. These
        # are apps/web/playwright.config.ts's stand-ins: real values would be inlined into
        # a throwaway artifact, so never wire secrets in here.
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiJ9.playwright-stand-in.signature"
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:3001"
        run: |
          set -euo pipefail
          TURBO_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/turbo'].version")"
          echo "Using turbo@${TURBO_VERSION}"
          npx --yes "turbo@${TURBO_VERSION}" run build --filter=web --filter=landing

      # `turbo run --filter` exits 0 for a package with no `build` script, so check both apps' output.
      - name: Assert both apps actually built
        run: |
          set -euo pipefail
          missing=0
          for app in web landing; do
            if [ ! -f "apps/$app/.next/BUILD_ID" ]; then
              echo "::error::apps/$app/.next/BUILD_ID is absent, so $app was not built even though turbo exited 0. Check that apps/$app/package.json still defines a 'build' script and that the turbo filter still matches its package name."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "::notice::web and landing both produced a production build"

  # ── API unit + E2E tests ────────────────────────────────────────────────
  api-tests:
    needs: packages-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Run API tests
        run: npm run test -w apps/api

      - name: Run API E2E tests
        run: npm run test:e2e -w apps/api

      # Spec §13 → Evals. Unconditional costs ~1.5s, less than a path-gated job would (ADR-15).
      - name: Run AI evals
        run: npm run test:ai-evals -w apps/api

  # ── Web unit tests (Vitest / jsdom) ─────────────────────────────────────
  web-tests:
    needs: [packages-build, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Run web unit tests
        run: npm run test -w apps/web

      # Shared packages only this suite covers; `changes` already filters `packages/**`.
      # `!cancelled()`, not `always()`: run past a red suite, not past a cancellation.
      - name: Run shared hooks package tests
        if: ${{ !cancelled() }}
        run: npm run test -w packages/hooks

      - name: Run chat-core package tests
        if: ${{ !cancelled() }}
        run: npm run test -w packages/chat-core

      - name: Run chat-integrations package tests
        if: ${{ !cancelled() }}
        run: npm run test -w packages/chat-integrations

  # ── API Docker image (same path as Render native Dockerfile builds) ─────
  api-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # `load: true` (was false) so the next step has an image to run.
          load: true
          tags: frapp-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # A green build doesn't prove the image starts: in #1160 the image failed to boot
      # on Render for 67 pushes while this job stayed green.
      - name: Boot the image and probe /health
        run: |
          set -euo pipefail

          # /health answers 200 with no database, so fake values pass env validation and a
          # 200 proves Nest is serving. sk_test_ci_not_real is a placeholder that
          # StripePriceConsistency skips; a real-looking key would call Stripe at boot.
          docker run -d --name frapp-api-ci -p 3001:3001 \
            -e SUPABASE_URL=http://127.0.0.1:1 \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-not-a-real-key \
            -e STRIPE_SECRET_KEY=sk_test_ci_not_real \
            -e STRIPE_WEBHOOK_SECRET=whsec_ci_not_real \
            -e STRIPE_PRICE_ID=price_ci_not_real \
            frapp-api:ci

          # /health against a dead SUPABASE_URL takes ~7s, so bound the loop by a total
          # deadline rather than a short per-request timeout.
          deadline=$(( SECONDS + 180 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # No --show-error: `docker logs` below is the diagnostic that matters.
            if curl --fail --silent --max-time 25 http://127.0.0.1:3001/health; then
              echo
              echo "::notice::API image booted and answered /health"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=frapp-api-ci)" ]; then
              echo "::error::Container exited before answering /health -- the image cannot start"
              docker logs frapp-api-ci
              exit 1
            fi
            sleep 2
          done

          echo "::error::/health did not answer within 180s"
          docker logs frapp-api-ci
          exit 1

      - name: Remove the probe container
        if: always()
        run: docker rm -f frapp-api-ci >/dev/null 2>&1 || true

  # ── API contract freshness check ────────────────────────────────────────
  api-contract-check:
    needs: packages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Check API contract freshness (PR)
        if: github.event_name == 'pull_request'
        run: npm run check:api-contract -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Check API contract freshness (push)
        if: github.event_name == 'push'
        run: npm run check:api-contract

      # Breaking-change detection: blocking against shipped mobile builds, advisory
      # against the PR base (docs/ci-cd/quality-gates.md § oasdiff). The install is
      # `continue-on-error`; `--shipped` still fails without oasdiff once a build is listed.
      - name: Cache oasdiff
        uses: actions/cache@v6
        with:
          path: .cache/oasdiff
          key: oasdiff-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-oasdiff.sh') }}

      - name: Install oasdiff
        continue-on-error: true
        run: bash scripts/install-oasdiff.sh

      # Runs on push too, so a break that reached main turns main red.
      - name: Check API compatibility with shipped mobile builds (blocking)
        run: npm run check:api-breaking:shipped

      # `!cancelled()`: its findings are the only report of breaks to routes no shipped build had.
      - name: Detect breaking API changes against the PR base (advisory)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: npm run check:api-breaking -- --base "${{ github.event.pull_request.base.sha }}"

  # ── Architectural boundary linting (dependency-cruiser) ─────────────────
  # Required, against a shrink-only baseline (docs/ci-cd/quality-gates.md
  # § dependency-cruiser). Needs built packages: the cruise resolves workspace
  # imports through node_modules symlinks.
  dependency-cruiser:
    needs: packages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Check architectural boundaries
        run: npm run check:dep-cruiser

      - name: Prove the modules/ wiring rules still fire
        # The real tree has nothing for them to catch, so the boundary check
        # above passes with or without them (#3219).
        run: npm run check:dep-cruiser:rules

  # ── Duplicate detection (jscpd) ─────────────────────────────────────────
  # Advisory, so absent from required-checks.mjs (docs/ci-cd/quality-gates.md
  # § jscpd). A breach fails the job visibly; never add `continue-on-error`, which
  # would turn it green.
  duplicate-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Check duplication against the repo-wide threshold
        run: npm run check:duplication

      # The clone-by-clone detail is in the JSON report, so upload it on failure too.
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jscpd-report
          path: .jscpd/
          if-no-files-found: ignore
          retention-days: 14

  # ── Migration safety ────────────────────────────────────────────────────
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Check migration safety (PR)
        if: github.event_name == 'pull_request'
        run: npm run check:migration-safety -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      # No range on push: the promotion-docs half is a PR-time gate. Filename checks
      # (#980) and the ledger-coverage ratchet still run here.
      - name: Check migration safety (push)
        if: github.event_name == 'push'
        run: npm run check:migration-safety

  # ── Migration lock safety (ADVISORY) ────────────────────────────────────
  # Squawk over changed migrations, flagging locks that are instant on staging and
  # a write outage in production. Advisory until the existing findings get a
  # baseline (counts in .squawk.toml; `check-migration-lock-safety.mjs --strict` is
  # the switch), so not a required check.
  migration-lock-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports; never blocks. Don't remove without that baseline.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # squawk-cli is an exact-pinned devDependency.
      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Lint changed migrations (PR)
        if: github.event_name == 'pull_request'
        run: npm run check:migration-lock-safety -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Lint changed migrations (push)
        if: github.event_name == 'push'
        run: npm run check:migration-lock-safety -- --base "${{ github.event.before }}" --head "${{ github.sha }}"

  # ── Chapter directory seed validation ───────────────────────────────────
  # supabase/seed/chapter_directory.csv. Blocking because a bad hex renders as a
  # plausible wrong color (#840). Node builtins only, so no install.
  chapter-directory-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      - name: Validate the chapter directory seed
        run: npm run check:chapter-directory-seed

  # ── Mobile app validation ───────────────────────────────────────────────
  mobile-validate:
    needs: packages-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      # An off-line Expo package first fails in `eas build` (#2218). Checks installed
      # Expo packages and Dependabot's ignore list (#2330,
      # docs/ci-cd/dependency-updates.md); first, because it builds nothing.
      - name: Expo packages on the installed SDK line
        run: npm run check:expo-sdk-line

      # Hands the module graph to Metro as EAS does, before "Build shared packages"
      # (#2388; why: docs/mobile/testing.md; mobile-bundle-gate.test.mjs locks the
      # order). Never add `--dev`. No EAS profile
      # or EXPO_PUBLIC_* is set, so no secrets and nothing real is inlined. iOS only:
      # the app's sources have no platform split.
      - name: App bundles for iOS without prebuilt packages (expo export)
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-bundle"

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Lint mobile
        run: npm run lint -w apps/mobile

      - name: Type check mobile
        run: npm run check-types -w apps/mobile

      # Ran nowhere until #687, which found a guard that had regressed.
      - name: Mobile unit tests
        run: npm run test -w apps/mobile

      # CI is UTC; also run east of Greenwich to catch UTC/local date bugs (#1058).
      # Specs asserting calendar days use local-time constructors.
      - name: Mobile unit tests (Asia/Tokyo)
        env:
          TZ: Asia/Tokyo
        run: npm run test -w apps/mobile

      # What the binaries declare, read from the introspected config rather than
      # app.json (#2343); roster and reasons in scripts/check-mobile-native-declarations.mjs.
      # Before prebuild: introspection reads ios/ and android/ when they exist.
      - name: Native declarations match the roster (expo config --type introspect)
        run: npm run check:mobile-native-declarations

      # Runs the config plugins as EAS does before compiling; a root `overrides` entry
      # once broke every iOS build unseen (docs/security/security-fixes.md).
      # `--clean` keeps a cached runner from masking an incremental-only plugin.
      - name: Native projects generate from app.json (expo prebuild)
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --no-install --clean --platform all

  # ── Deploy-gate script unit tests ───────────────────────────────────────
  ci-scripts-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      - name: Run deploy-gate script tests
        # No npm ci needed — these tests have no dependencies beyond node:test.
        run: npm run test:ci-scripts

  # ── Dependency audit gate (issue #618) ──────────────────────────────────
  # No install: audits the lockfile. Allowlist entries need a reason, an issue and
  # an expiry (docs/security/security-fixes.md § npm audit sweep + CI gate).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      - name: npm audit gate (high/critical block unless allowlisted)
        run: npm run check:npm-audit

  # ── Secret scanning (gitleaks; ADR-13 push-protection replacement) ──────
  # gitleaks over the commit range; the pre-commit hook is the local primary
  # (docs/ci-cd/secret-scanning.md).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      # scan-secrets.mjs fetches the pinned gitleaks binary on first run (no npm ci needed).
      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        run: node scripts/scan-secrets.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        run: node scripts/scan-secrets.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}"

  # ── PGlite migration + RLS smoke validator (ADR-11 / ADR-12) ────────────
  # Applies every migration to PGlite and asserts schema landmarks, RLS posture
  # and probe-role enforcement (scripts/pglite/), then checks
  # the change-ping contract. Realtime, Presence and GoTrue with real JWTs are out
  # of reach (ADR-12); other limits: docs/security/authorization-model.md
  # § RLS enforcement.
  pglite-migrations:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.pglite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Apply migrations to PGlite + assert schema landmarks
        run: npm run check:pglite-migrations

      # A migration-only PR skips `web-tests`, so the change-ping contract (#2593) runs here too.
      - name: Change-ping contract against the applied migrations
        working-directory: apps/web
        run: npx vitest run lib/realtime/change-topics.spec.ts

  # ── 375px responsive floor (REQUIRED) ───────────────────────────────────
  # No baseline and no pixels (#1152). No `continue-on-error`. Spec selection and
  # the guards against a zero-test run: docs/ci-cd/quality-gates.md.
  web-responsive-floor:
    needs: [packages-build, changes]
    if: ${{ github.event_name == 'push' || needs.changes.outputs.web == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and install dependencies
        uses: ./.github/actions/node-setup
        with:
          install: ci

      - name: Build shared packages
        uses: ./.github/actions/turbo-packages-build

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Version-keyed. A concurrent run's "Unable to reserve cache" warning is harmless.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Drop Google's apt source, whose Hash Sum mismatches retries can't absorb. OS deps
      # aren't in the browser cache, so never skip this on a hit or `|| true` it.
      - name: Install Playwright OS deps
        # Hung for two hours on 2026-10-01 (#3129); fails a hang before the job timeout.
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google.list
          for i in 1 2 3; do
            if npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install-deps failed after 3 attempts (see prior apt output)."
              exit 1
            fi
            echo "Attempt $i/3 failed — retrying in 20s..."
            sudo rm -rf /var/lib/apt/lists/* || true
            sleep 20
          done
          echo "::error::playwright install-deps retry loop ended without success."
          exit 1

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Assert every dashboard route holds the 375px floor
        run: npm run test:floor -w apps/web

      # No artifact: the failure names the route, the widest element, its width and classes.

  # ── The landing fold (REQUIRED) ─────────────────────────────────────────
  # Fold geometry, reveal motion and chat frames against the reskin boards (#2368,
  # #2893). Why a production build and one spec: apps/landing/playwright.config.ts.
  # No `continue-on-error`.
  landing-fold:
    needs: [packages-build, changes]
