          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Same apt workaround as web-responsive-floor, pinned by playwright-install-deps-retry.test.mjs.
      - name: Install Playwright OS deps
        # Hung for two hours on 2026-10-01 (#3129); fails a hang before the job timeout.
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google.list
          for i in 1 2 3; do
            if npx playwright install-deps chromium; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install-deps failed after 3 attempts (see prior apt output)."
              exit 1
            fi
            echo "Attempt $i/3 failed — retrying in 20s..."
            sudo rm -rf /var/lib/apt/lists/* || true
            sleep 20
          done
          echo "::error::playwright install-deps retry loop ended without success."
          exit 1

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # The config's `webServer` produces the production build and serves it.
      - name: Assert the fold holds the boards' geometry
        run: npm run test:fold -w apps/landing

      # No artifact upload: every assertion fails with the measurement and element.
