name: Deploy production
# The Actions list otherwise shows one red row named "Deploy production" when
# tagging fails after a live ship (run 34155737950, 2026-09-07). Scope + SHA
# in the run title is what you read before opening the jobs.
#
# `DRY RUN` leads, and is not merely appended, because the Actions list truncates
# from the right — a marker at the end is the first thing to disappear at the
# width where it is needed. The title used to be scope + SHA alone, so a dry run
# and a live ship produced two IDENTICAL rows and the only way to tell them apart
# was to open the run and read which steps were skipped. That was already a
# papercut; it gets sharper now that a dry run also installs dependencies and
# builds both frontends, so the two read alike for minutes at a time, and the one
# question being asked of that row is whether production moved.
#
# `== true` rather than a bare truthiness test. A bare `inputs.dry_run_only &&`
# is correct while the input arrives as a real boolean, and it does — the `if:`
# conditions below rely on the same thing. But a non-empty STRING is truthy in
# these expressions, so under any future where this reaches the title as
# `"false"`, a bare test would label every live ship `DRY RUN`: the failure is
# silent, and it points the wrong way. `== true` is false for `"false"` and for
# `false` alike, so the marker can only ever be missing, never lying.
run-name: "${{ inputs.dry_run_only == true && 'DRY RUN · ' || '' }}${{ inputs.scope }} ${{ inputs.sha }}"

# The ONLY path to production. A human opens Actions, names a commit, types a
# confirmation, and approves the `production` environment. Nothing here fires on
# its own.
#
# ── What this replaced ──────────────────────────────────────────────────────
# Until #1340, production was a git branch. Merging `main` -> `production`
# triggered everything: Render auto-deployed the branch, Vercel treated it as
# its Production Branch, `deploy-api.yml` applied migrations off
# `head_branch == 'production'`, and `release.yml` tagged a version off the
# merge-commit message.
#
# The problem was never that the model was complicated; it was that nothing in
# it named a commit. Render's own setting was `autoDeploy: yes` with
# `autoDeployTrigger: commit`, so a push deployed WITHOUT waiting for CI — the
# workflow's green-CI gate governed only its own deploy hook. What shipped was
# whatever happened to be at a branch tip.
#
# Here the artifact is an input. The same SHA is migrated, deployed to Render,
# built for Vercel production, and tagged.
#
# ── Where the old gates went ────────────────────────────────────────────────
# Branch protection on `production` did two things, and both come back as steps
# rather than as repository settings:
#
#   * `branch-policy` (ci.yml) enforced that a PR into `production` came from
#     `main`. That is now `git merge-base --is-ancestor` in
#     `scripts/ci/validate-deploy-sha.mjs`.
#   * Required status checks gated the merge. A dispatch has no PR and therefore
#     no required checks, so the same script asks the checks API directly,
#     against the very list `configure-branch-protection.mjs` writes to GitHub.
#
# The human gate is the `production` environment's Required reviewers. It is now
# the ONLY approval, and it happens at the moment of deploy on a run that names
# the commit — rather than at a promotion PR opened before anyone knew whether
# the migration applied.
#
# ── `scope`, and the workflow this absorbed ─────────────────────────────────
# `migrate-production.yml` used to sit beside this file as a code-free escape
# hatch: apply migrations without shipping code, for a failed apply, a backlog
# ahead of the code that needs it, or a schedule no deploy matches. It has been
# deleted, and `scope: migrations-only` does that job here instead.
#
# It was deleted because it was strictly more dangerous than the path it backed
# up. It took an arbitrary `ref`, and it skipped SHA validation, the provider
# guardrail preflight, the migration replay and the working-tree fence — every
# safety layer this workflow runs (in `_deploy.yml` since #2805). Its own
# header argued the replay was unreliable "when
# something has already gone wrong", but the state it could not reconstruct is a
# foreign migration, and a foreign migration blocks `supabase db push` outright
# anyway. So the rehearsal was not the thing that failed in that scenario; it was
# the thing that would have said so first.
#
# What `scope: migrations-only` gives up against the old workflow, stated in
# full rather than flatteringly:
#
#   * Applying migrations from a ref that is not an ancestor of `main`, or from
#     a commit whose CI was not green. Both worth losing.
#   * Applying migrations when the REHEARSAL ITSELF REFUSES. The replay step
#     (`_deploy.yml`) is deliberately NOT scope-gated — a migrations-only run is
#     still a write to the production database, and the rehearsal is the only thing that
#     has ever executed that write first — so `foreign-migrations` or
#     `back-dated-migrations` stops a migrations-only run exactly as it stops a
#     full one. The old workflow would have proceeded, because it never
#     rehearsed at all.
#
# The second is a real narrowing and it is taken on purpose. In both of those
# states `supabase db push` refuses anyway, so what the old path bought was
# reaching the refusal later, mid-run, with less explanation — not reaching a
# different outcome. Recovery from either is a human act by design (decision 7:
# `--include-all` is human-run, never set by a workflow) and is documented at
# `docs/internal/ops/DB_PROMOTION_RUNBOOK.md` § `--include-all`.
#
# The case that IS a genuine gap: a non-transactional partial apply — say
# `CREATE INDEX CONCURRENTLY` leaving objects behind with no history row. The
# rehearsal rebuilds without them, applies cleanly, and passes; the real apply
# then hits "already exists". The deleted workflow's dry run was equally blind
# to it, so this is not a regression, but nothing here catches it either.
#
# ── One shipping job, deliberately ──────────────────────────────────────────
# Every environment-scoped job costs its own Approve click. Migrate + deploy +
# verify live in ONE `environment: production` job so a production release is
# one approval, not four. That job is `_deploy.yml`'s, the one staging runs
# too (epic #2802, #2805): its header has the order and the trust split, and
# production's layers are its steps named `inputs.environment ==
# 'production'`. The `release` and `deploy-outcome` jobs are unscoped and add
# no clicks.
#
# SHA confirmation, trim, and `validate-deploy-sha.mjs` run in a *prior*
# unscoped job. Run 34234768094 sat on the reviewer gate for 20 minutes, then
# died at Validate because the paste had a trailing space — production was not
# touched, but the approval was spent. A bad SHA or confirmation must fail
# before GitHub asks anyone to Approve. Do not put `environment: production`
# on `validate`.
#
# ── Names other things depend on ────────────────────────────────────────────
# `migration-snapshot.yml` triggers on this workflow's NAME, "Deploy
# production", and the `download-migration-snapshot` action reads this FILE's
# runs. The `deploy-outcome` job selects `ALERT_CONFIG: deploy-production` in
# `scripts/ci/deploy-alert.mjs`, which keys on the job name `deploy`.
# Renaming any of them breaks those silently.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to deploy (must be on main and CI-green)"
        required: true
        type: string
      confirm:
        description: "Type exactly: DEPLOY TO PRODUCTION"
        required: true
        type: string
      dry_run_only:
        # This one sentence is the whole description an operator gets in the
        # Actions UI, so it has to name the build: a dry run that silently took
        # several minutes longer than its description promised would read as a
        # hung runner and get cancelled.
        description: "Validate, rehearse the migration, BUILD both frontends, and stop. Applies nothing, uploads nothing, deploys nothing."
        required: false
        default: false
        type: boolean
      scope:
        description: >-
          'full' migrates and deploys the commit. 'migrations-only' applies the
          migrations and stops — no Render deploy, no Vercel build, no tag.
        required: false
        default: full
        type: choice
        options: [full, migrations-only]
      bump:
        description: "Version bump. 'auto' reads release:* labels on the PRs merged since the last tag."
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: read

jobs:
  validate:
    name: Confirm and validate the SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment:`. This job is the whole point of the split: it must
    # run (and be allowed to fail) without opening a production deployment
    # review. Do not add `environment: production` here.
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # First step on purpose: a mistyped confirmation must cost nothing. No
      # checkout, no secrets injected, no CLI installed before this passes.
      - name: Verify confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY TO PRODUCTION" ]; then
            echo "::error::Confirmation phrase did not match. Type exactly: DEPLOY TO PRODUCTION"
            exit 1
          fi

      # The Actions text box keeps a trailing space/newline from paste
      # (run 34234768094 died on 40 hex + one space before any production
      # write). Strip ends only — not internal spaces — then the shipping
      # call, the release job and the deploy-outcome job use this output.
      - name: Trim the SHA
        id: sha
        env:
          RAW_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$RAW_SHA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Checked out at the DISPATCHED ref (main), not at `inputs.sha`. The
      # validation below decides whether that SHA is trustworthy, so it has to
      # run from code that is already trusted — validating a commit using its
      # own copy of the validator proves nothing. The shipping job moves the
      # tree to the SHA after this job passes.
      - name: Checkout (trusted ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Ancestry + CI-green. Both assertions are fatal, and an unreadable checks
      # API is a failure rather than a pass.
      - name: Validate the commit
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/validate-deploy-sha.mjs

  # The shipping work is `_deploy.yml`'s one job, the job staging runs too,
  # with production's layers switched on by `environment: production`: the
  # provider preflight, the migration rehearsal and its fence, the dry-run
  # stop, the `config.toml` assert and `scope: migrations-only` (#2805). That
  # job names the environment itself, so it gets production's reviewers and
  # holds `db-migrate-production`. It gets production's secrets only because
  # this call passes `secrets: inherit` (as staging's does; run 36479856561
  # read them empty without it, #2804). The call names no environment (a job
  # that calls a workflow can't) and no secret of its own.
  #
  # A caller's `env:` does not reach a called workflow, which is why this file
  # has none: `_deploy.yml` reads the Render and Vercel ids from
  # `.github/environments.json` itself (#2806).
  deploy:
    name: Migrate, then ship Render + Vercel
    needs: validate
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      sha: ${{ needs.validate.outputs.sha }}
      dry_run: ${{ inputs.dry_run_only }}
      scope: ${{ inputs.scope }}

  # Tagging is a separate job only because `workflow_call` cannot be a step. It
  # carries no `environment:`, so it costs no second approval click.
  #
  # The tag is created AFTER Render and Vercel report healthy, on the exact SHA
  # that was deployed — so `vX.Y.Z` now means "this is live", where it used to
  # mean "this was merged and we hoped it would ship".
  release:
    name: Mint v* tag (does not roll back a live ship)
    needs: [validate, deploy]
    # The scope clause is not decoration. A tag means "this is what is live",
    # and a migrations-only run changes the database without changing a single
    # deployed byte — tagging it would record a release that never shipped,
    # which is the precise failure `vX.Y.Z` was redefined in #1340 to stop.
    #
    # Written `!= 'migrations-only'`, never `== 'full'`. Every scope condition in
    # this file has that polarity on purpose: an unexpected or empty `scope`
    # then behaves like a normal release, where `== 'full'` would silently skip
    # the deploy and the tag and still report success — a production run that
    # ships nothing and says it worked. That is the exact failure class this
    # workflow was rebuilt to make impossible, so it must not be reintroduced by
    # the shape of a conditional.
    if: ${{ needs.deploy.result == 'success' && !inputs.dry_run_only && inputs.scope != 'migrations-only' }}
    uses: ./.github/workflows/release.yml
    permissions:
      # A called workflow's job permissions are intersected with what the caller
      # grants, so both sides need `pull-requests: read` and `issues: read` —
      # see the note in release.yml. Granting them only there would still leave
      # the token unable to read `release:*` labels or classify a /pulls 404
      # as a bare issue (#1839).
      contents: write
      pull-requests: read
      issues: read
    # `secrets: inherit`, so the called job sees RELEASE_GITHUB_TOKEN from its
    # `automation` environment. Without it GitHub releases none of that
    # environment's secrets to the called job, and the tag step falls back to
    # the Actions token, which is refused a tag whose workflows differ from
    # `main` (run 34254679932). v1.3.0's tag object was made by that token, not
    # the PAT, which is how this was seen (#2804 follow-up; actions/runner#4453).
    # No repository secret exists to pass (#2518).
    secrets: inherit
    # The validated SHA, the same value `deploy` was called with.
    with:
      sha: ${{ needs.validate.outputs.sha }}
      bump: ${{ inputs.bump }}

  # Terminal reporting. A `workflow_dispatch` failure reds one row in the
  # Actions list and emails the actor, which is thin for the only path to
  # production, and it cannot express "deployed fine, then failed to tag". So
  # this job files an alert issue through `deploy-alert.mjs` (#2805) and writes
  # the step summary, red when the tag failed after a live ship.
  #
  # Named `deploy-outcome`, the job the alert's body names. Runs whenever
  # `deploy` was attempted: `validate` failing (a mistyped confirmation, a red
  # SHA) skips `deploy`, and costs nothing, so it never alerts.
  deploy-outcome:
    name: Summarize — red if the tag failed even when live
    needs: [validate, deploy, release]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # This attempt's jobs, so a deploy job that never started files no alert.
      actions: read
    steps:
      # The alert steps run on a real ship or a migrations-only run that
      # FAILED; never on a dry run (nothing was applied, and the dispatcher is
      # watching) and never on a cancelled run (a human stopped it). A green
      # migrations-only run doesn't run them either: the code didn't ship, so
      # it can't close the alert. A `deploy` job that ran no step (a declined
      # approval, say) fails with production unchanged; deploy-alert.mjs reads
      # this attempt's jobs (`actions: read`) and files nothing for it. The tag
      # is not the alert's: a failed `release` reds the summary below, and
      # `production-release-pin.yml`'s P1 alert catches hosts left untagged.
      - name: Checkout
        if: ${{ !cancelled() && !inputs.dry_run_only && (inputs.scope != 'migrations-only' || needs.deploy.result != 'success') }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report deploy outcome and alert on failure
        id: alert
        if: ${{ !cancelled() && !inputs.dry_run_only && (inputs.scope != 'migrations-only' || needs.deploy.result != 'success') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_CONFIG: deploy-production
          DEPLOY_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ needs.validate.outputs.sha }}
        run: node scripts/ci/deploy-alert.mjs

      # One alert per Sentry project (#2489), from the deploy job's
      # `sourcemaps` report. Only on a real `full` run that succeeded: a dry
      # run and a `migrations-only` run build nothing, and a failed run is the
      # alert above. The checkout's condition covers every run this one
      # reaches. Exits 0 on every handled outcome, so the summary below still
      # decides this job's colour.
      - name: Alert on missing Sentry source maps
        if: ${{ !cancelled() && !inputs.dry_run_only && inputs.scope != 'migrations-only' && needs.deploy.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # From this job's context, not the deploy job's output, which may
          # carry neither (see the verifier's header).
          TARGET_ENVIRONMENT: production
          DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
          SOURCEMAPS: ${{ needs.deploy.outputs.sourcemaps }}
          SOURCEMAPS_CHECKED: ${{ needs.deploy.outputs.sourcemaps-checked }}
        run: node scripts/ci/sentry-sourcemaps-alert.mjs

      # Last, because it exits 1 on a failed deploy or tag, which would skip
      # any step after it. `always()`, so a failed alert step can't cost the
      # summary too.
      - name: Summarise what actually happened
        if: always()
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RENDER_DEPLOY_ID: ${{ needs.deploy.outputs.render-deploy-id }}
          REPLAY_OUTCOME: ${{ needs.deploy.outputs.replay-outcome }}
          APPLIED: ${{ needs.deploy.outputs.applied }}
          DRY_RUN: ${{ inputs.dry_run_only }}
          SCOPE: ${{ inputs.scope }}
          SHA: ${{ needs.validate.outputs.sha }}
          # `not-started` when the alert step found the deploy job ran no step.
          ALERT_OUTCOME: ${{ steps.alert.outputs.outcome }}
        run: |
          {
            # The heading, not just a row: this summary gets linked and
            # screenshotted as evidence that a SHA shipped, and a dry run's table
            # otherwise reads `Migrate + deploy: success` with `Render deploy id:
            # none` as the only tell. Same ambiguity `run-name` was changed to
            # remove, one level down — and a dry run now looks even more like a
            # ship, because it builds.
            if [ "$DRY_RUN" = "true" ]; then
              echo "### DRY RUN — production was NOT deployed — \`$SHA\`"
              echo ""
              echo "> Nothing was applied and nothing was deployed. \`Migrate + deploy: success\`"
              echo "> below means the REHEARSAL succeeded, not that this commit is live."
            else
              echo "### Production deploy — \`$SHA\`"
            fi
            echo ""
            echo "| Phase | Result |"
            echo "| --- | --- |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Scope | \`$SCOPE\` |"
            echo "| Migrate + deploy | \`$DEPLOY_RESULT\` |"
            # "not reported", not "not reached": these come through the called
            # workflow's outputs, which a failed call may not carry back.
            echo "| Migrations applied | \`${APPLIED:-not reported}\` |"
            echo "| Migration rehearsal | \`${REPLAY_OUTCOME:-not reported}\` |"
            echo "| Render deploy id | \`${RENDER_DEPLOY_ID:-not reported}\` |"
            echo "| Release tag | \`${RELEASE_RESULT:-skipped}\` |"
            echo ""
            if [ "$REPLAY_OUTCOME" = "nothing-pending" ]; then
              echo "> The migration rehearsal found nothing pending, so it verified nothing."
              echo "> That is the ordinary case and is not evidence that an apply would work."
              echo ""
            fi
            if [ "$SCOPE" = "migrations-only" ] && [ "$DRY_RUN" != "true" ]; then
              echo "> **Migrations only.** The database moved; Render, Vercel and the version tag"
              echo "> did not. Production is now running the PREVIOUS code against the NEW schema,"
              echo "> so the migrations had better be forward-compatible with it. Finish with a"
              echo "> \`full\` run against the same SHA when the code is meant to follow."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALERT_OUTCOME" = "not-started" ]; then
            echo "::error::Production deploy did not start ($DEPLOY_RESULT): the deploy job ran no step (a declined approval, say). Nothing ran; production is unchanged."
            exit 1
          fi
          # A dry run applies nothing, so its failure never needs the rollback.
          if [ "$DEPLOY_RESULT" != "success" ] && [ "$DRY_RUN" = "true" ]; then
            echo "::error::Production dry run did not succeed ($DEPLOY_RESULT). A dry run applies nothing; read the failing step above."
            exit 1
          fi
          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Production deploy did not succeed ($DEPLOY_RESULT). Read the failing step above; if migrations were applied, docs/internal/ops/DB_ROLLBACK_PLAYBOOK.md owns recovery."
            exit 1
          fi

          # The quiet failure this job exists for: production is updated and no
          # tag exists, so nothing records what is live.
          #
          # Scoped to `full`. A migrations-only run skips `release` on purpose
          # (see that job's `if:`), and without this clause every such run would
          # end by erroring that the tag it was never going to create is
          # missing — a red run for doing exactly what was asked.
          if [ "$DRY_RUN" != "true" ] && [ "$SCOPE" != "migrations-only" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Deploy succeeded but the release tag did not ($RELEASE_RESULT). Production IS updated. Re-run the 'Release' workflow manually with sha=$SHA to record it."
            exit 1
          fi
