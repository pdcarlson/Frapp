name: Deploy production
# The Actions list otherwise shows one red row named "Deploy production" when
# tagging fails after a live ship (run 34155737950, 2026-09-07). Scope + SHA
# in the run title is what you read before opening the jobs.
#
# `DRY RUN` leads, and is not merely appended, because the Actions list truncates
# from the right — a marker at the end is the first thing to disappear at the
# width where it is needed. The title used to be scope + SHA alone, so a dry run
# and a live ship produced two IDENTICAL rows and the only way to tell them apart
# was to open the run and read which steps were skipped. That was already a
# papercut; it gets sharper now that a dry run also installs dependencies and
# builds both frontends, so the two read alike for minutes at a time, and the one
# question being asked of that row is whether production moved.
#
# `== true` rather than a bare truthiness test. A bare `inputs.dry_run_only &&`
# is correct while the input arrives as a real boolean, and it does — the `if:`
# conditions below rely on the same thing. But a non-empty STRING is truthy in
# these expressions, so under any future where this reaches the title as
# `"false"`, a bare test would label every live ship `DRY RUN`: the failure is
# silent, and it points the wrong way. `== true` is false for `"false"` and for
# `false` alike, so the marker can only ever be missing, never lying.
run-name: "${{ inputs.dry_run_only == true && 'DRY RUN · ' || '' }}${{ inputs.scope }} ${{ inputs.sha }}"

# The ONLY path to production. A human opens Actions, names a commit, types a
# confirmation, and approves the `production` environment. Nothing here fires on
# its own.
#
# ── What this replaced ──────────────────────────────────────────────────────
# Until #1340, production was a git branch. Merging `main` -> `production`
# triggered everything: Render auto-deployed the branch, Vercel treated it as
# its Production Branch, `deploy-api.yml` applied migrations off
# `head_branch == 'production'`, and `release.yml` tagged a version off the
# merge-commit message.
#
# The problem was never that the model was complicated; it was that nothing in
# it named a commit. Render's own setting was `autoDeploy: yes` with
# `autoDeployTrigger: commit`, so a push deployed WITHOUT waiting for CI — the
# workflow's green-CI gate governed only its own deploy hook. What shipped was
# whatever happened to be at a branch tip.
#
# Here the artifact is an input. The same SHA is migrated, deployed to Render,
# built for Vercel production, and tagged.
#
# ── Where the old gates went ────────────────────────────────────────────────
# Branch protection on `production` did two things, and both come back as steps
# rather than as repository settings:
#
#   * `branch-policy` (ci.yml) enforced that a PR into `production` came from
#     `main`. That is now `git merge-base --is-ancestor` in
#     `scripts/ci/validate-deploy-sha.mjs`.
#   * Required status checks gated the merge. A dispatch has no PR and therefore
#     no required checks, so the same script asks the checks API directly,
#     against the very list `configure-branch-protection.mjs` writes to GitHub.
#
# The human gate is the `production` environment's Required reviewers. It is now
# the ONLY approval, and it happens at the moment of deploy on a run that names
# the commit — rather than at a promotion PR opened before anyone knew whether
# the migration applied.
#
# ── `scope`, and the workflow this absorbed ─────────────────────────────────
# `migrate-production.yml` used to sit beside this file as a code-free escape
# hatch: apply migrations without shipping code, for a failed apply, a backlog
# ahead of the code that needs it, or a schedule no deploy matches. It has been
# deleted, and `scope: migrations-only` does that job here instead.
#
# It was deleted because it was strictly more dangerous than the path it backed
# up. It took an arbitrary `ref`, and it skipped SHA validation, the provider
# guardrail preflight, the migration replay and the working-tree fence — every
# safety layer below. Its own header argued the replay was unreliable "when
# something has already gone wrong", but the state it could not reconstruct is a
# foreign migration, and a foreign migration blocks `supabase db push` outright
# anyway. So the rehearsal was not the thing that failed in that scenario; it was
# the thing that would have said so first.
#
# What `scope: migrations-only` gives up against the old workflow, stated in
# full rather than flatteringly:
#
#   * Applying migrations from a ref that is not an ancestor of `main`, or from
#     a commit whose CI was not green. Both worth losing.
#   * Applying migrations when the REHEARSAL ITSELF REFUSES. The replay step
#     below is deliberately NOT scope-gated — a migrations-only run is still a
#     write to the production database, and the rehearsal is the only thing that
#     has ever executed that write first — so `foreign-migrations` or
#     `back-dated-migrations` stops a migrations-only run exactly as it stops a
#     full one. The old workflow would have proceeded, because it never
#     rehearsed at all.
#
# The second is a real narrowing and it is taken on purpose. In both of those
# states `supabase db push` refuses anyway, so what the old path bought was
# reaching the refusal later, mid-run, with less explanation — not reaching a
# different outcome. Recovery from either is a human act by design (decision 7:
# `--include-all` is human-run, never set by a workflow) and is documented at
# `docs/internal/ops/DB_PROMOTION_RUNBOOK.md` § `--include-all`.
#
# The case that IS a genuine gap: a non-transactional partial apply — say
# `CREATE INDEX CONCURRENTLY` leaving objects behind with no history row. The
# rehearsal rebuilds without them, applies cleanly, and passes; the real apply
# then hits "already exists". The deleted workflow's dry run was equally blind
# to it, so this is not a regression, but nothing here catches it either.
#
# ── One shipping job, deliberately ──────────────────────────────────────────
# Every environment-scoped job costs its own Approve click. Migrate + deploy +
# verify live in ONE `environment: production` job so a production release is
# one approval, not four. The `release` and `report` jobs are unscoped and add
# no clicks.
#
# SHA confirmation, trim, and `validate-deploy-sha.mjs` run in a *prior*
# unscoped job. Run 34234768094 sat on the reviewer gate for 20 minutes, then
# died at Validate because the paste had a trailing space — production was not
# touched, but the approval was spent. A bad SHA or confirmation must fail
# before GitHub asks anyone to Approve. Do not put `environment: production`
# on `validate`.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to deploy (must be on main and CI-green)"
        required: true
        type: string
      confirm:
        description: "Type exactly: DEPLOY TO PRODUCTION"
        required: true
        type: string
      dry_run_only:
        # This one sentence is the whole description an operator gets in the
        # Actions UI, so it has to name the build: a dry run that silently took
        # several minutes longer than its description promised would read as a
        # hung runner and get cancelled.
        description: "Validate, rehearse the migration, BUILD both frontends, and stop. Applies nothing, uploads nothing, deploys nothing."
        required: false
        default: false
        type: boolean
      scope:
        description: >-
          'full' migrates and deploys the commit. 'migrations-only' applies the
          migrations and stops — no Render deploy, no Vercel build, no tag.
        required: false
        default: full
        type: choice
        options: [full, migrations-only]
      bump:
        description: "Version bump. 'auto' reads release:* labels on the PRs merged since the last tag."
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: read

env:
  # Not secrets — the same identifiers `verify-deployments.yml` already hardcodes.
  RENDER_PROD_SERVICE_ID: srv-d6lqu41aae7s73f62df0
  VERCEL_WEB_PROJECT_ID: prj_xkn32taKrJCgYRZoN6pZRfGfPT9T
  VERCEL_LANDING_PROJECT_ID: prj_aAkER9EZJcxR51vUY0mwNDnCf8vy
  VERCEL_TEAM_ID: team_j9XLIANou5EpvALrr4bM9Nee

jobs:
  validate:
    name: Confirm and validate the SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `environment:`. This job is the whole point of the split: it must
    # run (and be allowed to fail) without opening a production deployment
    # review. Do not add `environment: production` here.
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # First step on purpose: a mistyped confirmation must cost nothing. No
      # checkout, no secrets injected, no CLI installed before this passes.
      - name: Verify confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY TO PRODUCTION" ]; then
            echo "::error::Confirmation phrase did not match. Type exactly: DEPLOY TO PRODUCTION"
            exit 1
          fi

      # The Actions text box keeps a trailing space/newline from paste
      # (run 34234768094 died on 40 hex + one space before any production
      # write). Strip ends only — not internal spaces — then the shipping
      # job, the release job, and the report job use this output.
      - name: Trim the SHA
        id: sha
        env:
          RAW_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$RAW_SHA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Checked out at the DISPATCHED ref (main), not at `inputs.sha`. The
      # validation below decides whether that SHA is trustworthy, so it has to
      # run from code that is already trusted — validating a commit using its
      # own copy of the validator proves nothing. The shipping job moves the
      # tree to the SHA after this job passes.
      - name: Checkout (trusted ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Ancestry + CI-green. Both assertions are fatal, and an unreadable checks
      # API is a failure rather than a pass.
      - name: Validate the commit
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/validate-deploy-sha.mjs

  deploy:
    name: Migrate, then ship Render + Vercel
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    # This used to be SHARED with migrate-production.yml, which was the second
    # path that could apply a production migration. That file is gone and this
    # is now the only one, so the group serialises this workflow against
    # ITSELF — two dispatches (a `full` release and a `migrations-only` retry,
    # say) must not interleave two `db push` runs against one database.
    #
    # `cancel-in-progress: false` is the important half: cancelling a run
    # mid-`db push` is how a database ends up half-migrated.
    #
    # Note what widening the dry run costs here, because nothing else says it:
    # a `full` dry run now holds this group for an `npm ci` and two `next build`s
    # on top of the migration rehearsal, and the group deliberately does not
    # cancel. So a `migrations-only` recovery dispatch can queue behind a
    # rehearsal that by definition changes nothing, for several minutes longer
    # than before. That is the accepted price of rehearsing the build; if it ever
    # bites during an incident, the recovery path is to wait or to cancel the dry
    # run by hand, never to loosen `cancel-in-progress`.
    concurrency:
      group: db-migrate-production
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      render-deploy-id: ${{ steps.render.outputs.deploy_id }}
      replay-outcome: ${{ steps.replay.outputs.outcome }}
      applied: ${{ steps.apply.outcome }}
    steps:
      - name: Record the validated SHA
        id: sha
        env:
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SHA:-}" ]; then
            echo "::error::Validated SHA was empty."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Checked out at the DISPATCHED ref (main), not at the deploy SHA. Local
      # composite actions below resolve from this workspace. The tree moves to
      # the SHA after they run.
      - name: Checkout (trusted ref)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Also from trusted code, and before anything is applied or built. Both
      # auto-deploy and the Vercel Git-link fail OPEN: if Render's auto-deploy
      # is back on, or a Vercel project is re-linked, ordinary merges are
      # already shipping to production and this workflow is not the only path.
      # The same preflight asserts `serviceDetails.healthCheckPath` is `/health`
      # (empty is a TCP-only probe; `/health/ready` would cancel on a degraded
      # dependency).
      #
      # Under `migrations-only` exactly ONE assertion is dropped:
      # frapp-LANDING's Vercel Production Branch. Render's stays, because
      # auto-deploy being back on means an ordinary merge could ship code
      # against the schema this run is about to change. frapp-WEB's stays too:
      # `apps/web` is a direct Supabase client — PostgREST reads and
      # `postgres_changes` bindings on `public.chat_messages` and
      # `public.chat_message_actions` — so a dashboard promoted from `main` is
      # wired straight to the schema being changed, which makes the drift more
      # worth catching before a migrations-only apply, not less. frapp-landing
      # has no Supabase client at all, so it is the one thing a database-only
      # run can honestly skip.
      - name: Provider guardrail preflight
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          # The SAME identifiers the deploy steps below use. Passing them rather
          # than letting the script default means the preflight can only ever
          # assert against the services this run actually deploys to.
          RENDER_SERVICE_ID: ${{ env.RENDER_PROD_SERVICE_ID }}
          VERCEL_WEB_PROJECT_ID: ${{ env.VERCEL_WEB_PROJECT_ID }}
          VERCEL_LANDING_PROJECT_ID: ${{ env.VERCEL_LANDING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ env.VERCEL_TEAM_ID }}
          # Through the environment, not interpolated into the script body —
          # the habit this file keeps everywhere a value reaches a shell.
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ "${SCOPE:-}" = "migrations-only" ]; then
            node scripts/ci/production-guardrails.mjs --preflight --migrations-only
          else
            node scripts/ci/production-guardrails.mjs --preflight
          fi

      # ── Both local composite actions run BEFORE the detach, deliberately ──
      #
      # `uses: ./…` resolves from the runner WORKSPACE at step-execution time,
      # so a local action called after `git checkout --detach "$DEPLOY_SHA"`
      # below is loaded from the DEPLOYED COMMIT's tree rather than from the
      # trusted ref. Two consequences, both bad, and neither visible until a
      # production dispatch:
      #
      #   * Deploying any commit from before these actions existed dies with
      #     "Can't find 'action.yml'". That is the ROLLBACK path
      #     (DB_ROLLBACK_PLAYBOOK.md § Deploying an OLDER commit), so it would
      #     break at exactly the moment it is reached for.
      #   * For a newer commit it still runs, but off THAT commit's copy of
      #     `supabase-cli/action.yml` — so the pin the production apply uses is
      #     whatever was recorded at `DEPLOY_SHA`, silently diverging from the
      #     one `migration-replay` rehearsed with. That is the drift the action
      #     exists to remove, reintroduced at the one site that matters most.
      #
      # Running them here also matches this workflow's trust argument: the
      # validator in `validate` deliberately runs from already-trusted code, and
      # so now do these. Both steps are tree-independent — one exports environment
      # variables, the other puts a binary on PATH — so neither cares that the
      # workspace moves underneath it afterwards.
      #
      # NOTE: the Infisical slug for production is `prod`, not `production`.
      - name: Inject production secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Setup Supabase CLI
        uses: ./.github/actions/supabase-cli

      # Proven to be an ancestor of main, so this is already-reviewed code.
      #
      # Nothing after this point may call a local `./.github/actions/…` action —
      # see the block above. `infisical-secrets-action.test.mjs` enforces it.
      - name: Check out the commit being deployed
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git checkout --detach "$DEPLOY_SHA"
          git --no-pager log -1 --format='Deploying %H%n%s'

      # Only what the migrations need a real server for. The exclusion list is
      # copied verbatim from migration-drift-gate.yml — a different list is a
      # different rehearsal.
      - name: Start disposable Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler,mailpit

      # The #1332 gate, run here against LIVE production state rather than at PR
      # time: rebuild production's applied set on the disposable stack, then
      # apply exactly the pending tail through the same CLI path the real apply
      # uses. Read-only against production (one GET to the Management API).
      #
      # REPLAY_SUPABASE_CLI is not optional. Without it the script falls back to
      # `npx --yes supabase` and fetches whatever is latest, while the apply
      # below uses the pinned CLI on PATH (`.github/actions/supabase-cli`) — and
      # "the same CLI code path" is the entire premise of the rehearsal.
      - name: Rehearse the migration against production's applied state
        id: replay
        env:
          REPLAY_SUPABASE_CLI: supabase
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set in the Infisical 'prod' environment. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          node scripts/ci/check-migration-replay.mjs | tee "${RUNNER_TEMP:-/tmp}/replay.log"

          # `nothing-pending` exits 0 having rehearsed NOTHING, and that must not
          # read as "the apply was rehearsed" in the run summary. The script
          # prints a machine-readable `replay_outcome=<code>` line for exactly
          # this; do not go back to grepping its human message, which is where
          # this went wrong the first time.
          OUTCOME="$(grep -oP '^replay_outcome=\K.*' "${RUNNER_TEMP:-/tmp}/replay.log" | tail -n1 || true)"
          if [ -z "$OUTCOME" ]; then
            echo "::error::The replay produced no replay_outcome line. Refusing to report an unknown rehearsal state as a pass."
            exit 1
          fi
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"

      # ── The fence ────────────────────────────────────────────────────────
      # Its own step so that no `continue-on-error` anywhere can swallow it.
      #
      # `check-migration-replay.mjs` MOVES pending migrations out of
      # `supabase/migrations/` into `supabase/.migrations-replay-parked/` and
      # restores them in a `finally`. A `finally` survives a thrown error; it
      # does not survive SIGKILL (job cancellation, a runner timeout, the OOM
      # killer). In migration-drift-gate.yml that is harmless — a throwaway
      # runner that never speaks to production. Here the very next step runs
      # `supabase db push` against the real database, and `run-migration.mjs`
      # counts the BASELINE files still on disk, sees a non-zero total, does not
      # bail, pushes NOTHING, and prints "Migrations applied successfully".
      #
      # A production deploy that reports "migrations applied" having applied
      # zero is worse than one that fails. So: prove the tree is intact first.
      - name: Fence — the working tree must be intact before anything is applied
        run: |
          set -euo pipefail

          if [ -e supabase/.migrations-replay-parked ]; then
            echo "::error::supabase/.migrations-replay-parked still exists — the replay did not restore the migrations it parked. Applying now would push an incomplete set and report success. Re-run the workflow."
            ls -la supabase/.migrations-replay-parked || true
            exit 1
          fi

          # Scoped to supabase/, not just supabase/migrations/: a leaked park
          # shows up as BOTH an untracked directory and as ` D` deletions.
          DIRTY="$(git status --porcelain -- supabase/)"
          if [ -n "$DIRTY" ]; then
            echo "::error::The working tree under supabase/ is dirty after the replay. Refusing to apply migrations from an unknown state."
            echo "$DIRTY"
            exit 1
          fi

          # Asserted BEFORE the stack is torn down, so a missing secret fails
          # while the stack a re-run would need is still up.
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set in the Infisical 'prod' environment. Every migration job fails without it (supabase/cli#5091). See docs/internal/environment/ENV_REFERENCE.md."
            exit 1
          fi

          echo "Fence holds: migrations intact, tree clean, DB password present."

      # Not `|| true`. A local stack still running while the CLI is linked to a
      # remote project is the one configuration where a CLI change could
      # silently retarget, so a failure to tear down stops the deploy.
      - name: Stop the disposable Supabase stack
        run: supabase stop --no-backup

      # Always runs, including when this is not a dry run: the log records what
      # WAS pending before the apply, so a later failure is readable without
      # guessing at the prior state.
      #
      # Ahead of the build steps, not after them, and that ordering is load
      # bearing now that a dry run BUILDS. Below the build, a `next build` that
      # the OOM killer takes — named in the build step's own comment as a live
      # risk — would abort a dry run before this ever ran, and `Stop here` is
      # gated on `if: inputs.dry_run_only` rather than `always()`, so the
      # operator would get neither the pending list nor a summary: exactly the
      # output DB_PROMOTION_RUNBOOK.md tells them to read before promoting, lost
      # to a failure in a step that changes nothing.
      #
      # Nothing between here and the apply APPLIES A MIGRATION, so the pending
      # list is still accurate when the apply runs. That is the whole claim —
      # `vercel build` does run in the gap and does construct a production
      # Supabase client, so this is not a statement that the gap is inert, and it
      # is not standing permission to add a step in it that writes.
      - name: Run migrations (dry-run)
        run: node scripts/run-migration.mjs --env production --dry-run

      # ── Installed BEFORE anything is applied, deliberately ───────────────
      # `vercel build` runs each app's own build, which needs the workspace's
      # dependencies present: this is a monorepo and both apps import from
      # `packages/`. Nothing else in this job needs `node_modules` — the
      # migration half runs through the Supabase CLI and `node scripts/…`, which
      # is why the dry-run listing above can sit ahead of this install.
      #
      # So the natural place for these was next to the Vercel step at the end of
      # the job. That is the wrong place. Both steps can fail for reasons that
      # have nothing to do with this commit — a registry 5xx, a lockfile/registry
      # mismatch, a full disk — and down there a failure lands AFTER the
      # production migration has applied and the Render API has shipped, leaving
      # a migrated database and a half-updated production with no tag naming
      # what is live. Up here the same failure costs nothing: nothing has been
      # applied yet.
      #
      # Placed after the rehearsal's disposable stack has been torn down, so the
      # install never competes with it for disk or CPU, and skipped entirely on
      # the paths that never reach a Vercel build.
      - name: Install dependencies for the Vercel build
        if: ${{ inputs.scope != 'migrations-only' }}
        run: npm ci

      # Pinned, exactly like the Supabase CLI above. An unpinned `@latest` would
      # make the only path to production depend on whatever Vercel published
      # this morning.
      - name: Install Vercel CLI
        if: ${{ inputs.scope != 'migrations-only' }}
        run: npm install --global vercel@59.11.7

      # The production BUILDS of both frontends happen HERE, before a single byte
      # of production has changed — the upload is a separate step at the end of
      # the job. This is the same reasoning as the `npm ci` above, applied to the
      # step that actually failed last time: `vercel build` is the step most
      # likely to die for reasons unrelated to the commit (the OOM killer taking
      # `next build`, a Production env var the Infisical sync never delivered, a
      # registry blip), and when it ran last it failed AFTER the migration had
      # applied and Render had shipped. Run 33275321347 is what that produced:
      # a migrated database, a new API, six-month-old frontends, no tag.
      #
      # Up here the same failure costs nothing. `vercel pull --environment=production`
      # fetches the Production environment variables so each bundle is compiled
      # against them (NEXT_PUBLIC_* are inlined at build time — see the header of
      # deploy-vercel.mjs for why a promoted preview is not an option), and each
      # project's `.vercel` directory is stashed under $RUNNER_TEMP so the second
      # build cannot overwrite the first and the upload step can find both.
      #
      # Still gated on the full scope: a migrations-only run builds nothing.
      #
      # ── And NOT gated on `dry_run_only`, which is the point ──────────────
      # This step, the `npm ci` and the CLI install above it are the only three
      # the dry run used to skip while still being able to run them safely, and
      # skipping them is what made "dry run: green" mean less than it looked.
      # All THREE `full` attempts on 2026-09-14 died on this step, each after a
      # reviewer had already clicked Approve. Two died inside `vercel build`
      # itself, on a variable the Vercel Production scope did not hold —
      # 34894763676 on `NEXT_PUBLIC_API_URL` and 34896647837 on
      # `NEXT_PUBLIC_SUPABASE_ANON_KEY`. The third, 34892839657, died a moment
      # earlier and for an unrelated reason: `requireEnv("DEPLOY_SHA")` threw
      # inside `deploy-vercel.mjs` before it invoked the CLI at all (#2265
      # fixed that).
      #
      # Corrected 2026-09-15: this comment, and ci-cd.md, both read the second
      # failure as `NEXT_PUBLIC_SUPABASE_URL` for a day. It was not. The two
      # runs died at different STAGES, and the stage is what identifies the
      # variable:
      #
      #   * 34894763676 died at CONFIG LOAD — `⨯ Failed to load next.config.js`,
      #     with a frame at `assertProductionWebPublicEnv` called from
      #     `next.config.js`. Only that guard throws there, and the frame is
      #     reachable only PAST the function's first statement, the
      #     `vercelEnv !== "production"` early return — so `VERCEL_ENV` IS
      #     `production` inside `vercel build --prod` on this runner, despite
      #     the CLI's own "System environment variables will not be available"
      #     warning and despite nothing in this repo setting it. (That run's
      #     stack reads `:88:3`; line numbers as of dcc5cd7, and the file has
      #     grown since — cite the symbol, not the number.)
      #   * 34896647837 and 34905005744 logged `✓ Running next.config.js took
      #     …ms` and died ~30s later PRERENDERING `/`. The guard passing is
      #     positive evidence both URLs were present; `server.ts:13` tests
      #     `!url || !anonKey` but names both in the message, so the log could
      #     not say which. Run 34905005744's own step env settles it: it lists
      #     `NEXT_PUBLIC_API_URL`, `NEXT_PUBLIC_SUPABASE_URL` and the unprefixed
      #     `SUPABASE_ANON_KEY`, and no `NEXT_PUBLIC_SUPABASE_ANON_KEY`.
      #
      # So it was never "a different variable each time" in the sense that
      # motivated leaving the preflight thin — it was one variable the guard
      # checked and one it structurally could not see. The guard now checks the
      # anon key too (apps/web/lib/assert-production-public-env.js), which turns
      # that 30s-then-opaque failure into a config-load error naming the
      # variable and the Infisical remedy.
      #
      # Rehearsing the real build still earns its place, for the reason below —
      # it is the only check that knows the WHOLE list, and it caught this
      # before a byte of production changed. The preflight and the rehearsal are
      # not alternatives: the guard makes the common failure legible in seconds,
      # the rehearsal catches the ones nobody enumerated.
      #
      # The rehearsal can cover this because the build genuinely changes nothing
      # that matters: `buildVercelProject` runs `vercel pull` (a read) and
      # `vercel build` (local), then moves `.vercel` into the stash. It creates
      # no deployment — `vercel deploy --prebuilt` lives in the upload step
      # alone — so a dry run that builds still uploads nothing, aliases nothing
      # and leaves the Vercel dashboard without a new row.
      #
      # Note what it costs and what it does not: it lengthens a dry run by an
      # `npm ci` and two `next build`s, and it does NOT prove the upload works.
      # What it does prove is that this commit compiles against the Production
      # environment variables actually in Vercel right now — the half of the
      # job that has failed, and the half no other gate looks at.
      #
      # `!inputs.dry_run_only` is absent rather than rewritten: on a real ship
      # and on a migrations-only run the condition evaluates exactly as it did
      # before, so this changes the dry run only and leaves the shipping path
      # byte-identical.
      - name: Build the Vercel production bundles (web + landing)
        if: ${{ inputs.scope != 'migrations-only' }}
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_WEB_PROJECT_ID: ${{ env.VERCEL_WEB_PROJECT_ID }}
          VERCEL_LANDING_PROJECT_ID: ${{ env.VERCEL_LANDING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ env.VERCEL_TEAM_ID }}
          DEPLOY_TARGET: production
          DEPLOY_PHASE: build
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          VERCEL_BUILD_STASH_DIR: ${{ runner.temp }}/vercel-builds
          DRY_RUN: ${{ inputs.dry_run_only }}
        run: |
          set -euo pipefail

          # The one way this build is NOT inert, and it only bites later.
          #
          # Both `next.config.js` files pass `authToken: process.env.SENTRY_AUTH_TOKEN`
          # to `withSentryConfig` with `release: sentryGitSha`, and `vercelCliEnv`
          # spreads `process.env` into the build subprocess — while the Infisical
          # `prod` inject above puts the whole prod secret set into this job's
          # environment. So a build with that token present CREATES a Sentry release
          # and uploads source maps for the commit it built.
          #
          # On a real ship that is exactly right. On a dry run it would mint a
          # release for a commit that is not being deployed, and Sentry would then
          # attribute production errors to a version that never shipped.
          #
          # ── READ THIS BEFORE TRUSTING THE UNSET ──────────────────────────
          # It closes ONE of the two ways the token reaches `next build`, and
          # not the one that will matter most.
          #
          #   * CLOSED: the copy the Infisical step exported into this job's
          #     environment. That is what `unset` removes.
          #   * OPEN: the copy `vercel pull --environment=production` writes into
          #     the pulled env file moments later, which `vercel build --prod`
          #     compiles against. The Infisical syncs are configured at path `/`
          #     with no per-key filter (SECRETS_MANAGEMENT.md § the sync table),
          #     so the Vercel Production scope is INTENDED to hold the whole prod
          #     store — and ENV_REFERENCE.md lists SENTRY_AUTH_TOKEN as a
          #     frapp-web/frapp-landing build-time variable, so it is in scope for
          #     that sync.
          #
          #     Stated carefully, because the obvious phrasing gets it backwards:
          #     this is NOT "the channel that delivered NEXT_PUBLIC_API_URL to run
          #     34894763676". That run died because the variable was ABSENT — the
          #     same channel demonstrably failed to deliver it, and ci-cd.md
          #     records the Production scope as empty of at least two keys again.
          #     So whether SENTRY_AUTH_TOKEN would actually arrive is unknown.
          #     That uncertainty is the argument FOR leaving this open and tracked
          #     rather than against it: a guard whose correctness depends on a
          #     sync that is currently broken is not a guard.
          #
          # So whenever SENTRY_AUTH_TOKEN is in Infisical `prod` (which environments
          # carry it: docs/internal/environment/ENV_REFERENCE.md § apps/api), a
          # dry run WILL create a
          # Sentry release unless the pulled file is stripped too. Closing that
          # means editing the file `vercel pull` writes, between the pull and the
          # build, inside `buildVercelProject` — shared with staging, and its
          # exact filename varies by CLI version. A strip that silently matched
          # nothing would be a guard that cannot fail, which is the specific
          # defect this whole change exists to remove, so it is NOT being guessed
          # at here. Tracked instead; see the issue linked from the PR.
          #
          # The unset stays because it is free and correct for the channel it
          # does cover. It is not, today, a guarantee.
          #
          # Unset rather than left empty: `withSentryConfig` treats an empty string
          # as no token, but `unset` is the state the plugin documents and cannot be
          # read as "configured, blank".
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "Dry run: clearing SENTRY_AUTH_TOKEN so this build mints no Sentry release."
            unset SENTRY_AUTH_TOKEN
          fi

          node scripts/ci/deploy-vercel.mjs

      # The summary states what the rehearsal DID and, as carefully, what it
      # still did not. A dry run that overstates its own coverage is how the
      # frontend half went unrehearsed while every run said "green": the point
      # of widening it is lost if the report goes back to being flattering.
      - name: Stop here (dry run only)
        if: ${{ inputs.dry_run_only }}
        env:
          SCOPE: ${{ inputs.scope }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Dry run only — nothing was applied and nothing was deployed"
            echo ""
            echo "Commit: \`$SHA\` · scope: \`$SCOPE\`"
            echo ""
            echo "The commit passed validation, the migration replay ran against production's"
            echo "applied state, and the pending set is listed in the **Run migrations (dry-run)**"
            echo "step's log. Named, not \"the previous step\": on a \`full\` run the build steps sit"
            echo "between that step and this summary."
            if [ "$SCOPE" != "migrations-only" ]; then
              echo ""
              echo "Both Vercel production bundles were BUILT — \`vercel pull --environment=production\`"
              echo "then \`vercel build --prod\` — so this commit is known to compile against the"
              echo "Production environment variables currently in Vercel. Nothing was uploaded:"
              echo "no deployment was created and production still serves what it served before."
              echo ""
              echo "Still unrehearsed, and reachable only on a real run: the migration apply, the"
              echo "Render deploy, the health check, and the Vercel upload."
              echo ""
              echo "One difference inside the build itself: a real run compiles with"
              echo "\`SENTRY_AUTH_TOKEN\` present and so uploads source maps and creates a Sentry"
              echo "release. This run cleared the copy in the job environment, which does NOT"
              echo "cover the copy \`vercel pull\` writes into the pulled env file — so whenever that"
              echo "token is in Infisical \`prod\`, a dry run may mint a Sentry"
              echo "release. Either way, a green build here does not prove the real build's"
              echo "Sentry upload will succeed."
            else
              echo ""
              echo "Scope is \`migrations-only\`, so no frontend bundle was built. The Vercel build"
              echo "is rehearsed only on a \`full\` dry run."
            fi
            echo ""
            echo "Re-run with **Stop after the dry run** unchecked to deploy it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run migrations (apply)
        id: apply
        if: ${{ !inputs.dry_run_only }}
        run: node scripts/run-migration.mjs --env production

      # `supabase link` has rewritten config.toml in some CLI lines. If it did,
      # the tree no longer matches the commit we validated.
      - name: Assert supabase config was not rewritten by link
        if: ${{ !inputs.dry_run_only }}
        run: git diff --quiet HEAD -- supabase/config.toml

      # Deploy-by-commit through the Render API, not the deploy hook: a hook
      # builds whatever is at the tip of the tracked branch, and that branch is
      # now `main`, which moves on every merge.
      - name: Deploy the commit to Render
        id: render
        if: ${{ !inputs.dry_run_only && inputs.scope != 'migrations-only' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ env.RENDER_PROD_SERVICE_ID }}
          SERVICE_LABEL: frapp-api-prod
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/deploy-render-production.mjs | tee "${RUNNER_TEMP:-/tmp}/render.log"
          ID="$(grep -oP '^render_deploy_id=\K.*' "${RUNNER_TEMP:-/tmp}/render.log" || true)"
          echo "deploy_id=$ID" >> "$GITHUB_OUTPUT"

      # Render's `live` means the new instance passed Render's health probe:
      # since 2026-09-06 that probe is `GET /health` (applied to the live service
      # to match render.yaml — before that the path was empty and the probe was
      # a bare TCP check on the port; docs/internal/ops/deployment/render.md § 5.4 cites Render's docs).
      # `/health` always 2xxs by design, so this loop is still the only thing
      # asserting the app is actually READY (DB and Storage reachable). Unlike
      # deploy-api.yml, a missing URL FAILS rather than warning and exiting 0: a
      # health check that silently does not run is indistinguishable from one
      # that passed.
      # NOT scope-gated, unlike the Render and Vercel steps above and below.
      #
      # A migrations-only run changes the schema under an API that is already
      # running and is not being redeployed — which makes "does production still
      # answer?" more urgent here, not less. A lock that wedges the pool, an
      # object the running build reads on boot, an RLS change the service role
      # now fails: all of them leave the apply reporting success and production
      # down, and this loop is the only step in the job that would notice.
      # Skipping it would have this workflow report success having verified
      # nothing about production, on the path its own header calls the one you
      # reach for when something has already gone wrong.
      - name: Health smoke check
        if: ${{ !inputs.dry_run_only }}
        run: |
          if [ -z "${API_HEALTHCHECK_URL:-}" ]; then
            echo "::error::API_HEALTHCHECK_URL is not set in the Infisical 'prod' environment. Refusing to call a deploy healthy without checking it."
            exit 1
          fi
          # API_HEALTHCHECK_URL points at /health, which is Render's own
          # healthCheckPath (render.yaml) and must stay a plain liveness probe
          # that always 2xxs. /health/ready is the strict readiness sibling
          # that 503s on a degraded dependency (see #302) — hit that here so
          # this gate actually fails on a DB/Storage outage instead of reading
          # a 200 with a discarded "degraded" body.
          READY_URL="${API_HEALTHCHECK_URL%/}/ready"
          echo "Waiting for the production API to become healthy..."
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --connect-timeout 2 --max-time 5 "$READY_URL" >/dev/null 2>&1; then
              echo "✅ Production API is healthy."
              exit 0
            fi
            echo "Attempt $i/6 — retrying in 20s..."
            sleep 20
          done
          echo "::error::Production health check failed after 6 attempts (2 min)."
          exit 1

      # Upload the production bundles built BEFORE the apply (see "Build the
      # Vercel production bundles" above). This is a fresh production build of
      # this commit, not a promotion of its staging build: NEXT_PUBLIC_* are
      # inlined at build time, so promoting a preview would put the production
      # dashboard on the staging API and staging Supabase keys. See the header of
      # deploy-vercel.mjs.
      #
      # Since ADR-21 the build happens on this runner rather than on Vercel from
      # a git source — the Git integration that made `gitSource` mean anything is
      # gone (#1578). The script restores each project's stashed `.vercel`,
      # uploads it with `--prebuilt --prod`, and asserts the resulting
      # deployment's `target` is `production` and its `githubCommitSha` is this
      # commit before calling it a release. The upload is the only Vercel work
      # left after the apply, and a missing stash is a hard failure rather than
      # a fall-through to whatever `.vercel` happens to hold.
      - name: Deploy the commit to Vercel production (web + landing)
        if: ${{ !inputs.dry_run_only && inputs.scope != 'migrations-only' }}
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_WEB_PROJECT_ID: ${{ env.VERCEL_WEB_PROJECT_ID }}
          VERCEL_LANDING_PROJECT_ID: ${{ env.VERCEL_LANDING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ env.VERCEL_TEAM_ID }}
          DEPLOY_TARGET: production
          DEPLOY_PHASE: upload
          VERCEL_BUILD_STASH_DIR: ${{ runner.temp }}/vercel-builds
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: node scripts/ci/deploy-vercel.mjs

  # Tagging is a separate job only because `workflow_call` cannot be a step. It
  # carries no `environment:`, so it costs no second approval click.
  #
  # The tag is created AFTER Render and Vercel report healthy, on the exact SHA
  # that was deployed — so `vX.Y.Z` now means "this is live", where it used to
  # mean "this was merged and we hoped it would ship".
  release:
    name: Mint v* tag (does not roll back a live ship)
    needs: deploy
    # The scope clause is not decoration. A tag means "this is what is live",
    # and a migrations-only run changes the database without changing a single
    # deployed byte — tagging it would record a release that never shipped,
    # which is the precise failure `vX.Y.Z` was redefined in #1340 to stop.
    #
    # Written `!= 'migrations-only'`, never `== 'full'`. Every scope condition in
    # this file has that polarity on purpose: an unexpected or empty `scope`
    # then behaves like a normal release, where `== 'full'` would silently skip
    # the deploy and the tag and still report success — a production run that
    # ships nothing and says it worked. That is the exact failure class this
    # workflow was rebuilt to make impossible, so it must not be reintroduced by
    # the shape of a conditional.
    if: ${{ needs.deploy.result == 'success' && !inputs.dry_run_only && inputs.scope != 'migrations-only' }}
    uses: ./.github/workflows/release.yml
    permissions:
      # A called workflow's job permissions are intersected with what the caller
      # grants, so both sides need `pull-requests: read` and `issues: read` —
      # see the note in release.yml. Granting them only there would still leave
      # the token unable to read `release:*` labels or classify a /pulls 404
      # as a bare issue (#1839).
      contents: write
      pull-requests: read
      issues: read
    secrets:
      # Repository secret, not environment: production — this job is unscoped.
      # Empty falls back to GITHUB_TOKEN inside release.yml. A user PAT is
      # what actually creates refs/tags when the live SHA's workflow tree
      # differs from main (run 34254679932).
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
    with:
      sha: ${{ needs.deploy.outputs.sha }}
      bump: ${{ inputs.bump }}

  # Terminal reporting. A `workflow_dispatch` failure reds one row in the
  # Actions list and emails the actor, which is thin for the only path to
  # production — and it cannot express "deployed fine, then failed to tag".
  report:
    name: Summarize — red if the tag failed even when live
    needs: [deploy, release]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise what actually happened
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RENDER_DEPLOY_ID: ${{ needs.deploy.outputs.render-deploy-id }}
          REPLAY_OUTCOME: ${{ needs.deploy.outputs.replay-outcome }}
          APPLIED: ${{ needs.deploy.outputs.applied }}
          DRY_RUN: ${{ inputs.dry_run_only }}
          SCOPE: ${{ inputs.scope }}
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          {
            # The heading, not just a row: this summary gets linked and
            # screenshotted as evidence that a SHA shipped, and a dry run's table
            # otherwise reads `Migrate + deploy: success` with `Render deploy id:
            # none` as the only tell. Same ambiguity `run-name` was changed to
            # remove, one level down — and a dry run now looks even more like a
            # ship, because it builds.
            if [ "$DRY_RUN" = "true" ]; then
              echo "### DRY RUN — production was NOT deployed — \`$SHA\`"
              echo ""
              echo "> Nothing was applied and nothing was deployed. \`Migrate + deploy: success\`"
              echo "> below means the REHEARSAL succeeded, not that this commit is live."
            else
              echo "### Production deploy — \`$SHA\`"
            fi
            echo ""
            echo "| Phase | Result |"
            echo "| --- | --- |"
            echo "| Dry run | \`$DRY_RUN\` |"
            echo "| Scope | \`$SCOPE\` |"
            echo "| Migrate + deploy | \`$DEPLOY_RESULT\` |"
            echo "| Migrations applied | \`${APPLIED:-not reached}\` |"
            echo "| Migration rehearsal | \`${REPLAY_OUTCOME:-not reached}\` |"
            echo "| Render deploy id | \`${RENDER_DEPLOY_ID:-none}\` |"
            echo "| Release tag | \`${RELEASE_RESULT:-skipped}\` |"
            echo ""
            if [ "$REPLAY_OUTCOME" = "nothing-pending" ]; then
              echo "> The migration rehearsal found nothing pending, so it verified nothing."
              echo "> That is the ordinary case and is not evidence that an apply would work."
              echo ""
            fi
            if [ "$SCOPE" = "migrations-only" ] && [ "$DRY_RUN" != "true" ]; then
              echo "> **Migrations only.** The database moved; Render, Vercel and the version tag"
              echo "> did not. Production is now running the PREVIOUS code against the NEW schema,"
              echo "> so the migrations had better be forward-compatible with it. Finish with a"
              echo "> \`full\` run against the same SHA when the code is meant to follow."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error::Production deploy did not succeed ($DEPLOY_RESULT). Read the failing step above; if migrations were applied, docs/internal/ops/DB_ROLLBACK_PLAYBOOK.md owns recovery."
            exit 1
          fi

          # The quiet failure this job exists for: production is updated and no
          # tag exists, so nothing records what is live.
          #
          # Scoped to `full`. A migrations-only run skips `release` on purpose
          # (see that job's `if:`), and without this clause every such run would
          # end by erroring that the tag it was never going to create is
          # missing — a red run for doing exactly what was asked.
          if [ "$DRY_RUN" != "true" ] && [ "$SCOPE" != "migrations-only" ] && [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::Deploy succeeded but the release tag did not ($RELEASE_RESULT). Production IS updated. Re-run the 'Release' workflow manually with sha=$SHA to record it."
            exit 1
          fi
