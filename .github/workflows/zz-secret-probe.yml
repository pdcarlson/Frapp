name: zz secret probe (never merge)

# Throwaway probe for #2584, evidence for #2518's first acceptance criterion: a
# workflow a branch defines cannot read a secret GitHub stores for this repo.
# Every step prints only secret names with `present` or `absent`, plus one
# true/false for "any secret beyond github_token". It never prints a value.
#
# What it covers: repository-level secrets (the no-environment job) and the
# four credential environments, each in the plain form and the
# `deployment: false` form the real consumers use, on both `pull_request` and
# a branch `push`.
#
# What it does not cover:
#   - A tag ref such as refs/tags/main. Each environment's rule is a `branch`
#     policy for `main` (read back on #2583), and pushing a tag named `main`
#     to this repo would make `main` ambiguous for every clone.
#   - Infisical-side auth. The Infisical step stops at the action's local
#     preflight, and nothing here requests an OIDC token, so this says nothing
#     about which auth methods the Infisical identity accepts.
#
# How to read the result (every job is red either way, so read the steps):
#   - no-environment, clean: the presence step passes with everything absent
#     and `false`, and the Infisical step fails its preflight with "Missing or
#     empty: INFISICAL_MACHINE_IDENTITY_ID INFISICAL_CLIENT_SECRET".
#   - Environment jobs, clean: refused before any step runs, because each
#     environment admits `main` only (#2583).
#   - A breach in any job: the presence step prints `present` or `true` and
#     fails. The no-environment job stops there, before the Infisical step.
#   - A production job WAITING for approval also means the branch rule let
#     this branch through. Cancel it, never approve it: approving hands the
#     production secrets to this branch's code.
#
# This file must never reach main (workflow-secrets-scope.test.mjs fails on it
# by design). Once the runs are recorded on #2518, the PR is closed unmerged
# and the branch deleted.

on:
  pull_request:
  push:
    branches: [claude/laughing-brown-e0ya95]

permissions:
  contents: read

env:
  SECRET_NAMES: >-
    INFISICAL_MACHINE_IDENTITY_ID INFISICAL_CLIENT_SECRET RENDER_API_KEY
    VERCEL_API_KEY RELEASE_GITHUB_TOKEN PR_BASE_SYNC_APP_CLIENT_ID
    PR_BASE_SYNC_APP_PRIVATE_KEY STAGING_SMOKE_USER_EMAIL
    STAGING_SMOKE_USER_PASSWORD

jobs:
  no-environment:
    name: "no environment: repository secrets, then Infisical prod"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report secret presence (never values)
        env:
          # true when the secrets context holds more than github_token: the
          # expression sees the JSON, but only the boolean reaches the job.
          # With a single key the JSON has no comma, and a GitHub token
          # contains none.
          ANY_OTHER_SECRET: ${{ contains(toJSON(secrets), ',') }}
          INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PR_BASE_SYNC_APP_CLIENT_ID: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          PR_BASE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
          STAGING_SMOKE_USER_EMAIL: ${{ secrets.STAGING_SMOKE_USER_EMAIL }}
          STAGING_SMOKE_USER_PASSWORD: ${{ secrets.STAGING_SMOKE_USER_PASSWORD }}
        run: |
          set -euo pipefail
          found=0
          echo "Any secret beyond github_token: $ANY_OTHER_SECRET"
          [ "$ANY_OTHER_SECRET" = "false" ] || found=1
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ]; then echo "$name present"; found=1; else echo "$name absent"; fi
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::A branch-defined job received a stored secret."
            exit 1
          fi

      # Reached only when every name is absent, so both inputs are empty and
      # the action's local preflight fails before anything contacts Infisical.
      - name: Inject Infisical prod (expected to fail its preflight)
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

  automation-plain:
    name: "environment: automation"
