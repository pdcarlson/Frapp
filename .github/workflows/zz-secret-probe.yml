name: zz secret probe (never merge)

# Throwaway probe for #2584: proves #2518's first acceptance criterion, that a
# workflow a branch defines cannot reach a stored secret by any route. Every
# step prints only secret names with `present` or `absent`, never a value.
#
# Expected outcomes:
#   - no-environment: every named secret is absent, and the Infisical
#     preflight fails with
#     "Missing or empty: INFISICAL_MACHINE_IDENTITY_ID INFISICAL_CLIENT_SECRET".
#   - every environment job, in both the plain and the `deployment: false`
#     form: refused before its first step, because each environment's
#     deployment-branch rule admits `main` only (#2583).
#
# This file must never reach main (workflow-secrets-scope.test.mjs fails on it
# by design). Once the runs are recorded on #2518, the PR is closed unmerged
# and the branch deleted.

on:
  pull_request:
  push:
    branches: [claude/laughing-brown-e0ya95]

permissions:
  contents: read

env:
  SECRET_NAMES: >-
    INFISICAL_MACHINE_IDENTITY_ID INFISICAL_CLIENT_SECRET RENDER_API_KEY
    VERCEL_API_KEY RELEASE_GITHUB_TOKEN PR_BASE_SYNC_APP_CLIENT_ID
    PR_BASE_SYNC_APP_PRIVATE_KEY

jobs:
  no-environment:
    name: "no environment: inject Infisical prod"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report secret presence (never values)
        env:
          INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PR_BASE_SYNC_APP_CLIENT_ID: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          PR_BASE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ]; then echo "$name present"; else echo "$name absent"; fi
          done

      - name: Inject Infisical prod
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Report what the injection exported (never values)
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_PASSWORD STRIPE_SECRET_KEY; do
            if [ -n "${!name:-}" ]; then echo "$name present"; else echo "$name absent"; fi
          done

  automation-plain:
    name: "environment: automation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automation
    steps:
      - name: Report secret presence (never values)
        env:
          INFISICAL_MACHINE_IDENTITY_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PR_BASE_SYNC_APP_CLIENT_ID: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          PR_BASE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          found=0
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ]; then echo "$name present"; found=1; else echo "$name absent"; fi
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::A branch-defined job was admitted to the environment and received its secrets."
            exit 1
          fi

  automation-no-deployment:
