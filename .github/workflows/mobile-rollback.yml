name: Roll back the app update

# Take a bad over-the-air update off members' phones without a laptop
# (docs/ops/deployment/mobile.md § 6.7, "Rolling back"). Dispatched by hand
# from `main`; nothing calls it.
#
# ── What it publishes ──────────────────────────────────────────────────────
# No new bundle. Either:
#   * `store_build`: a roll-back-to-embedded directive on the `production`
#     channel for one runtime (`expo.version`), so phones on that version go
#     back to the JavaScript inside their store build; or
#   * `update_group`: a republish of an earlier update group, copied from the
#     Expo dashboard (Updates, the `production` branch), so phones go back to
#     that update. The job first reads the group (`update:view --json`) and
#     refuses one that isn't on the `production` branch or wasn't built for
#     `runtime_version`, because `update:republish` puts a copy on the group's
#     own branch and runtime, whatever this form says.
# Phones pick either up like an update: a launch, or a return to the app,
# downloads it, and the next launch, or the next return after ten minutes
# away, runs it (`apps/mobile/lib/updates`). The next Deploy production
# publish replaces the rollback, so fix forward before shipping again, or ship
# with `mobile_build: none` (the input defaults to `auto`, so pick it).
#
# ── Why it skips the publish guard ─────────────────────────────────────────
# `scripts/eas-update.mjs` guards `eas update`, which bundles JavaScript.
# These two commands bundle nothing (a directive, or a copy of a group EAS
# already holds), so `scripts/eas.mjs` passes them straight to the pinned
# eas-cli. eas-cli still evaluates `app.config.js`, with its config plugins,
# through the installed `expo`, so the job installs the release it reads.
#
# ── Trust ──────────────────────────────────────────────────────────────────
# Dispatched from `main` only, in the `automation` environment (no reviewers,
# holds `EXPO_TOKEN`). Dispatching is the decision. The workspace is the
# release production serves (the newest `vX.Y.Z` tag), and the job refuses it
# unless its commit is an ancestor of `main`, so a hand-pushed tag on an
# unmerged commit never runs beside the token. It is installed with no install
# scripts before any step names the token, as `_mobile-update.yml` does, and
# only the steps that call eas-cli hold it.

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "The store version the bad update went to, for example 0.12.0 (apps/mobile/app.json expo.version at that release). Only phones on this version are affected."
        required: true
        type: string
      to:
        description: "'store_build' puts phones back on their store build's own JavaScript. 'update_group' republishes the earlier update named below."
        required: true
        default: store_build
        type: choice
        options: [store_build, update_group]
      group:
        description: "For 'update_group' only: the update group ID to go back to, from the Expo dashboard (Updates, production branch)."
        required: false
        default: ""
        type: string
      platform:
        description: "Which phones"
        required: true
        default: all
        type: choice
        options: [all, ios, android]

permissions:
  contents: read

concurrency:
  group: mobile-rollback
  cancel-in-progress: false

jobs:
  roll-back:
    name: Roll back the production app update
    runs-on: ubuntu-latest
    environment:
      name: automation
      deployment: false
    timeout-minutes: 20
    steps:
      # Before any checkout. Names only for the token: the check is `!= ''`.
      - name: Check the inputs, and that EXPO_TOKEN reached this job
        env:
          REF: ${{ github.ref }}
          RUNTIME: ${{ inputs.runtime_version }}
          TO: ${{ inputs.to }}
          GROUP: ${{ inputs.group }}
          PLATFORM: ${{ inputs.platform }}
          HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this from main; got $REF."
            exit 1
          fi
          if ! [[ "$RUNTIME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::runtime_version must look like 0.12.0 (the app version members have installed); got '$RUNTIME'."
            exit 1
          fi
          case "$PLATFORM" in
            ios|android|all) ;;
            *) echo "::error::platform must be ios, android or all; got '$PLATFORM'."; exit 1 ;;
          esac
          case "$TO" in
            store_build)
              if [ -n "$GROUP" ]; then
                echo "::error::'group' is only for to: update_group. Clear it, or pick update_group."
                exit 1
              fi
              ;;
            update_group)
              if ! [[ "$GROUP" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
                echo "::error::to: update_group needs the group's ID (a UUID from the Expo dashboard); got '$GROUP'."
                exit 1
              fi
              ;;
            *) echo "::error::to must be store_build or update_group; got '$TO'."; exit 1 ;;
          esac
          if [ "$HAS_EXPO_TOKEN" != "true" ]; then
            echo "::error::EXPO_TOKEN did not reach this job. It is a secret of the automation environment."
            exit 1
          fi

      # The commit production serves: the newest `vX.Y.Z` tag, read from the
      # public repository with no credentials. eas-cli evaluates
      # `app.config.js` there, as the publish that put the bad update out did.
      - name: Find the release production serves
        id: release
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TAG="$( { git ls-remote --tags --refs "$REPO_URL" 'v*' || true; } \
            | sed -E 's#.*refs/tags/##' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)"
          if [ -z "$TAG" ]; then
            echo "::error::No vX.Y.Z release tag found."
            exit 1
          fi
          echo "Production serves $TAG."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out that release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # Every real release is tagged by Deploy production after it validated
      # the commit as an ancestor of `main` with green CI. A tag pushed by hand
      # on anything else stops here, before any step holds a secret. The fetch
      # reads the public repository; no credentials are kept.
      - name: Confirm the release is on main
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse HEAD)) is not an ancestor of main. Refusing to run its code beside EXPO_TOKEN."
            exit 1
          fi

      # Hand-written, not ./.github/actions/node-setup: the workspace is the
      # release, not this workflow's commit, so a local action would load from
      # it. Matches node-setup's step (`node-setup-action.test.mjs`).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # eas-cli evaluates the app config through the installed `expo` (its
      # plugins included), so it needs the tree installed. No install script
      # runs, and nothing here holds a secret yet.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Installs `_mobile-build.yml`'s eas-cli pin into `.cache/eas-cli/`,
      # before EXPO_TOKEN is in any step's environment.
      - name: Install the pinned EAS CLI
        run: node scripts/eas.mjs --version

      # `update:republish --group` copies the group onto its own branch and
      # runtime, so a group from `preview`, or from another version, would
      # "succeed" and leave the bad update on these phones. eas-cli 24.8.0's
      # `update:view --json` prints one entry per platform, each with `branch`
      # and `runtimeVersion` (`getUpdateJsonInfosForUpdates`).
      - name: Check the update group is production's, for this version
        if: ${{ inputs.to == 'update_group' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUNTIME: ${{ inputs.runtime_version }}
          GROUP: ${{ inputs.group }}
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          npm run -s eas -- update:view "$GROUP" --json --non-interactive > "$RUNNER_TEMP/group.json"
          node -e '
            const fs = require("node:fs");
            const [file, runtime] = process.argv.slice(1);
            const text = fs.readFileSync(file, "utf8");
            const updates = JSON.parse(text.slice(text.indexOf("[")));
            if (!Array.isArray(updates) || updates.length === 0) {
              console.error("::error::eas-cli returned no updates for that group.");
              process.exit(1);
            }
            const wrong = updates.filter((u) => u.branch !== "production" || u.runtimeVersion !== runtime);
            for (const u of wrong) {
              console.error(`::error::The ${u.platform} update in that group is on branch "${u.branch}" for version ${u.runtimeVersion}; this rollback is for production, version ${runtime}.`);
            }
            if (wrong.length > 0) process.exit(1);
            console.log(`Group is on production for ${runtime}: ${updates.map((u) => u.platform).join(", ")}.`);
          ' "$RUNNER_TEMP/group.json" "$RUNTIME"

      - name: Roll back
        id: roll-back
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUNTIME: ${{ inputs.runtime_version }}
          TO: ${{ inputs.to }}
          GROUP: ${{ inputs.group }}
          PLATFORM: ${{ inputs.platform }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          MESSAGE="Rolled back by $ACTOR $RUN_URL"
          if [ "$TO" = "store_build" ]; then
            npm run eas -- update:roll-back-to-embedded --channel production \
              --runtime-version "$RUNTIME" --platform "$PLATFORM" \
              --message "$MESSAGE" --non-interactive
          else
            npm run eas -- update:republish --group "$GROUP" \
              --platform "$PLATFORM" --message "$MESSAGE" --non-interactive
          fi

      - name: Summarise the rollback
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.roll-back.outcome }}
          RUNTIME: ${{ inputs.runtime_version }}
          TO: ${{ inputs.to }}
          GROUP: ${{ inputs.group }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "### App update rollback, version \`$RUNTIME\`, \`$PLATFORM\`"
            echo ""
            case "$OUTCOME" in
              success)
                if [ "$TO" = "store_build" ]; then
                  echo "Phones on $RUNTIME go back to their store build's own JavaScript."
                else
                  echo "Update group \`$GROUP\` (production, version $RUNTIME) republished, so phones on $RUNTIME go back to it."
                fi
                echo "A launch, or a return to the app, downloads it; the next launch, or the next return after ten minutes away, runs it."
                echo ""
                echo "The next Deploy production publish replaces this rollback: fix forward first, or ship with \`mobile_build: none\` (it defaults to \`auto\`). Sentry's \`expo.updates.update_id\` tag shows phones moving off the bad update."
                ;;
              skipped)
                echo "Not rolled back: a step before it failed (the log says which). No phone was affected."
                ;;
              *)
                echo "Not rolled back (\`$OUTCOME\`): eas-cli refused, and the log above says why. No phone was affected."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
