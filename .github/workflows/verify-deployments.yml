name: Verify deployments

# STAGING observer. After a push to `main`, confirm that the Render API deploy
# for the pushed SHA reached a healthy terminal state. Failure surfaces as a red
# GitHub check.
#
# It no longer watches production. Production is not pushed to: since #1340 it
# is deployed by `deploy-production.yml`, which creates each deploy through the
# provider APIs and verifies the deployment ID it was handed, synchronously,
# where a failure can still stop the release. An observer reacting to a push
# cannot do that, and after the cutover it could not even identify the right
# deployment — one SHA now has both a `main` preview and a production build.
#
# ── Why there are no Vercel jobs here (2026-09-02, #1579) ───────────────────
# There were two, `verify-vercel-web` and `verify-vercel-landing`. ADR-21
# retired the Vercel Git integration, so no push produces a Vercel deployment
# for any SHA — and a job that polls for one is not detecting a problem, it is
# guaranteed to fail. They had been red on every push since 2026-09-01 (landing,
# run #428) and 2026-09-02 (web, run #437), which is noise that trains readers
# to ignore a red `main`.
#
# Removed rather than `if: false`-ed, so the workflow describes what it does.
# The SCRIPTS both jobs called are deliberately KEPT — nothing else references
# them today:
#   scripts/ci/verify-vercel-deploy.mjs
#   scripts/ci/ensure-vercel-staging-alias.mjs
# They are not broken; they have nothing to observe. #1578 (CI/CD stage 7)
# builds the CI-driven `vercel build` + `vercel deploy --prebuilt` path, which
# creates deployments again — at which point verification is wanted, and
# `ensure-vercel-staging-alias.mjs` in particular mitigates a REAL Vercel
# behaviour that returns with it (the staging hostname lagging a READY
# deployment). Deleting them would mean rewriting both from scratch for #1578.
# Re-add the jobs there, keyed on the deployment id that workflow created rather
# than on the pushed SHA.
#
# Semantics live in:
#   scripts/ci/verify-render-deploy.mjs
# Unit tests: scripts/ci/__tests__/ (run via `npm run test:ci-scripts`).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One observer per SHA. Do not cancel an in-flight poll — we want the
  # verifier to run to conclusion even if another push arrives.
  group: verify-deployments-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-render-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Render API deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d6lqsq75r7bs73c2fdc0
          SERVICE_LABEL: frapp-api-staging
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-render-deploy.mjs
