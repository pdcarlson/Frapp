name: Verify deployments

# STAGING observer. After a push to `main`, confirm that the Render API deploy
# and the Vercel web/landing deployments for the pushed SHA reached a healthy
# terminal state. Failure surfaces as a red GitHub check. A follow-up step
# re-points the staging custom domains to the new deployment when Vercel omits
# that alias (see ensure-vercel-staging-alias.mjs).
#
# It no longer watches production. Production is not pushed to: since #1340 it
# is deployed by `deploy-production.yml`, which creates each deploy through the
# provider APIs and verifies the deployment ID it was handed, synchronously,
# where a failure can still stop the release. An observer reacting to a push
# cannot do that, and after the cutover it could not even identify the right
# deployment — one SHA now has both a `main` preview and a production build.
#
# Semantics live in:
#   scripts/ci/verify-render-deploy.mjs
#   scripts/ci/verify-vercel-deploy.mjs
#   scripts/ci/ensure-vercel-staging-alias.mjs (main only — fixes staging DNS)
# Unit tests: scripts/ci/__tests__/ (run via `npm run test:ci-scripts`).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One observer per SHA. Do not cancel an in-flight poll — we want the
  # verifier to run to conclusion even if another push arrives.
  group: verify-deployments-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-render-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Render API deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d6lqsq75r7bs73c2fdc0
          SERVICE_LABEL: frapp-api-staging
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-render-deploy.mjs

  verify-vercel-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Vercel web deploy
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_PROJECT_ID: prj_xkn32taKrJCgYRZoN6pZRfGfPT9T
          SERVICE_LABEL: frapp-web
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-vercel-deploy.mjs

      # Skips gracefully when verify step was neutral (CANCELED / no deploy for SHA); see ensure-vercel-staging-alias.mjs.
      - name: Point staging domain at latest main deployment (web)
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_PROJECT_ID: prj_xkn32taKrJCgYRZoN6pZRfGfPT9T
          VERCEL_STAGING_ALIAS: app.staging.frapp.live
          SERVICE_LABEL: frapp-web
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/ensure-vercel-staging-alias.mjs

  verify-vercel-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Vercel landing deploy
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_PROJECT_ID: prj_aAkER9EZJcxR51vUY0mwNDnCf8vy
          SERVICE_LABEL: frapp-landing
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-vercel-deploy.mjs

      # Skips gracefully when verify step was neutral (CANCELED / no deploy for SHA); see ensure-vercel-staging-alias.mjs.
      - name: Point staging domain at latest main deployment (landing)
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_PROJECT_ID: prj_aAkER9EZJcxR51vUY0mwNDnCf8vy
          VERCEL_STAGING_ALIAS: staging.frapp.live
          SERVICE_LABEL: frapp-landing
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/ensure-vercel-staging-alias.mjs
