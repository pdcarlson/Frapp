name: Migrate production

# Apply production migrations WITHOUT shipping code. A human opens Actions,
# picks this workflow, types a confirmation phrase, and runs it. Nothing about
# it fires on its own.
#
# ── How this differs from `deploy-production.yml` ───────────────────────────
# `deploy-production.yml` is the ordinary path: it names a commit, rehearses the
# migration, applies it, and then deploys that same commit to Render and Vercel.
# Migrations and code move together, which is what you want almost every time.
#
# This workflow is the escape hatch for the cases where they must not:
#
#   * re-running an apply that failed partway, without redeploying;
#   * applying a backlog of migrations ahead of the code that needs them;
#   * applying on a schedule that no deploy matches.
#
# Before it existed, all of those meant a human running `supabase db push`
# against production from a laptop, which is untracked, unlogged, and
# unserialised against CI.
#
# It shares the `db-migrate-production` concurrency group with
# `deploy-production.yml`. That is what stops the two paths interleaving two
# `db push` runs against one database — if you rename the group in one file,
# rename it in the other or the lock silently stops existing.
#
# ── What used to be here ────────────────────────────────────────────────────
# This header used to describe a third path: `deploy-api.yml`'s
# `migrate-production` job, which auto-applied on merge to the `production`
# branch. That branch and that job were both retired in #1340 — the `ref` input
# below therefore defaults to `main`, not `production`.
#
# ── On the `production` environment ─────────────────────────────────────────
# `environment: production` does two things: it scopes the Infisical secrets
# this job reads, and it gates the run behind the environment's Required
# reviewers. The gating was established by measurement rather than by reading
# the settings (that API path is not reachable from an agent sandbox): both runs
# of this workflow sat between being created and being started, while jobs with
# no environment, and jobs scoped to `staging`, start in about two seconds.
#
#   run 32789194139  job created 23:24:32 → started 23:39:51   15m19s
#   run 32790550501  job created 23:42:41 → started 23:45:54    3m13s
#
# Two different durations rules out a `wait_timer`. See
# `docs/internal/ci-cd/AGENT_INFRA.md` § GitHub environments and bootstrap
# secrets for the canonical statement and the limits of that evidence.
#
# For THIS workflow the approval is largely redundant with the typed
# confirmation above — a person is already here, on purpose. It carries its
# weight on `deploy-production.yml`, where it is the only human gate left.
#
# ── A migration applied here is NOT rehearsed ───────────────────────────────
# `deploy-production.yml` runs `check-migration-replay.mjs` against production's
# live applied state before it applies anything. This workflow does not: it is
# the path you reach for when something has already gone wrong, and rebuilding
# production's state on a disposable stack is exactly what you cannot rely on in
# that situation. The dry run below is the substitute, and it is weaker — it
# lists what is pending, it does not prove it applies. Prefer
# `deploy-production.yml` whenever it is available to you.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: APPLY TO PRODUCTION'
        required: true
        type: string
      ref:
        description: "Git ref whose migrations to apply"
        required: false
        default: "main"
        type: string
      dry_run_only:
        description: "Stop after the dry run (show what would be applied, change nothing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # SHARED with deploy-production.yml's `deploy` job. See the note above.
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # First step on purpose: a mistyped confirmation must cost nothing. No
      # checkout, no secrets injected, no CLI installed before this passes.
      - name: Verify confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY TO PRODUCTION" ]; then
            echo "::error::Confirmation phrase did not match. Type exactly: APPLY TO PRODUCTION"
            echo "Received: '$CONFIRM'"
            exit 1
          fi
          echo "Confirmed. Applying migrations from ref '${{ inputs.ref }}' to PRODUCTION."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Infisical credentials are configured
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          MISSING=""
          [ -n "$CLIENT_ID" ] || MISSING="$MISSING INFISICAL_MACHINE_IDENTITY_ID"
          [ -n "$CLIENT_SECRET" ] || MISSING="$MISSING INFISICAL_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Infisical credentials are not configured for the production environment. Missing or empty:$MISSING. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          case "$CLIENT_ID$CLIENT_SECRET" in
            *[[:space:]]*) echo "::warning::An Infisical credential secret contains whitespace. A trailing newline picked up when pasting the value into GitHub is a common cause of 401 Invalid credentials — re-paste both secrets before concluding the credential was revoked." ;;
          esac

      # NOTE: the Infisical slug for production is `prod`, not `production`.
      - name: Inject production secrets from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "frapp-live-ej-ls"
          env-slug: "prod"
          secret-path: "/"
          include-imports: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.77.0

      # Always runs, including when dry_run_only is false: the log then records
      # what WAS pending immediately before the apply, so a failure in the next
      # step is readable without guessing at the prior state.
      - name: Run migrations (dry-run)
        run: node scripts/run-migration.mjs --env production --dry-run

      - name: Stop (dry run only)
        if: ${{ inputs.dry_run_only }}
        run: |
          echo "### Dry run only — nothing was applied" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pending migrations for ref \`${{ inputs.ref }}\` are listed in the previous step's log." >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run with **Stop after the dry run** unchecked to apply them." >> "$GITHUB_STEP_SUMMARY"

      - name: Run migrations (apply)
        if: ${{ !inputs.dry_run_only }}
        run: node scripts/run-migration.mjs --env production

      - name: Report outcome
        if: ${{ always() && !inputs.dry_run_only }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Production migrations applied" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ref: \`${{ inputs.ref }}\` · run by @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Production migration run FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Ref: \`${{ inputs.ref }}\` · run by @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The database may be partially migrated. Read the failing step above, then" >> "$GITHUB_STEP_SUMMARY"
            echo "\`docs/internal/ops/DB_ROLLBACK_PLAYBOOK.md\` before re-running." >> "$GITHUB_STEP_SUMMARY"
          fi
