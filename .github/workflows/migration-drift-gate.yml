name: Migration drift gate

# REQUIRED check: does staging actually hold every migration on `main`?
#
# The incident: two migrations merged to main and were never applied to
# staging. Every workflow stayed green, because nothing in CI has ever asserted
# anything about a deployed database — CI proves the code compiles and the tests
# pass, and a database dozens of migrations behind is invisible to all of it.
#
# `check-migration-drift.yml` already detects this, but on a daily schedule and
# by filing an issue. That is the right shape for a slow watchdog and the wrong
# shape for a thing that must be impossible to miss: an issue has to be opened
# to be read. This gate turns the same fact into a red X on every open PR, which
# is the one signal a team cannot route around.
#
# ── Why this is not a job in ci.yml ─────────────────────────────────────────
# ci.yml consumes NO secrets — not one job in it touches `secrets.*`. That is a
# property worth keeping: it means a CI run on a pull_request has nothing to
# leak. This check needs Infisical credentials to learn the staging project ref,
# so it lives in its own workflow rather than making ci.yml the first secret
# consumer in the repo.
#
# ── Why there is no `paths:` filter ─────────────────────────────────────────
# Deliberate, and the opposite of an oversight. A required check on a workflow
# skipped by a workflow-level `paths:` filter never reports at all and sits
# "Pending" forever, blocking every PR that does not touch those paths. (A
# JOB-level `if:` is the safe form — a skipped job reports Success. The
# fork guard below uses that form for exactly this reason.)
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
#
# It is also correct on the merits: drift is a property of main and staging, not
# of the PR's diff. A PR that touches no SQL is exactly as blocked by a
# drifting staging as one that does — the schema its tests ran against is wrong
# either way.
#
# Semantics live in scripts/ci/check-migration-drift-gate.mjs.
# Unit tests: scripts/ci/__tests__/ (run via `npm run test:ci-scripts`).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # On demand, so `migration-replay`'s expensive path can be exercised without
  # waiting for a migration-bearing PR to come along. That path — Docker, a real
  # Supabase stack, a two-phase apply — does no work on a change that touches no
  # migrations, which is correct behaviour and also means the ordinary PR run
  # proves nothing about it. Making a gate required on the strength of a run
  # that skipped its own body is how a check ends up green and inert.
  workflow_dispatch:
    inputs:
      replay_fixture:
        description: >-
          Recorded applied-state file to replay against instead of live
          production. Leave blank to use production. Use a fixture to exercise
          the two-phase apply when production has nothing pending.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Per-ref, and cancellable. Neither job here can leave anything half-done
  # outside its own runner: `migration-drift` is a read-only assertion, and
  # `migration-replay` writes only to the disposable Supabase stack it started
  # on that runner, which is thrown away with it. Nothing in this workflow ever
  # sends SQL to a deployed database, so a superseded run has no cleanup to do
  # and no reason to finish.
  group: migration-drift-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    # Fork PRs receive no secrets, so the Infisical step below cannot succeed.
    # A job-level `if:` reports Success when skipped, which satisfies the
    # required check rather than deadlocking the PR. This repo takes no fork PRs
    # today; the guard is here so that fact stopping being true does not
    # silently wedge every PR.
    #
    # `workflow_dispatch` is listed explicitly: it carries no pull_request
    # context, so the comparison below is `null == 'owner/repo'` — false — and
    # without this clause a manual run would skip the job and report Success
    # having done nothing. Only users with write access can dispatch, so there
    # is no fork-secret concern in that path.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the gate dates each migration by when it landed on
          # main, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Infisical credentials are configured
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          MISSING=""
          [ -n "$CLIENT_ID" ] || MISSING="$MISSING INFISICAL_MACHINE_IDENTITY_ID"
          [ -n "$CLIENT_SECRET" ] || MISSING="$MISSING INFISICAL_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Infisical credentials are not configured. Missing or empty:$MISSING. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi

      - name: Inject staging secrets from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "frapp-live-ej-ls"
          env-slug: "staging"
          secret-path: "/"
          include-imports: true

      - name: Check migration drift against staging
        env:
          # Both injected above. SUPABASE_PROJECT_REF is the staging ref because
          # the injection above used the `staging` env-slug.
          DRIFT_GATE_MAIN_REF: refs/remotes/origin/main
          DRIFT_GATE_GRACE_MINUTES: "30"
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set in the Infisical 'staging' environment. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          node scripts/ci/check-migration-drift-gate.mjs

  # ── Production migration replay ─────────────────────────────────────────
  # REQUIRED check: do the migrations this PR adds actually apply to the
  # database they are about to be applied to?
  #
  # Nothing else in this repo asks that. `pglite-migrations` (ci.yml) applies
  # every migration to an EMPTY database, which proves the corpus is
  # self-consistent from zero and cannot prove an INCREMENTAL apply works —
  # production is not an empty database, and `supabase db push` only ever runs
  # the tail. `migration-safety` and `migration-lock-safety` read the SQL
  # without executing it. So the apply against production's real state has
  # never been rehearsed anywhere before it happened for real.
  #
  # This job rebuilds production's currently-applied state on a disposable local
  # Supabase stack, then applies exactly the pending set through the same CLI
  # path `run-migration.mjs` uses against the real project. Read-only against
  # production: one GET to the Management API's migration-history endpoint, no
  # SQL, ever. Semantics live in scripts/ci/check-migration-replay.mjs; unit
  # tests in scripts/ci/__tests__/ (`npm run test:ci-scripts`).
  #
  # ── Why the migrations filter is a STEP and not a `paths:` ──────────────
  # Same trap the header of this file documents: a required check on a workflow
  # skipped by a workflow-level `paths:` filter never reports and sits Pending
  # forever. So the job always runs and decides for itself whether this change
  # touches `supabase/migrations/**`; a PR that does not touch them passes in
  # seconds without starting Docker.
  migration-replay:
    runs-on: ubuntu-latest
    # Fork PRs receive no secrets — same guard, same reason, and the same
    # `workflow_dispatch` clause as migration-drift above. A job-level `if:`
    # reports Success when skipped, which satisfies the required check instead
    # of deadlocking the PR.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch migrations?
        id: touched
        env:
          # Every ref reaches the shell through the environment rather than
          # through `${{ }}` interpolation into the script body. These are all
          # GitHub-supplied SHAs today, so this is consistency and habit rather
          # than a live injection hole — but the habit is the point.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The changed-file list goes to a FILE and grep reads the file. Never
          # `echo "$LIST" | grep -q`: `grep -q` exits at its first match, killing
          # `echo` with EPIPE, and `pipefail` turns that successful match into a
          # failed pipeline — the false-green that hid a skipped production
          # deploy in #1330 (fixed for deploy-api.yml in #1331).
          CHANGED="${RUNNER_TEMP:-/tmp}/replay-changed-paths.txt"

          # A manual dispatch has neither a base SHA nor a `before` SHA, and is
          # only ever run to exercise the replay — so it skips the diff and
          # forces the full path.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running the replay regardless of the diff."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$BASE_SHA...$HEAD_SHA"
          else
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          fi

          if git diff --name-only "$RANGE" > "$CHANGED" 2>/dev/null; then
            DIFF_OK=1
          else
            DIFF_OK=0
            : > "$CHANGED"
            echo "::warning::Could not diff $RANGE. Replaying anyway rather than skipping the gate."
          fi

          if [ "$DIFF_OK" -eq 0 ] || grep -qE '^supabase/migrations/' "$CHANGED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Migrations touched (or the diff was unreadable) — running the replay."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No files under supabase/migrations/ changed — nothing to replay."
          fi

      - name: Setup Node
        if: steps.touched.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Infisical credentials are configured
        if: steps.touched.outputs.run == 'true'
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          MISSING=""
          [ -n "$CLIENT_ID" ] || MISSING="$MISSING INFISICAL_MACHINE_IDENTITY_ID"
          [ -n "$CLIENT_SECRET" ] || MISSING="$MISSING INFISICAL_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Infisical credentials are not configured. Missing or empty:$MISSING. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi

      # The `prod` slug, not `staging`: this gate is about the database the
      # migrations are heading for. NOTE the slug for production is `prod`.
      - name: Inject production secrets from Infisical
        if: steps.touched.outputs.run == 'true'
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "frapp-live-ej-ls"
          env-slug: "prod"
          secret-path: "/"
          include-imports: true

      - name: Setup Supabase CLI
        if: steps.touched.outputs.run == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.77.0

      # Only what the migrations need a real server for. Studio, imgproxy, the
      # edge runtime, the log pipeline and the pooler contribute nothing to an
      # apply and cost image pulls on every run.
      - name: Start disposable Supabase stack
        if: steps.touched.outputs.run == 'true'
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,pooler,mailpit

      # A fixture run exercises the two-phase apply that a live run cannot when
      # production has nothing pending — which is its steady state, so on an
      # ordinary day the live path reports "nothing to replay" in about a second
      # and never touches phase 1 or phase 2. The fixture is the only way to
      # prove that body works in CI without waiting for a real migration PR.
      - name: Replay pending migrations against production's applied state
        if: steps.touched.outputs.run == 'true'
        env:
          # SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are both injected
          # above; the ref is production's because the slug was `prod`.
          REPLAY_SUPABASE_CLI: supabase
          REPLAY_FIXTURE: ${{ inputs.replay_fixture }}
        run: |
          set -euo pipefail

          if [ -n "${REPLAY_FIXTURE:-}" ]; then
            if [ ! -f "$REPLAY_FIXTURE" ]; then
              echo "::error::replay_fixture '$REPLAY_FIXTURE' does not exist in this checkout."
              exit 1
            fi
            echo "Replaying against recorded state '$REPLAY_FIXTURE' (production is NOT read)."
            node scripts/ci/check-migration-replay.mjs --applied-from "$REPLAY_FIXTURE"
            exit $?
          fi

          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set in the Infisical 'prod' environment. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          node scripts/ci/check-migration-replay.mjs

      - name: No migrations touched
        if: steps.touched.outputs.run != 'true'
        run: echo "No files under supabase/migrations/ changed — replay not needed."
