name: Staging conformance

# The repository's first scheduled verification (#838), and still the only one that
# runs a live sign-in probe. Every push-triggered workflow left environment drift
# invisible until someone happened to push — staging sat 38 migrations behind with
# all checks green, the Infisical credential was dead for 71 days (#696/#763), and
# the custom access token hook was never enabled after #643 (#805). A quiet week
# looked identical to a healthy one.
#
# Semantics live in scripts/ci/staging-conformance.mjs.
# Unit tests: scripts/ci/__tests__/staging-conformance.test.mjs (`npm run test:ci-scripts`).
#
# Scope is frapp-staging ONLY — not because frapp-prod is inactive (it is
# `ACTIVE_HEALTHY` and has served production traffic since deploy-production.yml
# shipped, #1340) but because this workflow has not yet been extended to it.
# Extending it needs its assertions and its alert-issue title/marker parameterized
# per target so a production failure doesn't collide with or mask a staging one —
# real design work, tracked as remaining scope in #1384. Doc pointer:
# docs/internal/ci-cd/AGENT_INFRA.md § Scheduled conformance.

on:
  schedule:
    # 07:30 UTC daily — after any overnight provider maintenance window, early
    # enough that a drifted staging is known before the working day, and the last
    # of four staggered scheduled workflows: 15 minutes past its closest neighbor
    # production-guardrails.yml (07:15), an hour past check-migration-drift.yml
    # (07:00), and an hour past db-backup.yml's pg_dump (06:30) — so this
    # workflow's Management API reads never overlap another watchdog's own reads
    # or the backup. Full schedule: docs/internal/ci-cd/AGENT_INFRA.md § Scheduled
    # conformance.
    #
    # ⚠️ GitHub DISABLES scheduled triggers in a repository with no activity for
    # 60 days, notifying the repo owner by email only. This is the one workflow
    # whose entire premise is running during quiet periods, so that ceiling is
    # exactly backwards for it: a long quiet stretch silently turns off the
    # thing watching the quiet stretch. If the repo goes dormant, re-enable it
    # from the Actions tab. Tracked in AGENT_INFRA.md § "Scheduled conformance".
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The script upserts a single `routine-state` alert issue and closes it on
  # recovery. Nothing else here writes.
  issues: write

concurrency:
  # One conformance run at a time, and NEVER cancel one in flight. The alert
  # upsert is comment-then-PATCH, two non-atomic calls: a cancellation between
  # them leaves the issue open carrying a "recovered — closing" comment, or
  # reopened with no statement of what failed. A cancelled run is also neither
  # green nor red and raises no alert, so that day's evidence just disappears —
  # the failure mode this workflow exists to end. Same reasoning as
  # verify-deployments.yml.
  group: staging-conformance
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Bounded, like the sibling watchdogs. Without it an unresponsive provider
    # socket could hold the runner to GitHub's 360-minute default while writing
    # no summary and raising no alert. The script also caps each fetch.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This is the repo's only workflow granting `issues: write` at
          # workflow level, and a third-party action runs after checkout.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Mirrors deploy-api.yml's preflight. A missing credential here would
      # otherwise present as a 401 from the injection step, which reads as
      # "revoked" when it is usually "never set". See #696.
      - name: Verify Infisical credentials are configured
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          MISSING=""
          [ -n "$CLIENT_ID" ] || MISSING="$MISSING INFISICAL_MACHINE_IDENTITY_ID"
          [ -n "$CLIENT_SECRET" ] || MISSING="$MISSING INFISICAL_CLIENT_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::warning::Infisical credentials are not configured. Missing or empty:$MISSING. Set them as repository secrets — see docs/internal/environment/SECRETS_MANAGEMENT.md."
          fi
          case "$CLIENT_ID$CLIENT_SECRET" in
            *[[:space:]]*) echo "::warning::An Infisical credential secret contains whitespace. A trailing newline picked up when pasting the value into GitHub is a common cause of 401 Invalid credentials — re-paste both secrets before concluding the credential was revoked." ;;
          esac
          echo "Preflight complete; a 401 from the next step means the credentials were rejected, not missing."

      # continue-on-error is load-bearing, not laziness. A revoked or rotated
      # machine identity — the #696/#763 incident this workflow exists to catch —
      # makes this action exit non-zero. Failing the job here would kill the run
      # BEFORE staging-conformance.mjs could report the credential failure and
      # raise the alert, so the single most likely drift class would produce a
      # red run and no issue. Letting it through means the script runs, finds the
      # credential rejected, and files the alert that says so.
      - name: Inject staging secrets from Infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "frapp-live-ej-ls"
          env-slug: "staging"
          secret-path: "/"
          include-imports: true

      - name: Assert staging conformance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Injected above by the Infisical step: SUPABASE_ACCESS_TOKEN,
          # SUPABASE_PROJECT_REF, SUPABASE_URL, SUPABASE_ANON_KEY.
          # INFISICAL_PROJECT_ID is not passed: the script reads workspaceId
          # from .infisical.json, so it cannot drift from the checked-in value.
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          # Optional. Absent → the end-to-end sign-in probe reports SKIPPED
          # rather than passing silently. The user must have exactly ONE
          # chapter membership; see the script's note on the claimless-token trap.
          STAGING_SMOKE_USER_EMAIL: ${{ secrets.STAGING_SMOKE_USER_EMAIL }}
          STAGING_SMOKE_USER_PASSWORD: ${{ secrets.STAGING_SMOKE_USER_PASSWORD }}
        run: node scripts/ci/staging-conformance.mjs
