name: Nightly Backup

# Offsite backup of BOTH deployed environments: the database (#852) and Storage
# objects (#1290), for staging and — since 2026-09-06 — for production (#1435,
# #1383 stage 5).
#
# Two mechanisms per environment, because they are two genuinely different things
# and neither is a flag on the other. The `backup-*` jobs dump Postgres with the
# Supabase CLI. The `backup-*-storage` jobs mirror Storage objects, which a
# database dump cannot cover -- "Database backups do not include objects you store
# via the Storage API, as the database only includes metadata about these objects."
# A restore needs both halves or it produces rows referencing files nobody kept.
#
# This is not redundancy on top of a provider snapshot. The `Frapp Live` org is on
# the Supabase FREE plan, which gets no dashboard-accessible daily backups and no
# PITR — so until that changes (#1403), this workflow is the ONLY source of a
# restorable backup for either project (for production, from its first successful
# scheduled run onward). Supabase's own free-tier guidance is exactly this:
# https://supabase.com/docs/guides/platform/backups
#
# ── Why the production jobs do NOT say `environment: production` ─────────────
# ADR-19 put Required reviewers on the `production` GitHub environment, and that
# gate is not deploy-only: every job naming the environment pauses on it, and an
# unapproved scheduled run just expires — a workflow that LOOKS like coverage and
# writes nothing. #1435 records the trap. The production jobs run under a separate
# `production-backup` environment instead, which GitHub creates on the first run
# that references it, with no protection rules. It must never gain REQUIRED
# REVIEWERS — that would reintroduce the trap — but it SHOULD get a deployment
# branch policy of `main` only (Settings → Environments → production-backup →
# Deployment branches → Selected → main) once it exists: without one, anyone with
# write access can dispatch a modified copy of this workflow from a branch and
# run it under this environment. (The Infisical machine identity is a repo-level
# secret, so the policy narrows the environment rather than the secret; the same
# exposure already exists for `check-migration-drift.yml`, which reads `prod` with
# no environment at all.) The deploy gate on `production` is untouched.
#
# ── Why the production jobs inject TWO Infisical environments ────────────────
# The source credentials (SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY) come from Infisical `prod`. The offsite destination
# (`BACKUP_S3_*`, provisioned 2026-08-27 in #1287) lives ONLY in Infisical
# `staging` — one bucket, one token, both environments as prefixes under it. Until
# production has its own, the production jobs inject `staging` FIRST (for the
# bucket) and `prod` SECOND, so every shared name resolves to the production
# value. That ordering is load-bearing, and it is not the only guard: each backup
# action asserts the injected project ref / URL against `.github/environments.json`
# before it links, so a missing `prod` value can only fail the job — never dump
# the staging database under a `production/` label.
#
# The shared bucket is a known, accepted, TEMPORARY weakness: the staging token
# can read, overwrite and delete production dumps, so a staging or preview
# compromise reaches the production backups. The target state is a SEPARATE R2
# bucket and bucket-scoped token for production, stored as `BACKUP_S3_*` in
# Infisical `prod` only (never synced to Vercel/Render staging or previews) — at
# which point the `staging` injection on the two production jobs is deleted and
# nothing else changes. Provisioning that is a dashboard step for the owner
# (ENV_REFERENCE.md § Offsite Backup Secrets).
#
# Restoring what this produces: docs/internal/ops/DB_ROLLBACK_PLAYBOOK.md.

on:
  schedule:
    # 06:30 UTC — 02:30 ET, off-peak for a US-college user base, clear of the deploy
    # pipeline, and 30 minutes ahead of the three 07:00/07:15/07:30 watchdogs
    # (check-migration-drift, production-guardrails, staging-conformance, in that
    # order) so a pg_dump never overlaps a Management API read of the same project.
    # Full schedule documented in docs/internal/ci-cd/AGENT_INFRA.md § Scheduled
    # conformance.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      storage_rehearsal:
        description: >-
          Run the Storage restore rehearsal instead of a plain backup, on STAGING
          only: write a canary object, back it up, delete it from Storage, restore
          it from the offsite copy, and assert the bytes match. This is the drill
          that turns a copy into a backup -- it writes and deletes only its own
          canary. The production Storage job ignores this input on purpose: it
          runs with no reviewer, and the rehearsal is a write.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two dumps of the same database overlap. `cancel-in-progress: false`
  # because a half-uploaded dump that got cancelled is worse than a late one.
  group: db-backup
  cancel-in-progress: false

jobs:
  # ── Staging ───────────────────────────────────────────────────────────────
  backup-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject staging secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Dump, upload, verify and prune
        uses: ./.github/actions/db-offsite-backup
        with:
          environment: staging

  # Storage objects. Runs independently of the dump above: a failure to back up
  # the database must not skip Storage, and vice versa -- two half-backups are
  # more recoverable than one that never ran. Reads Storage over its REST API
  # with the service-role key, so unlike the S3-protocol route it needs no
  # credential that does not already exist. Rationale in scripts/storage-backup.mjs.
  backup-staging-storage:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject staging secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Mirror Storage objects (or rehearse a restore)
        uses: ./.github/actions/storage-offsite-backup
        with:
          environment: staging
          # The pre-existing prefix, kept so staging's mirror history and
          # tombstones stay continuous.
          prefix: storage
          rehearsal: ${{ inputs.storage_rehearsal == true && 'true' || 'false' }}

  # ── Production ────────────────────────────────────────────────────────────
  # See the header for why this is `production-backup`, not `production`, and
  # why two Infisical environments are injected in this order.
  backup-production:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FIRST: the offsite destination. `BACKUP_S3_*` live only here for now.
      - name: Inject the offsite destination from Infisical staging
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      # SECOND: the source. Every name both environments define now resolves
      # to the production value; the action below asserts the ref before it links.
      - name: Inject production secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Dump, upload, verify and prune
        uses: ./.github/actions/db-offsite-backup
        with:
          environment: production

  backup-production-storage:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject the offsite destination from Infisical staging
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Inject production secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      # Never the rehearsal here. The rehearsal WRITES a canary object into the
      # project's Storage and deletes it again, and this job runs with no
      # reviewer — a `workflow_dispatch` tick would otherwise perform a write
      # against production without the ADR-19 approval every other production
      # write has. The staging job above is where #1421's rehearsal runs; a
      # production Storage rehearsal is a deliberate human step for now.
      - name: Mirror Storage objects
        uses: ./.github/actions/storage-offsite-backup
        with:
          environment: production
          # A sibling of `storage`, not `production/storage`: the database prune
          # lists `production/` and skips anything that is not a dump label, but
          # keeping the two namespaces apart means it never has to.
          prefix: storage-production
          rehearsal: "false"
