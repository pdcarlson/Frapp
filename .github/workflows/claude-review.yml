# Automated PR review by Claude (replaces CodeRabbit — see ADR-14).
#
# Auth: a Claude Pro/Max subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`),
#   stored as a repo secret. Until it exists the review skips and the gate passes (advisory).
# Model: Opus 4.8 — a single full, in-depth review.
# WHEN IT RUNS:
#   - Exactly ONCE automatically on PR opened / reopened / ready_for_review (full Opus review).
#   - NEVER automatically on push (`synchronize` is intentionally NOT a trigger — pushing fixes is free).
#   - ON DEMAND: comment `@claude review` on the PR to re-run a full review against the current head
#     (restricted to repo collaborators — see the author_association check below).
#   - `labeled` only re-evaluates the gate (so adding `claude-review-override` clears it); no review spend.
# Gate: `claude-review-gate` is a REQUIRED commit status this workflow posts to the PR HEAD SHA (NOT the
#   implicit check-run — see the gate job). It blocks merge when the review reports an Important finding,
#   or when a review was expected but produced no fresh verdict for the head SHA. Add the
#   `claude-review-override` label to bypass. Bot/draft/fork/no-token runs pass.
# MERGE AFTER A PUSH: the new commit has no gate status, so branch protection shows "Expected". To merge,
#   comment `@claude review` on the final commit (fresh green status on the head SHA) OR add the override.
# Cost: consumes metered Actions minutes + subscription quota only on open and on each `@claude review`
#   (NOT on every push) — a large cut vs the previous per-push Sonnet pass.
# Runbook: docs/internal/ci-cd/AI_CODE_REVIEW_RUNBOOK.md
name: Claude Review

on:
  pull_request:
    branches: [main, production]
    types: [opened, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write # the gate posts an explicit commit status to the PR head SHA
  id-token: write # claude-code-action mints its GitHub App token via OIDC

concurrency:
  # PR number comes from either event shape; serialise per-PR and cancel superseded runs.
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ── Resolve PR number + head SHA + override label uniformly across both event types ──────────────
  context:
    name: claude-review-context
    # Which events even start a run:
    #  - pull_request: opened/reopened/ready_for_review (full review), OR a `labeled` event that adds
    #    `claude-review-override` (re-evaluate the gate only). Always: not a draft, not a fork, not the
    #    bot's own action.
    #  - issue_comment: only on a PR, body contains `@claude review`, not from claude[bot], and only from
    #    a trusted association (OWNER/MEMBER/COLLABORATOR). issue_comment runs with base-repo secrets, so
    #    untrusted commenters must not be able to spend the OAuth token.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'claude[bot]' &&
        (
          github.event.action != 'labeled' ||
          contains(github.event.pull_request.labels.*.name, 'claude-review-override')
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.user.login != 'claude[bot]' &&
        github.actor != 'claude[bot]' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      override: ${{ steps.resolve.outputs.override }}
      is_fork: ${{ steps.resolve.outputs.is_fork }}
    steps:
      - name: Resolve PR number, head SHA, override label, fork-ness
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_FROM_PR: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PR="${PR_FROM_PR:-$PR_FROM_ISSUE}"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # headRefOid is the PR head SHA on BOTH event types; github.event.pull_request.head.sha is
          # empty on issue_comment. Labels are read here too (github.event.pull_request.labels is empty
          # on issue_comment) so the gate sees the override consistently across event types.
          gh pr view "$PR" --repo "$REPO" --json headRefOid,labels,isCrossRepository \
            --jq '
              "head_sha=\(.headRefOid)",
              "override=\([.labels[].name] | index("claude-review-override") != null)",
              "is_fork=\(.isCrossRepository)"
            ' >> "$GITHUB_OUTPUT"

  review:
    name: claude-review
    needs: context
    # Run the (expensive) review only for the open/reopen/ready or `@claude review` paths — NOT for a
    # bare `labeled` event (that only re-evaluates the gate). Skip forks defensively.
    if: >-
      always() &&
      needs.context.result == 'success' &&
      needs.context.outputs.is_fork != 'true' &&
      github.event.action != 'labeled'
    runs-on: ubuntu-latest
    outputs:
      structured_output: ${{ steps.review.outputs.structured_output }}
      token_present: ${{ steps.token.outputs.present }}
    steps:
      - name: Check for review token
        id: token
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — skipping review; the gate will pass. Add the repo secret to enable."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.head_sha }} # explicit: github.event.pull_request.head.sha is empty on issue_comment
          fetch-depth: 1

      - name: Claude review
        id: review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1 # first-party; pin to a release SHA for stricter supply-chain control
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.context.outputs.pr }}
            REVIEW DEPTH: full — review the entire PR diff in depth

            Read BOTH `.github/claude-review/review-guidelines.md` (the rubric) and
            `.github/claude-review/learnings.md` (accumulated repo-specific lessons) first, and apply them.

            Review this PR for correctness (bugs, broken edge cases, regressions, race/TOCTOU issues),
            security (OWASP Top 10 plus the apps/api and supabase/migrations rules in the rubric),
            performance, and shared-package (packages/*) breakage.

            Be assertive and skeptical: examine every changed hunk, assume a bug until you've checked
            the edge cases, and prefer surfacing a genuine concern over staying silent. Do not limit
            the number of real issues you raise.

            Severity drives a MERGE GATE: reserve "Important" for findings that would break behavior,
            leak data, bypass auth, corrupt state, or block rollback — an Important finding BLOCKS merge.
            Be generous with Nits but precise with Important: when unsure whether something truly blocks,
            it's a Nit, not Important. Post up to ~12 inline Nits; summarise any beyond that.

            Post inline findings with mcp__github_inline_comment__create_inline_comment (confirmed: true)
            on the exact lines, then ONE summary via `gh pr comment` whose LAST line is exactly:
            <!-- claude-review-verdict: sha=${{ needs.context.outputs.head_sha }} important=N -->
            (copy the sha exactly as shown; replace N with the count of Important findings you posted).
            Only post GitHub comments — do not modify any files.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 25
            --json-schema '{"type":"object","properties":{"important_count":{"type":"integer"},"summary":{"type":"string"}},"required":["important_count","summary"]}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  gate:
    # IMPORTANT: the implicit check-run name is `claude-review-gate-runner`, NOT the required context.
    # The REQUIRED context `claude-review-gate` is satisfied by the explicit commit status this job posts
    # to the PR HEAD SHA (works on both event types; keyed to the exact commit branch protection cares
    # about). If this job were named `claude-review-gate`, branch protection would require BOTH the
    # implicit check-run (attached to the wrong SHA on issue_comment) AND the status — wedging merges.
    name: claude-review-gate-runner
    needs: [context, review]
    if: ${{ always() && needs.context.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the gate script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # the event ref is fine; the script is input-driven and SHA-agnostic

      - name: Evaluate review gate and post commit status to the PR head SHA
        # Decision logic + unit tests: scripts/ci/evaluate-review-gate.mjs (run by the ci-scripts-tests
        # job). It prints `gate_state=success|failure` + `gate_desc=...` and always exits 0; this step
        # posts that as the required `claude-review-gate` commit status on the resolved head SHA. BLOCKS
        # when a review was EXPECTED (token present; not draft/fork/bot) but produced no FRESH verdict for
        # this head SHA, or when important>0. PASSES for intentional skips (no token/draft/fork/bot/
        # override/labeled-only) and for a fresh verdict with important=0.
        env:
          OVERRIDE: ${{ needs.context.outputs.override }}
          REVIEW_RESULT: ${{ needs.review.result }}
          TOKEN_PRESENT: ${{ needs.review.outputs.token_present }}
          STRUCTURED: ${{ needs.review.outputs.structured_output }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          IS_FORK: ${{ needs.context.outputs.is_fork }}
          PR: ${{ needs.context.outputs.pr }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          COMMENTS_JSON=$(gh pr view "$PR" --repo "$REPO" --json comments \
            --jq '[.comments[] | select(.body | contains("claude-review-verdict")) | .body]' 2>/dev/null || echo '[]')
          export COMMENTS_JSON
          node scripts/ci/evaluate-review-gate.mjs | tee gate.out
          STATE=$(sed -n 's/^gate_state=//p' gate.out | head -n1)
          DESC=$(sed -n 's/^gate_desc=//p' gate.out | head -n1 | cut -c1-140)
          : "${STATE:=failure}"
          : "${DESC:=gate evaluation produced no state — blocking}"
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context="claude-review-gate" \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
