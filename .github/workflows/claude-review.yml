# Automated PR review by Claude (replaces CodeRabbit — see ADR-14).
#
# Auth: a Claude Pro/Max subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`),
#   stored as a repo secret. Until it exists the review skips and the gate passes (advisory).
# Models: Opus 4.8 (in-depth) on PR open/reopen/ready; Sonnet 4.6 (incremental) on each push.
# Gate: `claude-review-gate` blocks merge ONLY when the review reports an Important finding. Add the
#   `claude-review-override` label to bypass a false positive. Bot/draft/fork/no-token runs pass.
# Cost: consumes metered Actions minutes + subscription quota on every reviewed event.
# Runbook: docs/internal/ci-cd/AI_CODE_REVIEW_RUNBOOK.md
name: Claude Review

on:
  pull_request:
    branches: [main, production]
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-action mints its GitHub App token via OIDC

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    # Skip label-only events, drafts, fork PRs, and the bot's own commits (anti-loop; see action #1299).
    if: >-
      github.event.action != 'labeled' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    outputs:
      structured_output: ${{ steps.review.outputs.structured_output }}
    steps:
      - name: Check for review token
        id: token
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — skipping review; the gate will pass. Add the repo secret to enable."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select model by event
        id: model
        run: |
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "depth=incremental — prioritise the newest commits; do not re-flag issues already commented on earlier commits" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-opus-4-8" >> "$GITHUB_OUTPUT"
            echo "depth=full — review the entire PR diff in depth" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        id: review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1 # first-party; pin to a release SHA for stricter supply-chain control
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW DEPTH: ${{ steps.model.outputs.depth }}

            Read BOTH `.github/claude-review/review-guidelines.md` (the rubric) and
            `.github/claude-review/learnings.md` (accumulated repo-specific lessons) first, and apply them.

            Review this PR for correctness (bugs, broken edge cases, regressions, race/TOCTOU issues),
            security (OWASP Top 10 plus the apps/api and supabase/migrations rules in the rubric),
            performance, and shared-package (packages/*) breakage. Follow the REVIEW DEPTH above.

            Be assertive and skeptical: examine every changed hunk, assume a bug until you've checked
            the edge cases, and prefer surfacing a genuine concern over staying silent. Do not limit
            the number of real issues you raise.

            Severity drives a MERGE GATE: reserve "Important" for findings that would break behavior,
            leak data, bypass auth, corrupt state, or block rollback — an Important finding BLOCKS merge.
            Be generous with Nits but precise with Important: when unsure whether something truly blocks,
            it's a Nit, not Important. Post up to ~12 inline Nits; summarise any beyond that.

            Post inline findings with mcp__github_inline_comment__create_inline_comment (confirmed: true)
            on the exact lines, then ONE summary via `gh pr comment` whose LAST line is exactly:
            <!-- claude-review-verdict: important=N --> (N = number of Important findings you posted).
            Only post GitHub comments — do not modify any files.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --max-turns 25
            --json-schema '{"type":"object","properties":{"important_count":{"type":"integer"},"summary":{"type":"string"}},"required":["important_count","summary"]}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  gate:
    name: claude-review-gate
    needs: review
    # Always report a conclusion (this is the required check), EXCEPT on a non-override `labeled`
    # event — then skip so the prior gate result stands (no loophole where any label clears the gate).
    if: ${{ always() && (github.event.action != 'labeled' || contains(github.event.pull_request.labels.*.name, 'claude-review-override')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate review gate
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          STRUCTURED: ${{ needs.review.outputs.structured_output }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'claude-review-override') }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$OVERRIDE" = "true" ]; then
            echo "::notice::'claude-review-override' label present — gate passes."; exit 0
          fi
          if [ "$REVIEW_RESULT" != "success" ]; then
            echo "::notice::Review job did not complete (result=$REVIEW_RESULT) — gate passes (advisory)."; exit 0
          fi
          # Primary signal: the action's structured output. Fallback: the verdict marker in the summary comment.
          important=""
          if [ -n "${STRUCTURED:-}" ]; then
            important=$(printf '%s' "$STRUCTURED" | jq -r '.important_count // empty' 2>/dev/null || true)
          fi
          if [ -z "$important" ]; then
            body=$(gh pr view "$PR" --repo "$REPO" --json comments \
              --jq '[.comments[] | select(.body | contains("claude-review-verdict"))] | last | .body' 2>/dev/null || true)
            important=$(printf '%s' "$body" | sed -n 's/.*claude-review-verdict: *important=\([0-9][0-9]*\).*/\1/p' | head -n1)
          fi
          if [ -z "$important" ]; then
            echo "::notice::No review verdict found — gate passes (advisory)."; exit 0
          fi
          echo "Important findings reported: $important"
          if [ "$important" -gt 0 ]; then
            echo "::error::Claude review flagged $important Important finding(s) — blocking merge. Resolve them, or add the 'claude-review-override' label to bypass."
            exit 1
          fi
          echo "::notice::No Important findings — gate passes."
