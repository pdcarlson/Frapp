name: Codex review

# Advisory PR review: inline comments on a `COMMENT` review, plus a summary comment.
# Never a blocking review event — see below. Decided in ADR-14's "Amendment — 2026-09-18
# (decision)"; the behaviour this file relies on is recorded in its "Amendment —
# 2026-09-18 (implementation)". Installs @openai/codex and calls the CLI's
# first-class `codex review` subcommand against a BYOK provider.
#
# WHAT ADVISORY MEANS HERE, AND WHY EACH PART IS LOAD-BEARING:
#   * NOT a required check. Deliberately absent from
#     scripts/ci/lib/required-checks.mjs. Do not add it.
#   * NEVER a BLOCKING review event. The ban used to be absolute — no review
#     event at all — because a write-access CHANGES_REQUESTED trips the merge
#     ruleset even with green checks and no agent can clear it (GITHUB_PAT 401,
#     no MCP dismiss tool, an author cannot self-approve). Measured on #1875.
#     ADR-14's 2026-09-18 (commenting) amendment narrows it to the event types
#     that actually cause that block, CHANGES_REQUESTED and APPROVED, so findings
#     can be delivered as a COMMENT review anchored to their lines. COMMENT
#     blocks nothing. The event is a frozen constant in codex-review.mjs
#     (REVIEW_EVENT), never a parameter. A test asserts this on the REQUEST — that
#     an `event` passed by a caller is ignored rather than honoured — NOT by
#     grepping the source, because the source necessarily names both blocking
#     events in these very comments and a guard that fails on its own rationale is
#     one someone deletes.
#   * The SUMMARY stays an ordinary issue comment, which is load-bearing, not
#     legacy: on the FINDINGS path upsertWakeComment's delete-then-create fires
#     `issue_comment action=created`, the event the PR-babysitting agent sessions
#     listen for. A review submission fires `pull_request_review` and would NOT
#     wake them, so the summary comment is what keeps that path alive. A CLEAN run
#     deliberately does not wake: it PATCHes the summary in place, because clean is
#     the steady state and waking a push-capable session on every clean push is
#     noise with nothing to act on.
#   * A reviewer problem must not red this workflow, because a red check here
#     lands on every open PR and the PR-activity webhook delivers it to every
#     watching agent session. Every step that can fail for a reason outside our
#     control therefore carries `continue-on-error`, and the posting step runs on
#     `!cancelled()` so it still files the alert issue. THE LIMIT OF THAT CLAIM:
#     a failed checkout, or a bug in codex-review.mjs itself, still reds the job —
#     the first is genuine infra (ci-wake classifies it), the second is our defect
#     and should be loud.
#
# NOT `openai/codex-action`: its wrapper runs `codex exec` and cannot reach the
# `review` subcommand, and on #2396 it failed twice before Codex ran at all —
# once at `read_server_info` on an empty key, once in 415 ms at its own
# `Check repository write access` gate rejecting `frapp-base-sync[bot]` with
# permission `none`. pr-base-sync.yml sweeps every open PR on every push to
# main, so that second failure would redden the whole open-PR fleet on every
# sweep. Installing the CLI removes the wrapper and both failure modes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR head. A superseded run's review describes a commit that is
# no longer the head, so cancelling it loses nothing — and this is never a
# required check, so a cancelled conclusion strands nothing.
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # the summary comment and the alert issue both go through /issues
  # Required for the inline COMMENT review (POST /pulls/{n}/reviews) and for
  # deleting this reviewer's own stale inline comments on a re-review. This IS the
  # permission that can issue a squash-blocking CHANGES_REQUESTED, which is why
  # the event is frozen in code rather than configured — see the header.
  pull-requests: write

env:
  # UNVERIFIED against the vendor: openrouter.ai is egress-blocked from every
  # authoring sandbox, so this slug comes from a search index, not OpenRouter.
  # The vendor prefix is part of the id — a bare `muse-spark-1.3` is not a valid
  # OpenRouter slug. Kept here so the smoke test changes it in one place.
  REVIEW_MODEL: meta/muse-spark-1.3

  # The CLI banner reported `reasoning effort: none` before this was set, which
  # made it the most plausible single lever on finding quality — the one live run
  # returned zero findings on a 2400-line diff. `high` and `xhigh` were both
  # probed as ACCEPTED under --strict-config against CLI 0.155.0.
  #
  # Effort cannot change the output cap, because THERE IS NO output cap on the
  # wire: `max_output_tokens` is absent from the request entirely (captured and
  # inspected against CLI 0.155.0 — the key is missing, not set to 65536). The
  # 65536 reservation the real 402 reported therefore comes from the PROVIDER
  # supplying the model's full output width in the absence of a cap, which is the
  # correction ADR-14's commenting amendment records against the earlier "Codex
  # reserves" phrasing.
  #
  # What follows from that is bounded, so state it narrowly: no effort setting can
  # alter a field that is never sent. Whether raising effort raises the provider's
  # affordability threshold ANYWAY — if it budgets reasoning on top of that implicit
  # width — is UNVERIFIED, because openrouter.ai is egress-blocked from every
  # authoring sandbox. Expect spend per review to rise; do not assume the 402
  # threshold is unchanged. A knob rather than a literal so it can be retuned
  # without touching the run line.
  REVIEW_REASONING_EFFORT: high

jobs:
  codex-review:
    # Drafts are skipped (still being written). Fork PRs are skipped because
    # `pull_request` withholds secrets from them, so the reviewer could only ever
    # fail and alert — and `pull_request_target`, which would supply the key,
    # would run an agent over untrusted head code with a billing credential in
    # scope. Not worth it for an advisory comment.
    #
    # Docs-only is NOT gated here: the job still runs so the posting step can
    # clear a stale review comment when a PR's code changes are reverted out of
    # the diff. A job-level `if` would strand that comment forever.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Budgeted against the inner `timeout 900`, not guessed: `fetch-depth: 0` plus
    # a CLI whose linux-x64 payload unpacks to ~354 MB needs real headroom, and if
    # the JOB timeout fires during the CLI call then `exit_code` is never written
    # and the posting step never runs — turning the hang this is all designed to
    # catch back into a silent cancelled run. 30 - 15 leaves ~15 minutes.
    timeout-minutes: 30

    steps:
      # head.sha, never refs/pull/N/merge: GitHub only maintains the merge ref
      # while the PR is mergeable, so a conflicted PR hard-fails checkout, and
      # merge-ref lag can hand the reviewer a tree one push behind the diff it
      # was told to review.
      #
      # fetch-depth: 0 because the merge base must be computable. NOTE this
      # leaves a DETACHED HEAD with no local branches — see the `--base` note.
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the diff
        id: gate
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          # A docs-only PR has nothing for a code reviewer to say. Re-derived
          # 2026-09-18 over origin/main with this exact pattern: 12.0% of the last
          # 100 commits and 8.8% of the last 250 are docs-only. (The #2396 spike's
          # "~22%" had no sample window or definition and does not reproduce.)
          #
          # Written to a file rather than piped into `grep -q` on purpose. Under
          # `pipefail`, `grep -q` exits as soon as it matches, so git can take a
          # SIGPIPE (141) and set the PIPELINE status non-zero even though grep
          # succeeded — which would invert this test and review nothing on a code
          # PR. That is a timing-dependent race, not a certainty: on a 503-file
          # diff it did NOT reproduce locally (pipeline status 0). It is removed
          # by construction rather than left to luck, because the failure is
          # silent. An empty diff leaves grep at 1, correctly docs-only.
          #
          # $RUNNER_TEMP, never the workspace: a scratch file written into the
          # tree would show up in this very diff and in the reviewed tree.
          git diff --name-only "$base_sha" HEAD > "$RUNNER_TEMP/changed-files.txt"

          # Hunk headers only — these are the inline-comment anchors. GitHub
          # rejects a review comment whose line is outside the PR's diff with a
          # 422 that discards the WHOLE review, so codex-review.mjs checks each
          # finding's line against these before anchoring it.
          #
          # Written HERE, before the instruction-file purge rewrites the tree, and
          # into $RUNNER_TEMP for the same reason as the file above: a scratch file
          # in the workspace would show up in this very diff.
          #
          # Headers only, so a 500-file PR does not write a megabyte. `|| true`
          # because grep exits 1 when it matches nothing (a pure-deletion diff),
          # and the inherited -e would treat that as fatal.
          #
          # --output-indicator-new is NOT cosmetic. With the default `+`, an ADDED
          # line whose own text begins `++ ` is emitted as `+++ …`, byte-identical
          # to a real `+++ b/path` file header — verified with git. codex-review.mjs
          # then read it as a header and attributed every later hunk of that file to
          # a fabricated path, so real findings there silently lost their anchor;
          # if the fake path collided with another changed file, the bogus anchor
          # 422'd the whole review. This repo's docs are full of quoted diffs, so
          # that content is ordinary. Marking added lines with \002 leaves the
          # headers as the only lines that can start with `+++` or `@@`.
          git diff --unified=0 --output-indicator-new=$'\002' "$base_sha" HEAD \
            | { grep -E '^(\+\+\+|@@)' || true; } > "$RUNNER_TEMP/codex-diff.txt"
          if grep -qvE '(\.mdx?$|^docs/|^spec/)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
          else
            echo "skip_reason=docs-only PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.gate.outputs.skip_reason == ''
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Codex CLI
        if: steps.gate.outputs.skip_reason == ''
        continue-on-error: true
        # Installed OUTSIDE the repository, for two reasons:
        #   * The repo root is an npm-workspaces package. `npm install` there
        #     resolves the whole workspace tree, not just this one package —
        #     minutes of work this job has no use for, and a failure mode
        #     unrelated to reviewing.
        #   * It keeps `node_modules/` out of the tree the reviewer reads and
        #     diffs. The reviewer has shell access in a read-only sandbox; there
        #     is no reason to hand it a dependency tree to wander into.
        #
        # Pinned exactly: this is the only job holding a billing credential, and a
        # floating range would swap the reviewer under us. The related gap — that
        # .github/dependabot.yml declares only `package-ecosystem: npm` and so
        # never bumps a pin like this one — is already tracked as #1540. Do not
        # re-file it.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-cli"
          npm install --prefix "$RUNNER_TEMP/codex-cli" \
            --no-save --no-audit --no-fund @openai/codex@0.155.0

      # The injection channel is in the harness, not a prompt: `codex review`
      # reads project instruction files NATIVELY, respecting
      # AGENTS.override.md > AGENTS.md > configured fallbacks. So a PR could
      # otherwise rewrite the rules it is reviewed under. Closed structurally by
      # controlling the tree: purge every instruction file, then restore only
      # the ones the merge base has.
      #
      # This exact form is the one ADR-14 records as tested; four shorter
      # variants are broken. Specifically:
      #   * `git checkout <sha> -- AGENTS.md '**/AGENTS.md'` restores NOTHING and
      #     exits 1 when a pathspec matches no file — it is all-or-nothing.
      #   * Restoring cannot remove a file the PR ADDED, and AGENTS.override.md
      #     outranks AGENTS.md, so the purge must come first.
      #   * `git ls-tree` supports no glob pathspecs and rejects `:(glob)`.
      #   * Under `set -euo pipefail` a `grep` matching nothing exits 1 and kills
      #     the pipeline, hence `|| true`.
      #
      # Note the deliberate asymmetry: the purge pathspec `*AGENTS.md` matches
      # more than the restore grep (`FOO_AGENTS.md` would be purged and not
      # restored, showing up as a spurious deletion in the review). No such file
      # exists today — the two sets are identical on this tree, checked
      # 2026-09-18 — and purging wider than restoring is the fail-safe direction.
      # Tighten the pathspec if one is ever added.
      #
      # Restoring from the MERGE BASE (not the base tip) is what keeps this
      # diff-neutral, verified by executing the whole sequence against a repo with
      # a PR-added AGENTS.override.md and a PR-added nested apps/api/AGENTS.md:
      # afterwards `git diff <merge_base>` listed only the real source change. The
      # accepted cost is that a legitimate instruction-file change is reviewed
      # under the base ref's rules; the local /diff-review gate still covers it.
      - name: Pin agent instruction files to the merge base
        if: steps.gate.outputs.skip_reason == ''
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git ls-files -z -- '*AGENTS.md' '*AGENTS.override.md' | xargs -0r rm -f
          git ls-tree -r --name-only "$BASE_SHA" \
            | { grep -E '(^|/)AGENTS(\.override)?\.md$' || true; } \
            | tr '\n' '\0' | xargs -0r git checkout "$BASE_SHA" --

      - name: Run codex review
        if: steps.gate.outputs.skip_reason == ''
        id: review
        continue-on-error: true
        env:
          # Absent secret => empty => the CLI exits 1 and the posting step raises
          # the alert issue. Deliberately not a hard failure: a missing credential
          # must not red every PR.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          set -uo pipefail
          # `set -uo pipefail` does NOT disable errexit. Actions runs the script as
          # `bash -e {0}`, so -e is INHERITED and any failing command below would
          # abort the step — skipping the `exit_code` write and leaving the posting
          # step unable to tell "the reviewer failed" (alert, name the cause) from
          # "the reviewer never ran" (alert, point at the run log). Turned off
          # explicitly so this step always reaches its output write.
          set +e

          # CODEX_HOME is NOT created on demand — the CLI errors with
          # "CODEX_HOME points to ... but that path does not exist". Pointing it at
          # a fresh runner temp dir is also what closes repo-local Codex config:
          # plugins, skills, hooks and MCP servers are all configured through
          # $CODEX_HOME/config.toml and are not auto-discovered from the tree, so an
          # empty CODEX_HOME means a PR cannot add any of them.
          mkdir -p "$CODEX_HOME"

          # `--base` MUST be the remote-tracking ref, never the bare branch name.
          # actions/checkout with `ref: <sha>` leaves a DETACHED HEAD and creates
          # no local branch, so `main` does not resolve — only `origin/main` does.
          # And `codex review` does NOT fail when it cannot resolve the base: it
          # silently falls back to a prompt asking the MODEL to find the merge base
          # via `main@{upstream}`, which does not resolve either. Executed against a
          # replica of this checkout: `--base main` sent NO merge-base SHA and still
          # exited 0, while `--base origin/main` sent the correct one. The bare form
          # is a green check over a review of nothing.
          #
          # `--title=` with an equals sign, NOT a separate token. The PR title is
          # author-controlled, and clap parses a leading `-` as a flag:
          # `--title "-x fix"` exits 2 before the review starts (executed), which
          # would file the public "reviewer is broken" alert over a PR title.
          #
          # `--profile` does NOT work on `codex review`, despite a string in the
          # binary listing it: `codex review --profile foo` => "error: unexpected
          # argument '--profile' found" (executed, CLI 0.155.0). `--model` and
          # `--cd` are rejected the same way, so the provider AND the model are
          # both selected with `-c`, and the CLI reviews its cwd.
          #
          # wire_api MUST be "responses": `wire_api = "chat"` is rejected outright
          # in 0.155.0 ("no longer supported"), so there is no wire-protocol
          # fallback if OpenRouter's Responses endpoint (beta) misbehaves.
          #
          # `project_doc_fallback_filenames=[]` closes the half of the injection
          # channel the purge step cannot: the precedence chain ends in
          # "configured fallback filenames", which an empty list removes.
          #
          # `shell_environment_policy.exclude` is defence in depth for the billing
          # credential. Codex's own defaults appear to strip *KEY*/*SECRET*/*TOKEN*
          # from the environment it hands the agent, but that is an UNPINNED
          # upstream default, and this job publishes model output to a public
          # comment. Pinning it costs nothing and does not rely on that default
          # holding across releases. (codex-review.mjs redacts as well.)
          #
          # --strict-config makes an unrecognized key a fast, loud failure rather
          # than a silently ignored one. That matters most for the two security
          # settings above: a renamed key must not fail open. Verified that this
          # whole config set loads clean under it.
          #
          # `timeout` is not belt-and-braces. An unreachable base_url makes the
          # CLI RETRY rather than fail, so without this the job would sit until the
          # job-level timeout. 124 from timeout classifies as a failure.
          timeout 900 "$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" review \
            --strict-config \
            --base "origin/$BASE_REF" \
            --title="$PR_TITLE" \
            -c model_provider=openrouter_byok \
            -c 'model_providers.openrouter_byok={name="OpenRouter (BYOK)",base_url="https://openrouter.ai/api/v1",env_key="OPENROUTER_API_KEY",wire_api="responses"}' \
            -c "model=$REVIEW_MODEL" \
            -c "model_reasoning_effort=$REVIEW_REASONING_EFFORT" \
            -c 'project_doc_fallback_filenames=[]' \
            -c tools.web_search=false \
            -c 'shell_environment_policy.exclude=["*KEY*","*SECRET*","*TOKEN*"]' \
            > "$RUNNER_TEMP/codex-stdout.txt" 2> "$RUNNER_TEMP/codex-stderr.txt"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          # stdout is the payload; the banner, warnings and transcript go to
          # stderr. Surfaced in the log because that is where
          # "Model metadata for `<slug>` not found" shows up. Actions masks
          # `secrets.*` values in logs, so this is safe here — it is the REST API
          # paths (comment and issue bodies) that are unmasked, which is why
          # codex-review.mjs redacts before posting.
          echo "--- codex stderr ---"
          cat "$RUNNER_TEMP/codex-stderr.txt" || true

      # `!cancelled()` rather than `success()`: this step files the alert issue, so
      # it has to run precisely when something upstream went wrong. It also runs on
      # a docs-only PR, where SKIP_REASON is set — that is what lets it clear a
      # stale review comment instead of stranding one.
      #
      # CODEX_EXIT_CODE is deliberately allowed to arrive EMPTY (the review step
      # was skipped, or died before its output write). codex-review.mjs treats
      # empty as "the reviewer never ran" and alerts; it must never be read as
      # success, which is why the script parses it explicitly rather than with
      # Number() — Number("") is 0.
      - name: Post advisory review comment
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CODEX_STDOUT_FILE: ${{ runner.temp }}/codex-stdout.txt
          CODEX_STDERR_FILE: ${{ runner.temp }}/codex-stderr.txt
          CODEX_DIFF_FILE: ${{ runner.temp }}/codex-diff.txt
          CODEX_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          SKIP_REASON: ${{ steps.gate.outputs.skip_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Passed so the script can redact it out of anything it publishes.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/ci/codex-review.mjs
