name: Migration snapshot

# Publishes what each deployed Supabase project has applied, so the migration
# gates on pull requests can read it without holding a credential (#2518).
#
# ── Why the gates cannot read it themselves ─────────────────────────────────
# `migration-drift-gate.yml` runs on `pull_request`. For a same-repository PR,
# GitHub runs the workflow definitions from the PR's own branch, so whatever a
# PR job can read, anyone who can push a branch can read, by editing that
# workflow or adding one. Its three jobs used to inject Infisical `prod` for a
# single read, `GET /v1/projects/{ref}/database/migrations`, and the
# account-level `SUPABASE_ACCESS_TOKEN` that answered it then also drove
# production. Now this workflow makes the read, and the PR jobs download what
# it uploads (`.github/actions/download-migration-snapshot`) with GITHUB_TOKEN.
#
# ── Why the credential is safe here ─────────────────────────────────────────
# `workflow_run` and `schedule` always run the default branch's copy of this
# file. A dispatch can target any branch, and it runs that branch's copy.
# What stops that copy reaching the secret is the `automation` environment the
# job names, whose deployment-branch rule admits `main` only (#2583). A branch
# can edit this file but not that rule, and an environment releases its
# secrets only to a job that passed it. Whatever a branch run uploads anyway,
# the download action trusts only a run whose commit is on `main`.
#
# ── Two injections, one token each ──────────────────────────────────────────
# Each Infisical environment's SUPABASE_ACCESS_TOKEN is a read-only token for
# its own project (#2583), so production's cannot read staging. The job injects
# both environments and keeps each token under its own name before the next
# injection overwrites it.
#
# ── When it runs ────────────────────────────────────────────────────────────
# After every `Deploy API` and `Deploy production` run, the only workflows that
# apply migrations. That is what keeps the snapshot current, because a
# scheduled run here starts hours late. The 4-hourly schedule is a backstop
# for applies made outside those workflows (DB_PROMOTION_RUNBOOK repairs).
# Off `main`, the required gates wait up to 15 minutes for a snapshot newer than
# the latest finished deploy, then refuse the stale one
# (`.github/actions/download-migration-snapshot`, `on-stale`), with an age limit of
# `DEFAULT_MAX_AGE_HOURS` (`scripts/ci/lib/migration-snapshot.mjs`) as backstop.
# A manual ledger change triggers nothing, so dispatch this after one
# (DB_PROMOTION_RUNBOOK.md § What catches drift, and what catches bad ordering).
#
# Semantics: scripts/ci/publish-migration-snapshot.mjs. Unit tests:
# scripts/ci/__tests__/migration-snapshot.test.mjs (`npm run test:ci-scripts`).
#
# Not a required PR check. It never runs on a pull request.

on:
  workflow_run:
    workflows: ["Deploy API", "Deploy production"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run reads a newer state, so a queued run can replace a pending
  # one. The running one finishes: it writes nothing outside its own artifact,
  # and consumers take the newest successful run.
  group: migration-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: automation
      # A read, not a deployment: no deployment record per run.
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only SUPABASE_ACCESS_TOKEN is read from each; project refs come from
      # .github/environments.json.
      - name: Inject staging secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "staging"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Keep the staging token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the Infisical 'staging' environment. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN_STAGING=$SUPABASE_ACCESS_TOKEN" >> "$GITHUB_ENV"

      # NOTE: the Infisical slug for production is `prod`, not `production`.
      - name: Inject production secrets from Infisical
        uses: ./.github/actions/infisical-secrets
        with:
          env-slug: "prod"
          client-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Keep the production token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the Infisical 'prod' environment. See docs/internal/environment/SECRETS_MANAGEMENT.md."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRODUCTION=$SUPABASE_ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Read both projects' applied migrations
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/publish-migration-snapshot.mjs --out "$RUNNER_TEMP/migration-snapshot/migration-snapshot.json"

      - name: Upload the snapshot
        uses: actions/upload-artifact@v4
        with:
          name: migration-snapshot
          path: ${{ runner.temp }}/migration-snapshot/migration-snapshot.json
          if-no-files-found: error
          # Only the newest successful run is ever read, and it is at most
          # hours old. Seven days keeps a few for comparison after an incident.
          retention-days: 7
