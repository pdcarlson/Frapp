name: Release

# Create the version tag and GitHub Release for a commit that is LIVE in
# production.
#
# ── What changed ────────────────────────────────────────────────────────────
# This used to fire on `push: [production]`, filter for a merge commit, and read
# one PR number out of the promotion merge-commit message. With the `production`
# branch retired there is no such push and no such message, so the trigger is
# now `workflow_call` — `deploy-production.yml` invokes it as its last job,
# after Render and Vercel have both reported healthy.
#
# The ordering change matters more than the plumbing: a tag is now created only
# once the commit is actually serving traffic. `vX.Y.Z` means "this is live",
# where it used to mean "this was merged and we hoped it would ship".
#
# `workflow_dispatch` is kept as the manual retry path, for the one case
# deploy-production.yml calls out explicitly: production updated, tagging
# failed. Re-run this with the same SHA.
#
# ── Traps this file used to walk into ───────────────────────────────────────
#   1. The old job carried
#        if: contains(github.event.head_commit.message, 'Merge pull request')
#      Under `workflow_call`, `github.event` is the CALLER's payload — a
#      `workflow_dispatch` with no `head_commit`. `contains(null, ...)` is
#      false, so the job would be SKIPPED, the caller would report success, and
#      no tag would ever be created. Silently. The guard is gone.
#   2. Checkout had no `ref:`, which under `workflow_call` resolves to the
#      caller's branch tip — so it would tag whatever main happened to be
#      rather than what was deployed. It now checks out the trimmed dispatch
#      SHA (`steps.sha.outputs.sha`) for history and the tag. The bump
#      classifier is a separate overlay from
#      `github.sha` (see the step below): tagging the live SHA with that
#      SHA's own `resolve-release-bump.mjs` is how run 34155737950 died on
#      issue #1340 after Render and Vercel were already serving traffic.
#   3. `v0.1.0` dereferences to the old `production` head, which is NOT an
#      ancestor of main: `git describe --tags` from a main commit fails
#      outright. Tag discovery therefore uses `git tag --list`, which needs no
#      reachability, and the checkout explicitly fetches tags — without them the
#      bump would restart at 0.0.0 and mint a duplicate `v0.1.0`, which the
#      "already exists" guard below would then skip, producing a deploy with no
#      release at all.
#   4. Receive-pack refuses a tag when that SHA's `.github/workflows` differs
#      from default-branch HEAD (run 34247752847: Packet B shipped `0ca478e9`,
#      then v1.0.0 died). POST /git/tags still succeeds; POST /git/refs is the
#      same App restriction (run 34254679932: object `bca315f9` exists,
#      `refs/tags/v1.0.0` does not, 403 Resource not accessible by
#      integration). Do not widen the GitHub App token to cover workflow
#      files. Mint the ref with repo secret RELEASE_GITHUB_TOKEN (a *user*
#      PAT, contents:write) or from a laptop.
#
# Bump semantics (including why the PR number is parsed from the SUBJECT line
# only) live in `scripts/ci/resolve-release-bump.mjs`. Unit tests:
# `scripts/ci/__tests__/resolve-release-bump.test.mjs`.

on:
  workflow_call:
    inputs:
      sha:
        description: "The commit that is live in production"
        required: true
        type: string
      bump:
        description: "auto | patch | minor | major"
        required: false
        default: auto
        type: string
    secrets:
      # User PAT (contents:write), not the Actions App. Needed when the live
      # SHA's `.github/workflows` tree differs from default-branch HEAD.
      RELEASE_GITHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit that is live in production"
        required: true
        type: string
      bump:
        description: "Version bump ('auto' reads release:* labels since the last tag)"
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # A `permissions:` block is exhaustive — every scope not named here is set
      # to `none`. `contents: write` alone is what the tag and Release need, and
      # it is NOT what reads a PR's labels: `resolve-release-bump.mjs` calls
      # `GET /repos/{repo}/pulls/{n}`, which is gated on `pull-requests`. Without
      # this line the default `bump: auto` path is the one that breaks, and it
      # breaks after Render and Vercel have already deployed.
      #
      # `issues: read` is the #1839 classifier: a 404 on /pulls/{n} is checked
      # against GET /issues/{n} so a squash trailer that named an issue does
      # not abort the tag. Without this grant that lookup 403s and the 404
      # still fails closed — the hole this permission exists to close.
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Trim the SHA
        id: sha
        env:
          RAW_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$RAW_SHA" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      # `fetch-depth: 0` fetches tags in most cases, but not reliably for a
      # detached SHA checkout — and a missing tag list is not a visible failure,
      # it is a version that silently restarts at 0.0.0.
      - name: Fetch tags
        run: git fetch --tags --force origin

      # The live-SHA checkout is load-bearing for the tag, and it is the wrong
      # tree for the bump classifier. Proven 2026-09-07 on run 34155737950:
      # production was already on f2938a01, then this job checked that SHA out
      # and ran its pre-#1844 script, which died on issue #1340. A retry of
      # Release from main with bump=auto would have repeated it, because
      # `node scripts/ci/resolve-release-bump.mjs` would still execute the live
      # SHA's copy. Overlay the classifier (and the modules it imports) from
      # the workflow revision that is running. `github.sha` is the branch
      # selected in the Actions UI under `workflow_dispatch`, and the caller's
      # SHA under `workflow_call`. History and `git tag` stay on the trimmed
      # live SHA (`steps.sha.outputs.sha`).
      - name: Use the running workflow's bump classifier
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          LIVE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_SHA" = "$LIVE_SHA" ]; then
            echo "Workflow revision is the live SHA — classifier already matches."
            exit 0
          fi
          git fetch --no-tags origin "$WORKFLOW_SHA":refs/tmp/workflow-sha
          git checkout refs/tmp/workflow-sha -- \
            scripts/ci/resolve-release-bump.mjs \
            scripts/ci/lib
          echo "Overlaid bump classifier from $WORKFLOW_SHA onto live tree $LIVE_SHA."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get current version
        id: current
        run: |
          set -euo pipefail
          # `git tag --list` rather than `git describe`: v0.1.0 sits on the old
          # production head and is unreachable from main, so `describe` fails.
          VERSION=$(git tag --list 'v*' --sort=-version:refname | head -n1 | sed 's/^v//')
          VERSION="${VERSION:-0.0.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Resolve the version bump
        id: bump
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          BUMP_OVERRIDE: ${{ inputs.bump }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)

          # Subjects only (%s), and through stdin rather than argv so nothing in
          # a commit subject can be re-read as an argument.
          if [ -n "$LAST_TAG" ]; then
            git log --format=%s "$LAST_TAG..$SHA" > "${RUNNER_TEMP:-/tmp}/subjects.txt"
          else
            git log --format=%s -20 "$SHA" > "${RUNNER_TEMP:-/tmp}/subjects.txt"
          fi

          echo "Commits in range: $(wc -l < "${RUNNER_TEMP:-/tmp}/subjects.txt")"
          node scripts/ci/resolve-release-bump.mjs < "${RUNNER_TEMP:-/tmp}/subjects.txt"

      - name: Create tag
        id: tag
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists on remote — skipping (likely a re-run)."
          else
            # Do not send this tag through receive-pack. GITHUB_TOKEN is a
            # GitHub App; it refuses a tag whose tree's `.github/workflows`
            # differs from default-branch HEAD (run 34247752847). POST /git/tags
            # still works with contents:write (run 34254679932 left object
            # bca315f9). POST /git/refs is the same App check — 403 unless
            # GH_TOKEN is a *user* PAT (RELEASE_GITHUB_TOKEN).
            TAG_OBJ="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$TAG" \
              -f message="Release $TAG" \
              -f object="$SHA" \
              -f type="commit" \
              --jq .sha)"
            if [ -z "$TAG_OBJ" ] || [ "$TAG_OBJ" = "null" ]; then
              echo "::error::Creating the annotated tag object returned no SHA."
              exit 1
            fi
            if ! REF_OUT=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$TAG_OBJ" 2>&1); then
              echo "$REF_OUT"
              echo "::error::Failed to create refs/tags/${TAG} pointing at ${TAG_OBJ} on ${SHA}."
              if printf '%s' "$REF_OUT" | grep -q 'Resource not accessible by integration'; then
                echo "::error::The GitHub App cannot create that tag ref when ${SHA}'s workflow tree differs from default-branch HEAD (run 34254679932). Set repository secret RELEASE_GITHUB_TOKEN to a user PAT with contents:write (not an environment secret) and re-run the Release workflow, not Deploy production. Or mint the ref and the GitHub Release from a laptop against this TAG_OBJ. Do not widen the Actions App to cover workflow files."
              fi
              exit 1
            fi
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created tag $TAG on $SHA via the Contents API ($TAG_OBJ)."
            # Changelog uses local `git tag --list` and skips this TAG as
            # PREVIOUS, so a failed fetch must not fail the job: the remote
            # ref already exists, and a retry would skip minting AND skip
            # `gh release create`.
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" \
              || echo "::warning::Could not fetch ${TAG} locally after minting."
          fi

      - name: Generate changelog
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The tag just created is excluded from the range, so this lists what
          # is new in THIS release.
          PREVIOUS=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n1 || true)

          {
            echo "## Changes"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              git log --oneline "$PREVIOUS..$SHA" | sed 's/^/- /'
            else
              git log --oneline -20 "$SHA" | sed 's/^/- /'
            fi
            echo ""
            echo "Deployed commit: \`$SHA\`"
          } > /tmp/changelog.md

          cat /tmp/changelog.md

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Same token as Create tag. A just-minted tag on a SHA whose
          # workflow tree differs from main may 403 under GITHUB_TOKEN too.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/changelog.md \
            --latest
