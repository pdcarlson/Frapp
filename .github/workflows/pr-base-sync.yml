name: PR base sync

# Keeps the open-PR fleet in sync with main (docs/internal/ci-cd/AGENT_INFRA.md
# § Base-branch sync). Branch protection sets `strict: true`, so every merge to
# main outdates every other open PR; this sweep either updates each one via the
# update-branch API (only when the PR_BASE_SYNC_TOKEN PAT is configured — the
# default GITHUB_TOKEN's pushes trigger no CI, which would strand required
# checks at "Expected") or upserts one wake comment per PR so the watching
# agent session merges main itself. Conflicted PRs always get the wake comment:
# conflict resolution needs an agent, not an API call.
#
# Deliberately minimal action surface (checkout only, preinstalled runner Node,
# no npm ci) and best-effort by design, matching ci-wake.yml: if this run dies,
# the next push to main re-sweeps, and the babysitting agents' scheduled
# self-wakes remain the durable fallback.

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Read-only on purpose: GITHUB_TOKEN only lists/reads PRs and calls the compare
  # API. update-branch goes through PR_BASE_SYNC_TOKEN exclusively — routing it
  # through this token would push without triggering CI (recursion guard) and
  # strand required checks at "Expected", the exact state the script refuses.
  pull-requests: read
  issues: write # wake comments (create/delete) go through the issues API

# Only the newest sweep matters — it re-reads every open PR against the newest
# base tip, so cancelling a superseded in-progress or pending run loses nothing
# (unlike ci-wake, whose per-workflow wakes must all land).
concurrency:
  group: pr-base-sync
  cancel-in-progress: true

jobs:
  pr-base-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pr-base-sync.mjs is dependency-free (global fetch + the runner's
      # preinstalled Node) — no setup-node, no npm ci.
      - name: Sync open PRs with the moved base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SYNC_TOKEN: ${{ secrets.PR_BASE_SYNC_TOKEN }}
        run: node scripts/ci/pr-base-sync.mjs
