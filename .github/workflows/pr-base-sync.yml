name: PR base sync

# Keeps the open-PR fleet in sync with main (docs/ci-cd/pr-babysitting.md
# § Base-branch sync). Branch protection sets `strict: true`, so every merge to
# main outdates every other open PR; this sweep either updates each one via the
# update-branch API (only when the base-sync GitHub App is installed and its two
# secrets are set — the default GITHUB_TOKEN's pushes trigger no CI, which would
# strand required checks at "Expected") or, for conflicts and per-PR update
# failures, posts one wake comment so the watching agent session merges main
# itself. A missing/failed app token raises ONE alert issue instead of fanning a
# comment out to every open PR.
#
# Deliberately minimal action surface (checkout + the token mint, preinstalled
# runner Node, no npm ci) and best-effort by design, matching ci-wake.yml: if
# this run dies, the next push to main re-sweeps, and the babysitting agents'
# scheduled self-wakes remain the durable fallback.

on:
  push:
    branches: [main]
  # The auto-merge update slot (#3599; docs/ci-cd/pr-babysitting.md § Base-branch
  # sync). The slot passes on when its holder merges, which is a push. A holder
  # that goes red, or turns green without merging, never pushes, so without this
  # the queue would wait for an unrelated merge. These two workflows emit every
  # required check (scripts/ci/lib/required-checks.mjs). workflow_run runs the
  # DEFAULT branch's copy of this file and the script, never the PR's, and the
  # script reads only the event's name, so a fork PR's run executes none of its
  # own code here.
  workflow_run:
    workflows: [CI, "Migration drift gate"]
    types: [completed]
  # The backstop. A completion fires the moment a holder's last check finishes,
  # inside the grace that keeps it in flight (isInFlight), and nothing fires when
  # that grace runs out. The schedule re-reads the slot, so a holder that is green
  # but never merges, or whose checks never start, can't hold the queue for good
  # in a quiet repo. A backstop, not a bound: GitHub runs `*/15` here far less
  # often (ADR-24 measured a median gap of 3.1 h). A sweep with no auto-merge PR
  # makes one list call.
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  # GITHUB_TOKEN lists and reads PRs, calls the compare API, and posts the wake
  # comments. With `pull-requests: read`, two conflict wakes failed to post
  # while the run stayed green (#3019); the status went unlogged, and the
  # leading cause is that a comment on a PR, though sent through the issues
  # API, needs `pull-requests: write`. ci-wake.yml, whose PR comments do post,
  # grants this same pair. A failed post now logs its status and GitHub's
  # message as a warning, so the next one says whether that was the cause.
  #
  # Write here is not a path to update-branch: the script sends that call with
  # the app token only (`updatePrBranch`, never `token`), because a push through
  # this token triggers no CI (recursion guard) and would strand required checks
  # at "Expected", the exact state the script refuses.
  pull-requests: write
  issues: write # the alert issue (and possibly the wake comments; see above)
  # The auto-merge slot reads each auto-merge PR's required checks (#3599).
  # Without it every read fails: up-to-date auto-merge PRs read as in flight and
  # behind ones are tried in number order, so the slot degrades instead of
  # working (pinned by pr-base-sync-workflow.test.mjs).
  checks: read

# Only the newest sweep matters — it re-reads every open PR against the newest
# base tip, so cancelling a superseded in-progress or pending run loses nothing
# durable (unlike ci-wake, whose per-workflow wakes must all land). The one thing
# a cancel can drop is the trailing alert-issue reconciliation, which runs after
# the per-PR pass; the per-PR wakes themselves are written inline, and the next
# merge to main re-sweeps and re-raises.
#
# Two groups. A CI completion (slot-only, posts nothing) must never cancel a push
# sweep midway through its wake comments, so push sweeps get their own. And only
# completions the job will act on may share the slot group: a completion of
# `main`'s own push CI, or of a fork PR's CI, is skipped by the job `if:` below,
# but concurrency is evaluated first, so in the slot group it would cancel a
# running slot sweep and then do nothing itself; those land in a third group of
# runs that skip. The group is one of three fixed strings, never PR-authored text.
concurrency:
  group: ${{ github.event_name == 'push' && 'pr-base-sync-push' || ((github.event_name == 'schedule' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'pr-base-sync-slot' || 'pr-base-sync-skipped') }}
  cancel-in-progress: true

jobs:
  pr-base-sync:
    # Push runs of CI on main are not a PR's checks; only PR runs move the slot.
    # And only this repo's PRs: a fork head is never queued, so a fork PR's CI
    # can't change the slot, and a fork could otherwise fire this App-token job
    # at will by adding its own workflow named `CI`.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Secrets belong to the `automation` environment: `main` only, no required
    # reviewers (#2518, #2583).
    # See docs/ci-cd/agent-infra.md § GitHub environments and bootstrap secrets.
    environment:
      name: automation
      deployment: false
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Mints a short-lived installation token for the base-sync GitHub App.
      # A GitHub App token is used rather than a fine-grained PAT because it
      # carries no expiry to renew by hand and is not tied to one person's
      # account; unlike GITHUB_TOKEN, its pushes DO create workflow runs, which
      # is the whole point (see the permissions note above).
      #
      # continue-on-error is load-bearing: with the secrets absent the mint
      # fails, and a red workflow here would be exactly the noise this sweep
      # exists to remove. Instead the token comes out empty, the sweep runs in
      # comment-only mode, and pr-base-sync.mjs raises one alert issue.
      - name: Mint base-sync app token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_BASE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_BASE_SYNC_APP_PRIVATE_KEY }}
          # Narrow the installation token to exactly what update-branch needs.
          # An App granted less than this fails the mint outright rather than
          # 403-ing per PR halfway through a sweep — but note that continue-on-error
          # above makes that failure QUIET: the run stays green and the only
          # signal is the alert issue, whose body names under-granted permissions
          # as a cause precisely because there is no red workflow to find.
          permission-contents: write
          permission-pull-requests: write

      # pr-base-sync.mjs is dependency-free (global fetch + the runner's
      # preinstalled Node) — no setup-node, no npm ci.
      - name: Sync open PRs with the moved base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/ci/pr-base-sync.mjs
