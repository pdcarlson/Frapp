name: Production guardrails

# Watchdog for the provider settings that make deploy-off-`main` safe, plus
# the Render health-check path that keeps a production deploy HTTP-gated.
#
# Since #1340, `deploy-production.yml` is meant to be the ONLY way code reaches
# production. That is true only while two dashboard settings stay put, and both
# of them fail OPEN — if either drifts, ordinary merges to `main` start shipping
# to production with no CI gate, no migration gate and no approval, and nothing
# anywhere turns red on its own.
#
#   * Render `frapp-api-prod` must have auto-deploy OFF and track `main`.
#   * Vercel `frapp-web` and `frapp-landing` must NOT be linked to Git.
#   * Render `frapp-api-prod` `serviceDetails.healthCheckPath` must be `/health`.
#     Empty is a TCP socket check (documented 2026-09-06); `/health/ready`
#     would cancel a deploy when a dependency is degraded.
#
# The Vercel assertion was inverted on 2026-09-02 (#1579). It used to read
# "Production Branch must not be `main`"; ADR-21 then retired the Git
# integration, so there is no Production Branch left to assert and the old check
# failed permanently on its own absence. What keeps production safe now is the
# absence of a link, so a PRESENT link is the violation — staying unlinked is
# still unversioned dashboard state, so it still needs a watchdog.
#
# None of these is expressible in this repository: `render.yaml` is not applied
# to the already-created service, and the Vercel Git connection lives only in
# the dashboard. So they cannot be enforced, only asserted — which is what this
# does.
#
# `deploy-production.yml` runs the same script as a preflight, so a deploy
# cannot proceed against drifted settings. This schedule is for the gap between
# deploys, which is where the drift would otherwise sit unnoticed.
#
# Semantics live in scripts/ci/production-guardrails.mjs.
# Unit tests: scripts/ci/__tests__/ (run via `npm run test:ci-scripts`).

on:
  schedule:
    # 07:15 UTC daily, a quarter past the migration-drift watchdog so the two
    # do not report at the same moment. One of the daily staggered Management-API
    # watchdogs. `production-uptime.yml` probes live `/health/ready` on its own
    # cadence and does not share this stagger. Full
    # schedule: docs/internal/ci-cd/AGENT_INFRA.md § Scheduled conformance.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-guardrails
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    # Secrets belong to the `automation` environment: `main` only, no required
    # reviewers (#2518, #2583).
    # See docs/internal/ci-cd/AGENT_INFRA.md § GitHub environments and bootstrap secrets.
    environment:
      name: automation
      deployment: false
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # From `.github/environments.json`, the one place the ids live (#2806).
      - name: Read production's provider ids
        id: ids
        env:
          TARGET_ENVIRONMENT: production
        run: node scripts/ci/provider-ids.mjs

      # Dependency-free (global fetch + the alert-issue helper), so no npm ci —
      # matching ci-wake.yml's deliberately minimal action surface.
      - name: Assert production deploy guardrails
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          # Passed rather than defaulted in the script: a watchdog that carries
          # its own copy of a service id keeps asserting against the old service
          # after a recreate, and reports green about an object nothing deploys
          # to. These come from `.github/environments.json`, the file the
          # production deploy reads its ids from too (#2806).
          RENDER_SERVICE_ID: ${{ steps.ids.outputs.render_service_id }}
          VERCEL_WEB_PROJECT_ID: ${{ steps.ids.outputs.vercel_web_project_id }}
          VERCEL_LANDING_PROJECT_ID: ${{ steps.ids.outputs.vercel_landing_project_id }}
          VERCEL_TEAM_ID: ${{ steps.ids.outputs.vercel_team_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/production-guardrails.mjs
