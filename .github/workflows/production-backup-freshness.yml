name: Production backup freshness

# Between-dump watch: the nightly production Postgres dump must stay fresh.
#
# Launch bar 2 needs a recoverable production dump. Nightly Backup
# (`db-backup.yml`) `backup-production` is the only copy of `frapp-prod`
# outside Supabase (its daily backups are deleted with the project and hold
# no Storage files). Nothing inside that
# workflow fails closed if the job stops, skips, hangs, or ages out. The
# reviewer watch (1956) only sees GitHub environment `production-backup`.
#
# 13:15 UTC was chosen to follow the dump window observed then (~11:00–12:47
# UTC; documented cron stays 06:30). GitHub has since started the dump as
# late as 14:46Z, and after 12:00Z every night from 09-27 to 10-01 (#3098), so
# on a late night this watch runs before that night's dump and judges the
# previous one. A missed night is still caught here the next day, once the
# last success passes 36 hours; the Sentry cron monitor reports the same miss
# at 18:30Z that day (`scripts/ci/sentry-cron-checkin.mjs`). Do not change
# `db-backup.yml` to make this job green.
#
# ── Why this job does NOT say `environment: production` ─────────────────────
# ADR-19 put Required reviewers on the `production` GitHub environment. A
# `schedule:` job that names it suspends on that gate and expires without
# probing (#1435). The dump jobs themselves use `production-backup` for the
# same reason. This workflow names no environment at all.
#
# Rules: scripts/ci/lib/backup-job-freshness.mjs (tests:
# scripts/ci/__tests__/backup-job-freshness.test.mjs). This watch's wiring:
# scripts/ci/production-backup-freshness.mjs (tests: scripts/ci/__tests__/production-backup-freshness.test.mjs).
# (`npm run test:ci-scripts`).
#
# Not a required PR check.

on:
  schedule:
    # 13:15 UTC daily (see the header on the dump window). One of the
    # daily staggered watchdogs. Full schedule:
    # docs/ci-cd/agent-infra.md § Scheduled conformance.
    #
    # ⚠️ GitHub DISABLES scheduled triggers in a repository with no activity for
    # 60 days, notifying the repo owner by email only. This watch then stops
    # with no alert, which reads exactly like a healthy backup. If the repo goes
    # dormant, re-enable it from the Actions tab. What watches the watchdogs:
    # docs/ci-cd/agent-infra.md § Scheduled conformance.
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # List Nightly Backup runs/jobs. Without this, an explicit permissions
      # block leaves Actions reads at none and every probe 403s.
      actions: read
      # The only write scope in this workflow, job-scoped: the alert issue.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/node-setup
        with:
          install: none

      # Dependency-free (global fetch + the alert-issue helper), so no npm ci —
      # matching production-guardrails.yml's deliberately minimal action surface.
      - name: Assert the nightly production dump is fresh
        env:
          # GITHUB_TOKEN only. No GITHUB_PAT: this job names no environment,
          # so a PAT would have to be a repository secret, readable from any
          # branch (#2518).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/production-backup-freshness.mjs
