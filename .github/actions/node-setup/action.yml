name: Node setup
description: >
  Sets up Node, then the dependency install the `install` input names. The one
  place `node-version` is written for every job that calls it, so a Node bump
  is one edit here instead of one per job (#1541).

# What this action deliberately does NOT do:
#
#   - Check out the repo. A local `uses: ./…` action is read from the
#     workspace, so the caller's `actions/checkout` has to run first, and any
#     `fetch-depth` stays on that call-site step.
#   - Serve a job whose workspace is not the workflow's own commit. A local
#     action loads from whatever tree is on disk when its step starts, so after
#     a checkout of another ref it is that commit's copy, or none at all when
#     the commit predates this file. `_deploy.yml` (checks out `inputs.sha`),
#     `release.yml` (checks out the deployed SHA), and the mobile jobs
#     (`_mobile-build.yml`, `_mobile-update.yml`, `deploy-production.yml`'s
#     `mobile-plan`) keep a hand-written `actions/setup-node` for that reason, pinned to the same action ref,
#     Node version and `package-manager-cache: false` as below by
#     `scripts/ci/__tests__/node-setup-action.test.mjs`.
#   - Reach every job. A job that sets up no Node, but runs `node` itself or
#     through a composite action that does (`db-offsite-backup`), runs on the
#     runner's preinstalled Node, so a bump here doesn't move it (#3081 lists
#     them).
#
# Every step below is pinned by that test, in order: the per-job guards (the
# cold-build jobs, mobile-validate's bundle order, the watchdogs' "no npm ci")
# read only the calling job, so a step added here would reach all of them
# unseen.

inputs:
  install:
    description: >
      Required; there is no default, so every call site says what it installs.
      `ci`: `npm ci`. `omit-dev`: `npm ci --omit=dev`, the production-pruned
      tree Vercel builds from (`web-production-build`). `none`: Node only, for
      a job that runs repo scripts with no dependencies. `ci` restores
      `node_modules` as `npm ci` left it, saved before anything was built, so
      it holds no package's `dist/` and a cold-tree job stays cold; on a miss,
      and for `omit-dev`, it restores the `~/.npm` download cache, which holds
      tarballs only. `none` restores no cache.
    required: true
  save-modules:
    description: >
      "true" saves `node_modules` after an `install: ci` that missed the
      cache. Only ci.yml's `packages-build` sets it: every other CI job waits
      for that one, so they all restore what it saved, and one job pays the
      upload instead of twenty.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The runner does not enforce `required: true` on a composite action's
    # input, and a misspelt value would otherwise match no `if:` below and skip
    # the install with the step green.
    - name: Check the install mode
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
      run: |
        case "$INSTALL" in
          ci | omit-dev | none) ;;
          *)
            echo "::error::node-setup: install must be ci, omit-dev or none (got '$INSTALL')"
            exit 1
            ;;
        esac

    # `node_modules` exactly as `npm ci` left it for this lockfile and these
    # manifests (2026-11-11, about a minute off every job). The key holds every
    # package.json because a hit skips `npm ci`, which is what refuses a
    # manifest that disagrees with the lockfile. No restore-keys: `npm ci`
    # deletes a partial match anyway. `24` is the Node major below.
    - name: Restore node_modules
      id: modules
      if: inputs.install == 'ci'
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

    # `package-manager-cache: false` keeps `cache:` the only switch. From v5,
    # setup-node turns npm caching on by itself whenever `cache` is empty and
    # the root package.json's `packageManager` names npm, which it does, so
    # without it `install: none` would restore and save `~/.npm` too.
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: ${{ inputs.install != 'none' && steps.modules.outputs.cache-hit != 'true' && 'npm' || '' }}
        package-manager-cache: false

    - name: Install dependencies
      if: inputs.install == 'ci' && steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    # Straight after the install, before any step of the job writes a build
    # output, so the entry is the bare install tree.
    - name: Save node_modules
      if: inputs.install == 'ci' && steps.modules.outputs.cache-hit != 'true' && inputs.save-modules == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Install production dependencies only
      if: inputs.install == 'omit-dev'
      shell: bash
      run: npm ci --omit=dev
