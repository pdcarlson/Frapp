name: Supabase CLI
description: >
  Install the Supabase CLI at the single version this repo pins. Every workflow
  that needs the CLI calls this action, so the version exists in exactly one
  place.

# No inputs, deliberately.
#
# A `version:` input would put the pin back at the call sites -- a copy at
# each again, with the action reduced to a wrapper that dedupes nothing. The reason
# the version is single-sourced is that those copies have to AGREE: the
# production apply and the migration-replay rehearsal exist to be "the same CLI
# code path" (check-migration-replay.mjs, REPLAY_SUPABASE_CLI), and a rehearsal on a
# different CLI build than the apply proves nothing about the apply. Drift there
# fails silently -- both runs go green, on different binaries.
#
# So a caller that needs a different version does not pass one; it changes the
# pin here, for everybody, on purpose.
runs:
  using: composite
  steps:
    # Pinned to a commit (#2647): this runs in the deploy jobs beside
    # Infisical-injected secrets. `@v2` was not even a tag but the publisher's
    # moving `v2` branch. Resolved 2026-09-28 with
    # `git ls-remote https://github.com/supabase/setup-cli refs/heads/v2`, whose
    # head is the same commit as the lightweight tag `v2.1.2`, so behaviour is
    # unchanged. To bump: `git ls-remote` the release tag; this publisher also
    # ships annotated tags, whose `^{}` line is the commit to pin (the other SHA
    # is the tag object). Change the SHA and the version comment together.
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
      with:
        version: 2.117.0
