name: Download migration snapshot
description: >
  Download the newest migration snapshot published from `main` by
  `migration-snapshot.yml`, with the job's own GITHUB_TOKEN and no secret, and
  export its path as MIGRATION_SNAPSHOT to every later step of the job. The
  calling job needs `permissions: actions: read`. Validation (schema, age,
  refs) is the reading script's job: `scripts/ci/lib/migration-snapshot.mjs`.

# Why this exists (#2518): the migration gates run on `pull_request`, and a
# same-repository PR runs its own branch's workflow definitions, so any secret a
# PR job can read, any branch can read. The gates used to inject Infisical for
# one Management API read. `migration-snapshot.yml` now makes that read, in a
# job meant to run from `main` only (its environment's rule is the owner's
# #2583), and PR jobs fetch the result here.
#
# ── Which run is trusted ────────────────────────────────────────────────────
# A successful run of THIS repository's publisher, triggered by `workflow_run`,
# `schedule` or `workflow_dispatch`, whose commit is on `main`. That last check
# carries the weight. A branch can edit its own copy of
# `migration-snapshot.yml`, make it need no secret, run it, and upload an
# artifact with the same name. `event` and `head_branch` catch the obvious
# forms (a pull_request run, a push to the branch, a fork whose branch is
# called `main`), but not a dispatch on a TAG named `main`: GitHub reports a
# tag run's `head_branch` as the bare tag name, and the tag's own workflow
# file runs. So each candidate's `head_sha` must be an ancestor of `main`
# (compare API: `identical` or `ahead`), which means the file that ran is one
# `main` actually carried. The compare target is main's SHA, read from
# `git/ref/heads/main`, never the bare name `main`: with a tag of that name the
# bare name is ambiguous, and git resolves it to the tag.
#
# ── Newer than the last deploy (`on-stale`) ─────────────────────────────────
# Freshness matters only where the snapshot gates a merge: runs of the required
# `migration-order` and `migration-replay` on any ref but `main`. That means a
# pull request, and also a dispatch on a PR's branch, whose check runs land on
# the PR's head too. Those callers pass `on-stale: wait`. The step then requires the snapshot to have been read
# after the latest finished `Deploy API` or `Deploy production` run on `main`,
# with no `Deploy API` run in flight. Those are the only workflows that apply
# migrations, and each triggers a publish when it finishes. While that is not
# yet true, the step waits, polling every 45 seconds for up to 15 minutes. The
# budget has to cover the rest of an in-flight Deploy API run, the time GitHub
# takes to mark that run complete (which is what fires the chained publish: run
# 35876748928's `updated_at` trailed its last job by over five minutes), and the
# publish itself. None of those has been measured end to end, because the
# publisher has not yet run on `main`. If the snapshot is still stale
# after that, the step fails and names the publisher. Without this, a failed
# post-deploy publish would leave the gates judging a PR against the
# pre-deploy state until the 24-hour age limit ran out. The worst case is a PR
# that removes a migration the deploy had just applied: it merges, and the
# next `db push` meets a foreign row.
#
# Everything else passes `on-stale: use` and takes the newest trusted
# snapshot as it is. That covers push-to-main and dispatch-on-main runs and the
# report-only `migration-drift`. On a push the migration has already merged,
# so a snapshot a few minutes older decides nothing, and `deploy-production.yml`
# re-reads production live at deploy time. Waiting there would cost more than
# it buys. It would red a required check on a `main` commit whenever the budget
# ran out, a commit `validate-deploy-sha.mjs` then refuses to deploy, and
# nothing re-runs it. It would also hold main's non-cancellable concurrency
# group open, so that a queued run behind it gets replaced and its required
# checks end `cancelled`. The drift job reports and does not gate. It
# still catches a stuck publisher without waiting: a migration past its grace
# window that the snapshot is too old to show turns it red as `stale`, naming
# the publisher (`classifyGateDrift`).
#
# What `wait` does not close: a `Deploy production` run still in flight. It is
# not waited for, because its one job ships for minutes after it migrates and
# would outlast the budget. The staging row of the same snapshot usually
# already shows the migration, since staging applied it at merge time. A live
# read had the same point-in-time race, which was open until the apply.

inputs:
  on-stale:
    description: >
      `wait` (the default) or `use`. What to do while the newest trusted snapshot
      predates a finished deploy on main, or a Deploy API run is in flight: wait
      up to 15 minutes and then fail, or take it as it is. Pass `wait` only where
      the snapshot gates a pull request's merge; see the header comment. Any
      value but `use` waits, so a typo errs toward the stricter check.
    required: false
    default: wait

runs:
  using: composite
  steps:
    - name: Find the newest snapshot published from main
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        ON_STALE: ${{ inputs.on-stale }}
      run: |
        set -euo pipefail
        RUNS="${RUNNER_TEMP}/migration-snapshot-runs.json"
        CANDIDATES="${RUNNER_TEMP}/migration-snapshot-candidates.txt"
        DEADLINE=$(( $(date +%s) + 900 ))

        while :; do
          # main's SHA, not the bare name: a tag called `main` would make the
          # name ambiguous, and it is the forgery this check exists to stop.
          # Re-read each round, because main can move while this waits.
          if ! MAIN_SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"; then
            echo "::error::Could not read refs/heads/main."
            exit 1
          fi
          if ! gh api "repos/${REPO}/actions/workflows/migration-snapshot.yml/runs?branch=main&status=success&per_page=30" > "$RUNS"; then
            echo "::error::Could not list Migration snapshot runs. Does the job grant 'actions: read', and is .github/workflows/migration-snapshot.yml on main?"
            exit 1
          fi
          jq -r --arg repo "$REPO" '
            .workflow_runs[]
              | select(.head_branch == "main")
              | select(.head_repository.full_name == $repo)
              | select(.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch")
              | "\(.id) \(.head_sha) \(.run_started_at // .created_at)"' "$RUNS" > "$CANDIDATES"

          RUN_ID=""
          RUN_STARTED=""
          while read -r id sha started; do
            if ! status="$(gh api "repos/${REPO}/compare/${sha}...${MAIN_SHA}" --jq .status < /dev/null)"; then
              echo "::error::Could not check whether Migration snapshot run ${id}'s commit ${sha} is on main."
              exit 1
            fi
            case "$status" in
              identical|ahead) RUN_ID="$id"; RUN_STARTED="$started"; break ;;
              *) echo "::warning::Ignoring Migration snapshot run ${id}: its commit ${sha} is not on main (compare status: ${status})." ;;
            esac
          done < "$CANDIDATES"
          if [ -z "$RUN_ID" ]; then
            # Nothing to wait for: no trusted publish exists at all.
            echo "::error::No successful Migration snapshot run from main. Run it: Actions → Migration snapshot → Run workflow (branch: main). If it fails, its log names the cause."
            exit 1
          fi
          if [ "$ON_STALE" = "use" ]; then break; fi

          # Which completed deploy runs finished after the snapshot started?
          # Look at the last 100 runs, not only the newest: the list is ordered
          # by creation, and a re-run of an older run can finish last (Deploy API
          # run 31318329969 was re-run a day after it was created). A run's
          # `updated_at` is only a first filter: it can trail the run's last job
          # by minutes (run 35876748928: last job 14:48:06Z, updated_at
          # 14:53:24Z), which would reject the very publish that run triggered.
          # So the finish is read from its jobs' `completed_at`.
          # ISO-8601 UTC timestamps of one fixed width compare as strings.
          LATEST_DEPLOY=""
          DEPLOYS="${RUNNER_TEMP}/migration-snapshot-deploys.json"
          for wf in deploy-api.yml deploy-production.yml; do
            if ! gh api "repos/${REPO}/actions/workflows/${wf}/runs?branch=main&status=completed&per_page=100" > "$DEPLOYS"; then
              echo "::error::Could not read the recent ${wf} runs, so the snapshot cannot be shown to postdate them."
              exit 1
            fi
            # Newest first, and one run that finished after the snapshot is
            # enough to wait on, so a stale snapshot costs one jobs call, not one
            # per deploy since it.
            # Captured first, so a jq failure fails the step: in a `for` list it
            # would read as "no deploy since", which is the permissive answer.
            # This repository's runs only. A fork PR from a branch named `main`
            # triggers a Deploy API run listed under head_branch `main`, and
            # its chained publish is (rightly) not trusted above, so counting
            # it would leave no acceptable snapshot at all.
            if ! newer="$(jq -r --arg since "$RUN_STARTED" --arg repo "$REPO" '[.workflow_runs[] | select(.head_repository.full_name == $repo) | select(.updated_at > $since)] | sort_by(.updated_at) | reverse | .[].id' "$DEPLOYS")"; then
              echo "::error::Could not parse the recent ${wf} runs."
              exit 1
            fi
            for run in $newer; do
              if ! finished="$(gh api "repos/${REPO}/actions/runs/${run}/jobs?per_page=100" --jq '[.jobs[].completed_at | select(. != null)] | max // ""')"; then
                echo "::error::Could not read the jobs of ${wf} run ${run}."
                exit 1
              fi
              if [[ "$finished" > "$RUN_STARTED" ]]; then LATEST_DEPLOY="$finished"; break 2; fi
            done
          done
          if ! gh api "repos/${REPO}/actions/workflows/deploy-api.yml/runs?branch=main&status=in_progress&per_page=100" > "$DEPLOYS"; then
            echo "::error::Could not read in-progress Deploy API runs."
            exit 1
          fi
          if ! staging_running="$(jq -r --arg repo "$REPO" '[.workflow_runs[] | select(.head_repository.full_name == $repo)] | length' "$DEPLOYS")"; then
            echo "::error::Could not parse in-progress Deploy API runs."
            exit 1
          fi

          WAIT_FOR=""
          if [ "$staging_running" != "0" ]; then
            WAIT_FOR="a Deploy API run is in progress on main and may be applying migrations"
          elif [ -n "$LATEST_DEPLOY" ]; then
            WAIT_FOR="the newest Migration snapshot (run ${RUN_ID}, started ${RUN_STARTED}) predates a deploy on main that finished at ${LATEST_DEPLOY}, and the publish that deploy triggers has not succeeded yet"
          fi
          if [ -z "$WAIT_FOR" ]; then break; fi
          if (( $(date +%s) >= DEADLINE )); then
            echo "::error::Waited 15 minutes: ${WAIT_FOR}. Re-run this check once Migration snapshot has published; if it is failing, its log names the cause: ${GITHUB_SERVER_URL}/${REPO}/actions/workflows/migration-snapshot.yml"
            exit 1
          fi
          echo "Waiting 45s: ${WAIT_FOR}."
          sleep 45
        done

        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
        if [ "$ON_STALE" = "use" ]; then
          echo "Using the snapshot published by ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID} (started ${RUN_STARTED}; on-stale: use, so not checked against later deploys)"
        else
          echo "Using the snapshot published by ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID} (started ${RUN_STARTED}; no deploy on main has finished since)"
        fi

    - name: Download the snapshot
      uses: actions/download-artifact@v4
      with:
        name: migration-snapshot
        run-id: ${{ steps.find.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/migration-snapshot

    # An env var rather than an action output: an output's `value:` is a
    # template expression above `runs:`, which this repo's manifest guard
    # (scripts/ci/__tests__/infisical-secrets-action.test.mjs) refuses.
    - name: Export the snapshot path
      shell: bash
      run: |
        set -euo pipefail
        FILE="${RUNNER_TEMP}/migration-snapshot/migration-snapshot.json"
        if [ ! -f "$FILE" ]; then
          echo "::error::The migration-snapshot artifact has no migration-snapshot.json."
          exit 1
        fi
        echo "MIGRATION_SNAPSHOT=$FILE" >> "$GITHUB_ENV"
