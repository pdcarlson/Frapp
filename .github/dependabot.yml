# Dependabot configuration — automated npm dependency updates.
#
# Scope: ONE `npm` entry at the repo root. The npm workspaces (`apps/*`,
# `packages/*`) all resolve through the single root `package-lock.json`, so one
# ecosystem entry covers the whole monorepo. Adding per-workspace entries would
# produce duplicate PRs against the same lockfile.
#
# Noise floor: every Dependabot PR costs agent babysitting (the normal PR
# lifecycle in AGENTS.md), so minor+patch updates are collapsed into a single
# weekly PR. Majors stay individual — they need to be read one at a time.
#
# Safety net: CI (`npm ci`, lint, type-check, unit + E2E suites) plus the
# blocking high/critical audit gate (`npm run check:npm-audit`, #618) is what
# makes auto-updates safe to merge. Docs: docs/internal/ci-cd/AGENT_INFRA.md.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    # Grouped minor+patch = 1 PR; anything left is a major, and majors are
    # deliberately ungrouped so each gets its own reviewable diff.
    open-pull-requests-limit: 5
    labels:
      - "area:deps"
    # `include: scope` makes Dependabot append the scope itself — "(deps)" for
    # runtime deps, "(deps-dev)" for devDependencies — so the prefix here must
    # stay bare "chore", not "chore(deps)", or the scope renders twice.
    # Yields: `chore(deps): bump …` / `chore(deps-dev): bump …`.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    # ── The React pin ────────────────────────────────────────────────────
    # React is pinned to an EXACT version in every workspace plus a root
    # `overrides` entry. React Native bundles a react-native-renderer that
    # asserts exact version equality with `react` at runtime; its peer range
    # is a caret and does not express that, so npm would accept a newer React
    # silently, hoist it, and kill apps/mobile on first render with "Invalid
    # hook call". Only booting the app on a device catches it.
    # The versions themselves live in AGENTS.md § Gotchas — deliberately not
    # repeated here, because this comment carried a stale pair for months.
    # See AGENTS.md § Gotchas and PR #842.
    #
    # These families therefore move only as a version-locked set, via a
    # planned Expo SDK upgrade (#2329) — never as an isolated Dependabot bump.
    # (#289 was the SDK 54 → 57 upgrade and is closed; #2329 is the open
    # tracker for the next one.)
    #
    # KNOWN, DELIBERATE GAP: ignore conditions apply to Dependabot *security*
    # updates as well as version updates, so a CVE in one of these packages
    # will NOT open a PR automatically. That is the accepted trade — an
    # isolated security bump here breaks the runtime — but it means these
    # families need a human/agent to carry a CVE through the SDK-upgrade path.
    # `npm run check:npm-audit` still fails CI on such an advisory, so it
    # surfaces loudly rather than silently.
    #
    # The set this gap covers GREW when the Expo client list below was
    # completed to all 21 packages: it now also suppresses security PRs for
    # expo-camera, expo-image-picker, expo-document-picker, expo-location and
    # expo-notifications — the media, file, location and push surfaces. These
    # entries carry no `update-types`, so in-SDK 57.0.x patches are frozen too,
    # not just the SDK-line majors that caused the break. Whether that is still
    # the right trade at 21 packages is #2331; until it is decided, the blanket
    # ignore stands, because an isolated bump here is what broke the build.
    # When it does bite: `check:npm-audit` is a required check, so an advisory
    # here goes red on every open PR at once. The unblock path is an entry in
    # scripts/npm-audit-allowlist.json (reason + tracking issue + expiry), not
    # a one-package bump.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Pinned to a bare exact version in apps/mobile alongside react itself —
      # the same exact-equality constraint, so it joins the same locked set.
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "expo"
      - dependency-name: "@expo/*"
      # NOTE: the Expo client packages are listed one by one on purpose — do
      # NOT collapse them into `expo-*`. That glob also matches
      # `expo-server-sdk`, which is an apps/api server dependency (the push
      # delivery client) with no tie to the mobile SDK lock; globbing would
      # freeze it silently and forever. If an Expo SDK upgrade adds a new
      # client package here, add it to this list.
      #
      # This list must cover EVERY `expo-*` entry in apps/mobile/package.json.
      # That is mechanical, not a per-package judgement: an Expo client
      # package's major version IS its SDK line. Ten of them sat outside this
      # list until PR #2338, and two of those cost a production build —
      # #2218 and #2217 moved expo-apple-authentication and expo-localization to
      # 58.0.0, and `eas build -p ios` failed with
      # `type 'Utilities' has no member 'keyWindow'`. Nothing in CI compiles
      # Swift, so the list is the only gate. Why the rule is mechanical and
      # what the break looks like: docs/internal/ci-cd/AGENT_INFRA.md
      # § The ignore list is a runtime constraint, not a preference.
      # Nothing enforces this roster mechanically today — that is #2330.
      #
      # These move only as a version-locked set via a planned SDK upgrade
      # (#2329), like the React family above.
      - dependency-name: "expo-apple-authentication"
      - dependency-name: "expo-application"
      - dependency-name: "expo-camera"
      - dependency-name: "expo-constants"
      - dependency-name: "expo-crypto"
      - dependency-name: "expo-device"
      - dependency-name: "expo-document-picker"
      - dependency-name: "expo-file-system"
      - dependency-name: "expo-font"
      - dependency-name: "expo-image-picker"
      - dependency-name: "expo-linking"
      - dependency-name: "expo-localization"
      - dependency-name: "expo-location"
      - dependency-name: "expo-network"
      - dependency-name: "expo-notifications"
      - dependency-name: "expo-router"
      - dependency-name: "expo-secure-store"
      - dependency-name: "expo-sharing"
      - dependency-name: "expo-splash-screen"
      - dependency-name: "expo-status-bar"
      - dependency-name: "expo-web-browser"

      # ── The vendored-generator pins ──────────────────────────────────────
      # `packages/chapter-theme/src/vendor/generate-radix-colors.ts` is upstream
      # Radix code held byte-for-byte (see that directory's README). Its runtime
      # deps are pinned to match upstream's own package.json exactly, because
      # the generator is written and tested against those versions and the
      # colour math is the whole point — `spec/ui/design-system/accent-engine.md`
      # §8 guarantees accent contrast *by construction*, and the construction
      # has to be the one the guarantee was written against.
      #
      # `colorjs.io` is the pin that Dependabot kept trying to move: 0.5.2 ->
      # 0.7.1 arrives as a *minor* under 0.x semver, so it landed in the
      # grouped PR, and it changed `Coords` to `[number | null, ...]` for CSS
      # Color 4 `none` components. That broke `@repo/chapter-theme`'s build with
      # 24 type errors and took `packages-build`, `clean-checkout-typecheck` and
      # `api-docker-build` down with it (PR #1003).
      #
      # That failure is the gate working, not a gate to route around: the
      # `noUncheckedIndexedAccess: false` note in that package's tsconfig.json
      # says in as many words that typechecking the vendored file is what
      # surfaces "a breaking change in colorjs.io's API, found on resync".
      # Moving this pin means re-vendoring the generator from upstream at a
      # commit that itself moved, then re-running `signet.spec.ts` — a resync,
      # not a bump. Ignoring it here keeps that decision a human one.
      #
      # Only `colorjs.io` is listed. The generator's two other pins are left
      # under Dependabot on purpose: `@radix-ui/colors` is exact-pinned but its
      # scales are exactly what `signet.spec.ts` checks, so a bad bump fails
      # loudly, and `bezier-easing` is a caret range upstream chose itself
      # (`^2.1.0`) — only its 3.x is unusable here, and a major arrives as its
      # own reviewable PR rather than inside the group.
      - dependency-name: "colorjs.io"

      # ── The postcss / Next pin ───────────────────────────────────────────
      # `packages/theme` is the only workspace that declares `postcss` at all,
      # and its range must stay LOW enough to resolve to whatever copy `next`
      # drags in — not high enough to force its own.
      #
      # `next` depends on `postcss` at an EXACT version (`8.5.23` today), so it
      # pins the hoisted root copy. Raising this declaration above that exact
      # version does not move the root copy; it makes npm nest a second one at
      # `packages/theme/node_modules/postcss`. Two copies means two distinct
      # `Plugin`/`AcceptedPlugin` type identities, and `tailwind.config.spec.ts`
      # — which hands the Tailwind plugin to postcss — stops compiling with
      # TS2321 "Excessive stack depth" plus TS2769 "No overload matches this
      # call". That is what took `@repo/theme#check-types` down in the grouped
      # PR #2352, which failed `clean-checkout-typecheck` and
      # `lint-and-typecheck` with it.
      #
      # So the effective postcss version is Next's business, not ours: it moves
      # when `next` moves, which Dependabot still proposes freely. Ignoring the
      # direct bump therefore does NOT freeze postcss — it only stops
      # Dependabot re-proposing a range that de-dupes worse than the one we
      # have. If `packages/theme` ever needs a postcss API newer than Next's
      # pin, the fix is a root `overrides` entry (one copy for everyone), not a
      # higher range here.
      - dependency-name: "postcss"

      # ── The NestJS 12 hold ───────────────────────────────────────────────
      # Majors only. Like the ESLint 10 hold below, this is blocked on a
      # dependency, not on our own code: `@sentry/nestjs` does not support
      # NestJS 12 in any stable release. 10.75.0 (newest) still peer-requires
      # `@nestjs/core`/`@nestjs/common` at `^8||^9||^10||^11`. The only
      # published build that adds `^12.0.0` is `11.0.0-rc.0` — a release
      # candidate, and `@sentry/nestjs` is the API's error reporting, so
      # running it pre-release to satisfy a dependency bump is the wrong trade.
      #
      # The four packages move as a set — `@nestjs/platform-express@12` and
      # `@nestjs/testing@12` both peer-require `@nestjs/core@^12` — which is
      # why #2353 and #2355 were individually unmergeable no matter what CI
      # said: each bumped one package and left `core`/`common` at 11.
      # `@nestjs/swagger@12` joins them for the same reason (`^12.0.0` peers).
      #
      # Ignoring only the major keeps 11.x minors and patches flowing, so this
      # is NOT the security gap described for the React/Expo families above.
      #
      # NOT held: `@nestjs/schedule`, whose 12.x peers are
      # `^11.0.0 || ^12.0.0` — it runs on Nest 11 and is already on 12 here.
      # Check the peer range before adding a fifth entry; "starts with
      # @nestjs/" is not the rule.
      #
      # Re-evaluate when `@sentry/nestjs` 11 ships stable. Tracking: #2357.
      - dependency-name: "@nestjs/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/platform-express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/swagger"
        update-types: ["version-update:semver-major"]

      # ── The ESLint 10 hold ───────────────────────────────────────────────
      # Majors only. ESLint 10 is blocked on a plugin, not on our own code:
      # `eslint-plugin-react` has no v10-compatible release — 7.37.5 is the
      # newest published version and its peer range still ends at `^9.7`. Under
      # v10 it throws `contextOrFilename.getFilename is not a function` from its
      # React-version *detection* path, because v10 removed the deprecated
      # `context` methods it calls.
      #
      # Measured, so the re-evaluation is cheap when the plugin ships v10:
      # pinning `settings.react.version` in `packages/eslint-config` skips the
      # detection path and the whole monorepo lints clean on v10. That was
      # rejected for now — it runs a core plugin outside its declared peer range
      # and hardcodes a React version that then has to be hand-synced — but it
      # means the upgrade is a small change, not an unknown.
      #
      # The two move as a set: `@eslint/js@10` peer-requires `eslint@^10`, so
      # bumping either alone fails `npm ci` with ERESOLVE. Ignoring only the
      # major keeps 9.x minors and patches flowing. Reopen #943/#944's work when
      # `eslint-plugin-react` declares v10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

      # ── TypeScript 7 dual-install ────────────────────────────────────────
      # TypeScript 7 is native tsc with no JS compiler API. The `typescript`
      # package is aliased to `@typescript/typescript6@6.0.2` (Nest CLI,
      # typescript-eslint peer <6.1.0, ts-jest peer <7). Native 7 lives at
      # `@typescript/native` (`npm:typescript@7.0.2`) and provides `tsc`.
      # Flattening `typescript` to 7.x is what failed #1031. Do not ignore
      # these — 7.x patches on `@typescript/native` and 6.0.x patches on the
      # alias should still flow — but do not "fix" the alias back to
      # typescript@7. Canonical write-up:
      # docs/internal/ci-cd/AGENT_INFRA.md § TypeScript 7.
